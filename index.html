                activeDong = "전체";
                lastAptByDay[gDayKey()] = "전체";
                document.querySelectorAll('.apt-btn').forEach(b => b.classList.remove('active'));
                allAptBtn.classList.add('active');
                document.getElementById('dong-section').style.display = 'none';
                renderOrderCards(filtered);
            };
            aptContainer.appendChild(allAptBtn);

            apartments.forEach(apt => {
                const btn = document.createElement('button');
                btn.className = `btn-select apt-btn ${apt === activeApartment ? 'active' : ''}`;
                btn.innerHTML = `<span style="display:block; line-height:1.15;">${apt}</span><span style="display:block; font-size:11px; font-weight:800; line-height:1.15; opacity:0.85;">${getDeliveryProgressText(aptGroups[apt])}</span>`;
                btn.onclick = () => {
                    // [수정] 그 아파트에서 마지막으로 보던 동으로 되돌아간다 (없으면 전체)
                    activeDong = lastDongByApt[gAptKey(apt)] || "전체";
                    if (activeApartment === apt) {
                        // [변경] 토글 해제 → 전체(선택 없음, 하이라이트 없음)
                        activeApartment = "전체";
                        lastAptByDay[gDayKey()] = "전체";
                        document.querySelectorAll('.apt-btn').forEach(b => b.classList.remove('active'));
                        allAptBtn.classList.add('active');   // [수정] 전체 버튼에 불이 들어오게
                        document.getElementById('dong-section').style.display = 'none';
                        renderOrderCards(filtered);
                    } else {
                        activeApartment = apt;
                        lastAptByDay[gDayKey()] = apt;
                        document.querySelectorAll('.apt-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderDongButtons(aptGroups[apt]);
                    }
                };
                aptContainer.appendChild(btn);
            });

            if (activeApartment === "전체") {
                document.getElementById('dong-section').style.display = 'none';
                renderOrderCards(filtered);
            } else if (aptGroups[activeApartment]) {
                renderDongButtons(aptGroups[activeApartment]);
            } else {
                activeApartment = "전체";
                allAptBtn.classList.add('active');
                document.getElementById('dong-section').style.display = 'none';
                renderOrderCards(filtered);
            }
        }

        /* [신규] 하위 묶음 이름 — 카드 제목과 같은 기준을 쓴다.
           묶어 둔 구역(빌라)이면 구역 이름, 아니면 예전처럼 '101동'.
           '기타' 탭이 동별로 쪼개지던 문제를 여기서 잡는다. (빌라는 '102호'의 첫 숫자를
           동으로 넘겨짚어 102동·203동처럼 엉뚱한 칸이 잔뜩 생겼다) */
        function getDongGroupName(item) {
            const zone = findCustomZoneName(item.address);
            if (zone) return zone;
            return formatDongName(getDongNumber(item.addressDetail, item.address));
        }


        /* [신규] 공동현관 비번 빈칸 자동 채우기
           손님이 주문서에 적어 둔 '공동현관 입력값'을, 그 동·호수에 적어 둔 비번이 없을 때만 넣는다.
             · 그 호수를 덮는 칸에 비번이 있으면 손대지 않는다 (1-2라인이 있으면 2호는 이미 덮인 것이다)
             · 단지 공용 비번은 따로 관리하는 값이라, 있어도 그 호수 칸은 따로 채운다
             · 칸은 쓰던 방식 그대로 만든다 — 예: 1304호면 '13동_4-4라인'
             · 빌라·다세대(기타·묶어 둔 구역)는 집집마다 달라 넣지 않는다 */
        async function gAutoFillEntrancePwd() {
            const seen = new Set();
            const jobs = [];
            (rawOrders || []).forEach(it => {
                if (!it) return;
                const pwd = String(it.entrance || '').trim();
                if (!pwd) return;
                // [수정] '경비실'처럼 글자만 적어 둔 것은 비번이 아니라 넣지 않는다 (숫자가 둘 이상 있어야 한다)
                if ((pwd.match(/\d/g) || []).length < 2) return;
                if (findCustomZoneName(it.address)) return;
                const apt = extractApartmentName(it.address || '');
                if (!apt || apt === '기타') return;
                // [수정] 단지 공용 비번은 따로 관리하므로, 있어도 그 호수에 맞는 칸은 따로 채운다
                const dong = getDongGroupName(it);
                if (!dong || dong === '기타') return;
                const ho = gHoOf(it.addressDetail || '');
                if (ho == null) return;
                const covered = gSlotsOf(apt, dong).some(s => String(s.pwd || '').trim()
                    && (s.from == null || (ho >= s.from && ho <= s.to)));
                if (covered) return;
                const key = gSlotKey(dong, ho, ho);
                const id = `${apt}|${key}`;
                if (seen.has(id)) return;
                seen.add(id);
                jobs.push({ apt, key, pwd });
            });
            if (!jobs.length) return 0;

            let n = 0;
            for (const j of jobs) {
                try {
                    const url = `${FIREBASE_DB_URL}entrance_passwords/${encodeURIComponent(gAptRoadKey(j.apt))}/${encodeURIComponent(j.key)}.json`;
                    const res = await fetch(url, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(j.pwd)
                    });
                    if (!res.ok) continue;
                    if (!entrancePasswords[j.apt]) entrancePasswords[j.apt] = {};
                    entrancePasswords[j.apt][j.key] = j.pwd;
                    n++;
                } catch (e) { /* 하나 실패해도 나머지는 넣는다 */ }
            }
            if (!n) return 0;
            try { localStorage.setItem('moket_entrance_passwords_cache', JSON.stringify(entrancePasswords)); } catch (e) { }
            renderFilteredData();
            showToast(`공동현관 비번 ${n}곳을 손님이 적은 값으로 채웠습니다.`);
            return n;
        }

        /* ===== [신규] 설정 =====
           공동현관 비번과 아파트 순서를 여기서 고친다.
             · 아파트 순서 — 아파트 단추가 나오는 순서. 정해 둔 것이 없으면 예전처럼 그날 집 수가 많은 곳부터.
             · 정한 순서는 서버(apartment_order)에 담아 기사 모두가 같은 순서로 본다. */
        const APT_ORDER_KEY = 'moket_apt_order';
        let APT_ORDER = [];
        try { const _c = localStorage.getItem(APT_ORDER_KEY); if (_c) APT_ORDER = JSON.parse(_c) || []; } catch (e) { }

        async function loadApartmentOrder() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}apartment_order.json?t=${Date.now()}`);
                if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
                const data = await res.json();
                const list = Array.isArray(data) ? data : (data ? Object.values(data) : []);
                APT_ORDER = list.map(x => String(x || '').trim()).filter(Boolean);
                try { localStorage.setItem(APT_ORDER_KEY, JSON.stringify(APT_ORDER)); } catch (e) { }
            } catch (e) {
                console.warn('아파트 순서 불러오기 실패:', e);   // 못 받으면 기기에 담아 둔 순서를 쓴다
            }
            return APT_ORDER;
        }

        // 정해 둔 순서에서 몇 번째인지. 안 적힌 아파트는 뒤로 보낸다.
        function gAptOrderIdx(name) {
            const i = APT_ORDER.indexOf(name);
            return i < 0 ? Infinity : i;
        }

        function openSettings() {
            const me = window.gStaffMe, el = document.getElementById('staff-me-label');
            if (el && me) el.innerText = `${me.name || me.email} (${me.role === 'store' ? '가게' : '기사'})`;
            document.getElementById('settings-modal').style.display = 'flex';
        }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        function settingsOpenPwd() { closeSettings(); openPasswordFinder(true); }

        // ── 아파트 순서 고치기
        let aptOrderEdit = [];
        function openAptOrder() {
            const list = [];
            const add = n => { n = String(n || '').trim(); if (n && n !== '기타' && !list.includes(n)) list.push(n); };
            APT_ORDER.forEach(add);
            Object.keys(window.__aptGroupsNow || {}).forEach(add);   // 오늘 배달이 있는 아파트
            /* [수정] 오늘 것만 보여 주니 오늘 안 가는 아파트는 순서를 정해 둘 수 없었다.
               받아 둔 주문 전체에서 배달 간 적 있는 아파트를 모두 넣는다. 비번을 적어 둔 곳도 함께. */
            (rawOrders || []).forEach(o => add(extractApartmentName(o && o.address)));
            Object.keys(entrancePasswords || {}).forEach(add);
            aptOrderEdit = list;
            closeSettings();
            document.getElementById('apt-order-modal').style.display = 'flex';
            renderAptOrder();
        }
        function closeAptOrder() { document.getElementById('apt-order-modal').style.display = 'none'; }

        function renderAptOrder() {
            const box = document.getElementById('apt-order-body');
            if (!box) return;
            if (!aptOrderEdit.length) {
                box.innerHTML = `<div style="padding:26px 0; text-align:center; color:#94a3b8; font-size:13px; font-weight:700;">순서를 정할 아파트가 없습니다.</div>`;
                return;
            }
            box.innerHTML = aptOrderEdit.map((name, i) => {
                const held = aptDrag && aptDrag.i === i;
                return `
                <div data-apt-row="${i}" style="display:flex; align-items:center; gap:10px; padding:11px 10px; margin-top:${i ? 6 : 0}px; border:1.5px solid ${held ? '#93c5fd' : '#e2e8f0'}; border-radius:11px; background:${held ? '#eff6ff' : '#fff'}; ${held ? 'box-shadow:0 6px 14px rgba(37,99,235,.18);' : ''}">
                    <span style="flex:0 0 22px; font-size:12.5px; font-weight:900; color:#94a3b8;">${i + 1}</span>
                    <span style="flex:1; min-width:0; font-size:14px; font-weight:800; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${gEsc(name)}</span>
                    <span data-apt-grip="${i}" title="끌어서 옮기기"
                        style="flex:0 0 auto; width:42px; height:36px; display:flex; align-items:center; justify-content:center; border:1.5px solid #e2e8f0; border-radius:9px; background:#f8fafc; color:#64748b; font-size:16px; font-weight:900; cursor:grab; touch-action:none; user-select:none;">≡</span>
                </div>`;
            }).join('');
        }

        /* [수정] ↑↓ 단추 대신 ≡ 를 끌어서 옮긴다. 손가락으로도 되게 포인터 이벤트를 쓴다.
           목록은 손잡이(≡)에서만 잡히므로, 줄을 쓸어 올려 목록을 굴리는 것도 그대로 된다. */
        let aptDrag = null;
        function aptDragMove(e) {
            if (!aptDrag) return;
            e.preventDefault();
            const step = Math.round((e.clientY - aptDrag.startY) / aptDrag.rowH);
            const to = Math.min(Math.max(aptDrag.i + step, 0), aptOrderEdit.length - 1);
            if (to !== aptDrag.i) {
                const moved = aptOrderEdit.splice(aptDrag.i, 1)[0];
                aptOrderEdit.splice(to, 0, moved);
                aptDrag.startY += (to - aptDrag.i) * aptDrag.rowH;   // 옮긴 만큼 기준도 옮긴다
                aptDrag.i = to;
                renderAptOrder();
            }
        }
        function aptDragEnd() {
            aptDrag = null;
            document.removeEventListener('pointermove', aptDragMove);
            document.removeEventListener('pointerup', aptDragEnd);
            document.removeEventListener('pointercancel', aptDragEnd);
            renderAptOrder();
        }
        document.addEventListener('pointerdown', e => {
            const grip = e.target && e.target.closest ? e.target.closest('[data-apt-grip]') : null;
            if (!grip) return;
            e.preventDefault();
            // 줄 하나 높이 — 줄 사이 간격으로 잰다. 못 재면 넉넉한 값을 쓴다 (0으로 나누지 않게)
            const rows = [...document.querySelectorAll('[data-apt-row]')];
            const a = rows[0] && rows[0].getBoundingClientRect();
            const b = rows[1] && rows[1].getBoundingClientRect();
            const rowH = (a && b && b.top - a.top > 1) ? (b.top - a.top) : ((a && a.height > 1) ? a.height + 6 : 60);
            aptDrag = { i: +grip.dataset.aptGrip, startY: e.clientY, rowH };
            document.addEventListener('pointermove', aptDragMove);
            document.addEventListener('pointerup', aptDragEnd);
            document.addEventListener('pointercancel', aptDragEnd);
            renderAptOrder();
        });

        async function saveAptOrder() {
            const btn = document.getElementById('apt-order-save');
            if (btn) { btn.disabled = true; btn.innerText = '저장 중...'; }
            APT_ORDER = aptOrderEdit.slice();
            try { localStorage.setItem(APT_ORDER_KEY, JSON.stringify(APT_ORDER)); } catch (e) { }
            let ok = true;
            try {
                const res = await fetch(`${FIREBASE_DB_URL}apartment_order.json`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(APT_ORDER)
                });
                ok = res.ok;
            } catch (e) { ok = false; }
            if (btn) { btn.disabled = false; btn.innerText = '저장'; }
            showToast(ok ? '아파트 순서를 저장했습니다.' : '서버 저장에 실패했습니다. 이 기기에서만 바뀝니다.');
            closeAptOrder();
            renderFilteredData();   // 바뀐 순서로 단추를 다시 그린다
        }

        /* ===== [신규] 공동현관 비번 조회 =====
           지금까지 배달 간 아파트를 모아 보여 주고, 아파트 → 동 → 비번 순으로 파고든다.
           예전에는 아파트와 동을 둘 다 고른 뒤에야 비번 칸이 떴다. 그래서 오늘 안 가는
           아파트의 비번은 확인할 방법이 없었다.
           목록은 받아 둔 주문에서 만든다 (따로 받는 자료가 없어 부담이 없다). */
        let _pwdView = { apt: '', dong: '' };

        let _pwdFromSettings = false;   // [신규] 설정에서 들어왔으면 첫 화면에도 '‹' 를 두어 설정으로 돌아간다
        function openPasswordFinder(fromSettings) {
            _pwdFromSettings = !!fromSettings;
            _pwdView = { apt: "", dong: "" }; _pwdEdit = false;
            const box = document.getElementById('pwd-finder-modal');
            if (box) box.style.display = 'flex';
            const s = document.getElementById('pwd-finder-search');
            if (s) s.value = '';
            renderPasswordFinder();
        }

        function closePasswordFinder() {
            const box = document.getElementById('pwd-finder-modal');
            if (box) box.style.display = 'none';
        }

        function pwdFinderBack() {
            if (_pwdView.dong) _pwdView.dong = '';
            else if (_pwdView.apt) _pwdView.apt = '';
            else if (_pwdFromSettings) { closePasswordFinder(); openSettings(); return; }
            renderPasswordFinder();
        }

        function pwdPickApt(apt) { _pwdView = { apt, dong: "" }; _pwdEdit = false; renderPasswordFinder(); }
        function pwdPickDong(dong) { _pwdView.dong = dong; _pwdEdit = false; renderPasswordFinder(); }

        /* 배달 간 아파트 → 동 → 집 수. 받아 둔 주문 전체에서 만든다.
           비번만 등록해 두고 배달 기록이 없는 아파트도 빠지지 않게 함께 넣는다. */
        function gPwdTree() {
            const tree = {};
            (rawOrders || []).forEach(it => {
                if (!it) return;
                const apt = extractApartmentName(it.address || '');
                if (!apt) return;
                const dong = getDongGroupName(it) || '(동 없음)';
                if (!tree[apt]) tree[apt] = {};
                if (!tree[apt][dong]) tree[apt][dong] = new Set();
                tree[apt][dong].add(normalizePhoneNumber(it.phone) || Math.random());
            });
            Object.keys(entrancePasswords || {}).forEach(apt => {
                if (!tree[apt]) tree[apt] = {};
                Object.keys(entrancePasswords[apt] || {}).forEach(k => {
                    /* [버그수정 2026-09-02] 1-2·3-4만 떼어 내고 있었다.
                       1~3호처럼 다른 범위로 만든 칸은 이름이 안 떨어져서,
                       '09동' 옆에 '09동_1-3라인'이 딴 동인 것처럼 하나 더 생겼다.
                       호수 범위는 사장님이 정하므로 숫자를 가리지 말고 떼어 낸다. */
                    const dong = String(k).replace(/_\d+-\d+라인$/, '');
                    if (!tree[apt][dong]) tree[apt][dong] = new Set();
                });
            });
            return tree;
        }

        // 그 동에 적어 둔 비번들 (라인별로 나눠 저장한 것까지 함께 본다)
        function gPwdOf(apt, dong) {
            const m = (entrancePasswords || {})[apt] || {};
            return {
                하나: String(m[dong] || '').trim(),
                line12: String(m[`${dong}_1-2라인`] || '').trim(),
                line34: String(m[`${dong}_3-4라인`] || '').trim()
            };
        }

        /* ===== [신규] 호수 칸(라인) 다루기 =====
           비번은 '동 + 호수 범위'마다 하나씩 있다. 저장 키는 `03동_1-2라인` 꼴이다.
           예전에는 1·2라인과 3·4라인 두 칸만 코드에 박혀 있었는데, 아파트마다 라인 수가
           달라서 (1~3호, 1~4호처럼) 맞지 않는 곳이 있었다. 이제 범위를 사장님이 정한다.

           · `03동`        → 범위 없는 옛 값. '전체' 칸으로 본다.
           · `03동_1-2라인` → 1호~2호 칸
           키 형식은 그대로 두어 예전 자료도 그대로 읽힌다. */
        function gSlotKey(dong, from, to) {
            if (from == null || to == null || from === '' || to === '') return dong;
            return `${dong}_${from}-${to}라인`;
        }

        // 그 동에 있는 칸들을 범위 순으로 (전체 칸은 맨 뒤)
        function gSlotsOf(apt, dong) {
            const map = (entrancePasswords || {})[apt] || {};
            const out = [];
            Object.keys(map).forEach(k => {
                if (k === dong) { out.push({ key: k, from: null, to: null, pwd: String(map[k] || '') }); return; }
                const m = String(k).match(/^(.+)_(\d+)-(\d+)라인$/);
                if (m && m[1] === dong) out.push({ key: k, from: parseInt(m[2]), to: parseInt(m[3]), pwd: String(map[k] || '') });
            });
            out.sort((a, b) => {
                if (a.from === null) return 1;
                if (b.from === null) return -1;
                return a.from - b.from || a.to - b.to;
            });
            return out;
        }

        function gSlotLabel(s) {
            if (s.from == null) return '전체';
            return (s.from === s.to) ? `${s.from}호` : `${s.from} ~ ${s.to}호`;   // [수정] 물결 앞뒤를 띄워 답답해 보이지 않게
        }

        /* 칸 하나를 저장한다. 범위가 바뀌었으면 옛 키를 지우고 새 키로 옮긴다.
           (키 이름이 곧 범위라, 범위를 고치는 것은 키를 바꾸는 일이다) */
        async function savePwdSlot(oldKey, dong, from, to, pwd) {
            const apt = _pwdView.apt;
            if (!apt || !dong) return false;
            const newKey = gSlotKey(dong, from, to);
            // [수정] 서버에는 도로명주소를 열쇠로 적는다 (화면 이름은 사람이 읽으라고 쓰는 것)
            const base = `${FIREBASE_DB_URL}entrance_passwords/${encodeURIComponent(gAptRoadKey(apt))}`;
            const res = await fetch(`${base}/${encodeURIComponent(newKey)}.json`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(String(pwd || ''))
            });
            if (!res.ok) throw new Error('저장 실패 ' + res.status);
            if (!entrancePasswords[apt]) entrancePasswords[apt] = {};
            entrancePasswords[apt][newKey] = String(pwd || '');

            if (oldKey && oldKey !== newKey) {
                await fetch(`${base}/${encodeURIComponent(oldKey)}.json`, { method: 'DELETE' });
                delete entrancePasswords[apt][oldKey];
            }
            try { localStorage.setItem('moket_entrance_passwords_cache', JSON.stringify(entrancePasswords)); } catch (e) {}
            return true;
        }

        async function deletePwdSlot(key) {
            const apt = _pwdView.apt;
            if (!apt || !key) return;
            await fetch(`${FIREBASE_DB_URL}entrance_passwords/${encodeURIComponent(gAptRoadKey(apt))}/${encodeURIComponent(key)}.json`, { method: 'DELETE' });
            if (entrancePasswords[apt]) delete entrancePasswords[apt][key];
            try { localStorage.setItem('moket_entrance_passwords_cache', JSON.stringify(entrancePasswords)); } catch (e) {}
        }

        // 지우기는 한 번 더 눌러 확인받는다 (confirm 창은 기기에 따라 막힌다)
        let _pwdDelArmed = '';
        function askDeletePwdSlot(key) {
            if (_pwdDelArmed !== key) {
                _pwdDelArmed = key;
                renderPasswordFinder();
                setTimeout(() => { if (_pwdDelArmed === key) { _pwdDelArmed = ''; renderPasswordFinder(); } }, 5000);
                return;
            }
            _pwdDelArmed = '';
            (async () => {
                showLoader('지우는 중...');
                try { await deletePwdSlot(key); showToast('칸을 지웠습니다.'); }
                catch (e) { showToast('삭제 실패: ' + e.message); }
                // [수정] 뒤에 깔린 배달 목록의 비번 카드도 함께 다시 그린다 (아래 commitPwdSlot과 같은 이유)
                finally { hideLoader(); renderPasswordFinder(); renderFilteredData(); }
            })();
        }

        // 화면에 적은 값을 그대로 저장 (범위·비번 함께)
        function commitPwdSlot(idx) {
            const row = document.querySelector(`[data-slot="${idx}"]`);
            if (!row) return;
            const oldKey = row.getAttribute('data-key') || '';
            const f = row.querySelector('[data-f]')?.value.trim();
            const t = row.querySelector('[data-t]')?.value.trim();
            const p = row.querySelector('[data-p]')?.value ?? '';
            const isAll = row.getAttribute('data-all') === '1';

            if (!isAll) {
                const fn = parseInt(f), tn = parseInt(t);
                if (isNaN(fn) || isNaN(tn)) { showToast('호수 범위를 숫자로 적어 주세요.'); return; }
                if (fn > tn) { showToast('앞 숫자가 뒤 숫자보다 큽니다.'); return; }
                /* [버그수정] 이미 있는 호수 칸으로 바꾸면 그 칸의 비번을 덮어써서
                   적어 둔 비번이 사라졌다. 다른 칸이 쓰고 있으면 손대지 않는다. */
                const newKey = gSlotKey(_pwdView.dong, fn, tn);
                if (newKey !== oldKey && ((entrancePasswords[_pwdView.apt] || {})[newKey]) !== undefined) {
                    showToast(`${fn}~${tn}호 칸은 이미 있습니다. 다른 호수를 골라 주세요.`); return;
                }
            }
            (async () => {
                showLoader('저장 중...');
                try {
                    await savePwdSlot(oldKey, _pwdView.dong, isAll ? null : parseInt(f), isAll ? null : parseInt(t), p);
                    showToast('저장했습니다.');
                    _pwdNewSlot = null;   // 새로 만들던 칸이었으면 접는다
                } catch (e) { showToast('저장 실패: ' + e.message); }
                /* [수정] 예전에는 '🚪 비번' 창만 다시 그렸다. 그래서 창을 닫으면
                   뒤에 깔린 배달 목록의 비번 카드에 옛 값이 그대로 남아,
                   '🔄 갱신'으로 자료를 다시 받아야 바뀐 비번이 보였다.
                   고친 값은 이미 메모리와 저장소에 들어가 있으므로 목록만 다시 그리면 된다. */
                finally { hideLoader(); renderPasswordFinder(); renderFilteredData(); }
            })();
        }

        // 새로 만들던 칸을 접는다
        function cancelNewPwdSlot() { _pwdNewSlot = null; renderPasswordFinder(); }

        /* 빈 칸을 하나 더한다.
           [수정] 예전에는 '가장 큰 호수 다음'으로 잡아서, 3~4호만 있는 동에 1~2호를
           넣으려 해도 5~6호가 나왔다. 라인은 1~2 · 3~4처럼 두 집씩 묶이므로,
           그 자리들 중 비어 있는 첫 자리를 고른다. (주문관리 전단지 화면과 같은 방식) */
        function addPwdSlot() {
            const slots = gSlotsOf(_pwdView.apt, _pwdView.dong).filter(s => s.from != null);
            const 빈자리 = gFreeHoRange(slots);
            if (!빈자리) { showToast('넣을 자리가 다 찼습니다.'); return; }
            _pwdNewSlot = { from: 빈자리[0], to: 빈자리[1] };
            renderPasswordFinder();
        }

        /* 이미 쓰고 있는 호수를 뺀 뒤, 남은 첫 자리부터 두 집을 잡는다.
           1~2호가 있으면 3~4호, 1~3호가 있으면 4~5호가 나온다.
           바로 뒤 호수까지 비어 있어야 두 집으로 잡고, 아니면 한 집만 잡는다. */
        function gFreeHoRange(slots) {
            const 쓰는중 = new Set();
            (slots || []).forEach(s => {
                if (s.from == null) return;
                for (let i = s.from; i <= s.to; i++) 쓰는중.add(i);
            });
            for (let a = 1; a <= 99; a++) {
                if (쓰는중.has(a)) continue;
                const b = (a < 99 && !쓰는중.has(a + 1)) ? a + 1 : a;
                return [a, b];
            }
            return null;
        }
        let _pwdNewSlot = null;

        // 보기 ↔ 고치기 전환. 창을 새로 열 때는 늘 보기부터 시작한다.
        let _pwdEdit = false;
        function togglePwdEdit(on) { _pwdEdit = !!on; _pwdNewSlot = null; _pwdDelArmed = ""; renderPasswordFinder(); }

        function renderPasswordFinder() {
            const body = document.getElementById('pwd-finder-body');
            const title = document.getElementById('pwd-finder-title');
            const back = document.getElementById('pwd-finder-back');
            if (!body) return;

            const q = String(document.getElementById('pwd-finder-search')?.value || '').trim().toLowerCase();
            const tree = gPwdTree();
            const has = (apt, dong) => gSlotsOf(apt, dong).some(s => String(s.pwd || '').trim());

            if (back) back.style.display = (_pwdView.apt || _pwdView.dong || _pwdFromSettings) ? '' : 'none';

            /* 줄 하나짜리 목록. 상자를 겹겹이 두르면 좁은 화면에서 조잡해 보여서,
               얇은 가로선으로만 나누고 오른쪽 끝에 딸림 정보를 흐리게 둔다. */
            const listRow = (onclick, left, right, dim) =>
                `<div onclick="${onclick}" style="display:flex; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid #f1f5f9; cursor:pointer;">`
                + `<span style="flex:1; min-width:0; font-size:15px; font-weight:800; color:${dim ? '#94a3b8' : '#0f172a'}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${left}</span>`
                + (right ? `<span style="flex:0 0 auto; font-size:11.5px; font-weight:700; color:#94a3b8;">${right}</span>` : '')
                + `<span style="flex:0 0 auto; color:#cbd5e1; font-size:13px;">›</span></div>`;

            // ── 3단계: 비번 보기 / 고치기
            if (_pwdView.apt && _pwdView.dong) {
                if (title) title.innerText = `${_pwdView.apt} ${_pwdView.dong}`;
                const slots = gSlotsOf(_pwdView.apt, _pwdView.dong);

                if (!_pwdEdit) {
                    const live = slots.filter(s => String(s.pwd || '').trim());
                    const com = gCommonPwdOf(_pwdView.apt);
                    body.innerHTML =
                        (com ? `<div style="display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:12px 14px; border:1.5px solid #c7d2fe; background:#eef2ff; border-radius:12px;">`
                             + `<span style="flex:0 0 auto; font-size:12px; font-weight:900; color:#4338ca;">🔑 공용</span>`
                             + `<span style="flex:1; min-width:0; font-size:19px; font-weight:900; color:#312e81; letter-spacing:1px; word-break:break-all;">${gEsc(com)}</span></div>` : '')
                        + (live.length === 0
                            ? (com ? '' : `<div style="padding:34px 0; text-align:center; color:#94a3b8; font-size:13px; font-weight:700;">적어 둔 비번이 없습니다.</div>`)
                            : `<div style="border:1.5px solid #fde68a; border-radius:12px; overflow:hidden; background:#fffdf7;">`
                              + live.map((s, i) => `
                                <div style="display:flex; align-items:stretch; ${i ? 'border-top:1px solid #fde68a;' : ''}">
                                    <span style="flex:0 0 92px; display:flex; align-items:center; justify-content:center; padding:13px 8px; border-right:1px solid #fde68a; font-size:14px; font-weight:800; color:#a16207; white-space:nowrap;">${gEsc(gSlotLabel(s))}</span>
                                    <span style="flex:1; min-width:0; display:flex; align-items:center; padding:13px 14px; font-size:19px; font-weight:900; color:#78350f; letter-spacing:1px; word-break:break-all;">${gEsc(s.pwd)}</span>
                                </div>`).join('')
                              + `</div>`)
                        + `<button type="button" onclick="togglePwdEdit(true)" style="width:100%; margin-top:14px; padding:12px; border:1.5px solid #cbd5e1; background:#fff; color:#475569; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer;">✏️ 수정</button>`;
                    return;
                }

                // 고치기
                const editing = slots.slice();
                if (_pwdNewSlot) editing.push({ key: '', from: _pwdNewSlot.from, to: _pwdNewSlot.to, pwd: '', isNew: true });

                const cell = 'height:38px; padding:4px 8px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:15px; font-weight:800; text-align:center; box-sizing:border-box;';
                const rowHtml = (s, i) => {
                    const isAll = (s.from == null);
                    const armed = (_pwdDelArmed === s.key && s.key);
                    return `<div data-slot="${i}" data-key="${gEsc(s.key)}" data-all="${isAll ? '1' : '0'}" style="padding:12px 0; ${i ? 'border-top:1px solid #f1f5f9;' : ''}">`
                        + `<div style="display:flex; align-items:center; gap:6px;">`
                        + (isAll
                            ? `<span style="flex:1; font-size:13px; font-weight:800; color:#94a3b8;">전체 (호수 구분 없음)</span>`
                            : `<input data-f type="number" inputmode="numeric" value="${s.from}" style="width:56px; ${cell}">`
                              + `<span style="font-size:13px; font-weight:800; color:#cbd5e1;">~</span>`
                              + `<input data-t type="number" inputmode="numeric" value="${s.to}" style="width:56px; ${cell}">`
                              + `<span style="font-size:13px; font-weight:800; color:#64748b; margin-right:auto;">호</span>`)
                        + `<button type="button" onclick="commitPwdSlot(${i})" style="height:38px; padding:0 14px; border:none; background:#10b981; color:#fff; border-radius:8px; font-size:12.5px; font-weight:800; cursor:pointer;">저장</button>`
                        + (s.key
                            ? `<button type="button" onclick="askDeletePwdSlot('${gEsc(s.key).replace(/'/g, "\\'")}')" style="height:38px; padding:0 11px; border:1.5px solid ${armed ? '#dc2626' : '#e2e8f0'}; background:${armed ? '#dc2626' : '#fff'}; color:${armed ? '#fff' : '#94a3b8'}; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap;">${armed ? '한 번 더' : '삭제'}</button>`
                            : `<button type="button" onclick="cancelNewPwdSlot()" style="height:38px; padding:0 11px; border:1.5px solid #e2e8f0; background:#fff; color:#94a3b8; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer;">취소</button>`)
                        + `</div>`
                        + `<input data-p type="text" value="${gEsc(s.pwd)}" placeholder="비번"`
                        + ` style="width:100%; box-sizing:border-box; margin-top:7px; height:46px; padding:8px 12px; border:1.5px solid #e2e8f0; border-radius:9px; font-size:18px; font-weight:900; letter-spacing:1px; text-align:center; background:#fff;">`
                        + `</div>`;
                };

                body.innerHTML =
                    (editing.length === 0
                        ? `<div style="padding:24px 0; text-align:center; color:#94a3b8; font-size:13px; font-weight:700;">칸이 없습니다.</div>`
                        : editing.map(rowHtml).join(''))
                    + `<button type="button" onclick="addPwdSlot()" style="width:100%; margin-top:12px; padding:12px; border:1.5px dashed #cbd5e1; background:#fff; color:#64748b; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer;">＋ 호수 칸 추가</button>`
                    + `<button type="button" onclick="togglePwdEdit(false)" style="width:100%; margin-top:7px; padding:12px; border:none; background:#475569; color:#fff; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer;">✔ 마치기</button>`
                    + `<div style="margin-top:10px; font-size:11px; font-weight:700; color:#cbd5e1; line-height:1.6;">호수를 고치면 그 칸이 통째로 옮겨집니다. 고친 뒤 <b>저장</b>을 눌러 주세요.</div>`;
                return;
            }

            // ── 2단계: 동 고르기
            if (_pwdView.apt) {
                if (title) title.innerText = _pwdView.apt;
                const dongs = Object.keys(tree[_pwdView.apt] || {})
                    .filter(d => !q || d.toLowerCase().includes(q))
                    .sort((a, b) => (parseInt(a.replace(/\D/g, '')) || 9999) - (parseInt(b.replace(/\D/g, '')) || 9999) || a.localeCompare(b));
                body.innerHTML = dongs.length === 0
                    ? `<div style="padding:34px 0; text-align:center; color:#94a3b8; font-weight:700;">동이 없습니다.</div>`
                    : dongs.map(d => {
                        const ok = has(_pwdView.apt, d);
                        return listRow(`pwdPickDong('${gEsc(d).replace(/'/g, "\\'")}')`, gEsc(d), ok ? '🚪' : '', !ok);
                    }).join('');
                return;
            }

            // ── 1단계: 아파트 고르기
            if (title) title.innerText = '🚪 공동현관 비번';
            const apts = Object.keys(tree)
                .filter(a => !q || a.toLowerCase().includes(q))
                .sort((a, b) => {
                    if (a === '기타') return 1;
                    if (b === '기타') return -1;
                    return a.localeCompare(b, 'ko');
                });
            body.innerHTML = apts.length === 0
                ? `<div style="padding:34px 0; text-align:center; color:#94a3b8; font-weight:700;">찾는 아파트가 없습니다.</div>`
                : apts.map(a => {
                    const dongs = Object.keys(tree[a]);
                    const okCount = dongs.filter(d => has(a, d)).length;
                    return listRow(`pwdPickApt('${gEsc(a).replace(/'/g, "\\'")}')`, gEsc(a),
                        okCount ? `${okCount}개` : '', !okCount);
                }).join('');
        }

        function gEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        // 동 버튼 생성
        function renderDongButtons(aptOrders) {
            const dongContainer = document.getElementById('dong-buttons');
            dongContainer.innerHTML = '';

            // 아파트 주문 건 중 동 이름으로 분류 (묶어 둔 구역은 그 이름으로)
            const dongGroups = {};
            aptOrders.forEach(item => {
                const dongFormatted = getDongGroupName(item);
                if (!dongGroups[dongFormatted]) {
                    dongGroups[dongFormatted] = [];
                }
                dongGroups[dongFormatted].push(item);
            });

            const dongs = Object.keys(dongGroups).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, "")) || 9999;
                const numB = parseInt(b.replace(/\D/g, "")) || 9999;
                if (numA !== numB) return numA - numB;
                return a.localeCompare(b);
            });

            if (dongs.length === 0) {
                document.getElementById('dong-section').style.display = 'none';
                document.getElementById('order-list').innerHTML = '<div style="text-align:center; padding:50px; font-weight:800; color:var(--text-sub); font-size: 14px;">동 정보 파싱에 실패한 주문만 있거나 배달이 없습니다.</div>';
                return;
            }

            document.getElementById('dong-section').style.display = 'block';

            if (!activeDong) {
                activeDong = "전체";
            } else if (activeDong !== "전체" && !dongs.includes(activeDong)) {
                // 기억해 둔 동이 이번 날짜엔 배달이 없을 때만 전체로 되돌린다
                activeDong = "전체";
                lastDongByApt[gAptKey(activeApartment)] = "전체";
            }

            // "전체" 버튼 생성
            const allBtn = document.createElement('button');
            allBtn.className = `btn-select dong-btn ${activeDong === '전체' ? 'active' : ''}`;
            allBtn.innerText = `전체 ${getDeliveryProgressText(aptOrders)}`;
            allBtn.onclick = () => {
                activeDong = "전체";
                lastDongByApt[gAptKey(activeApartment)] = "전체"; // 이 아파트에서 마지막으로 본 동
                document.querySelectorAll('.dong-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                renderOrderCards(aptOrders);
            };
            dongContainer.appendChild(allBtn);

            dongs.forEach(dong => {
                const btn = document.createElement('button');
                btn.className = `btn-select dong-btn ${dong === activeDong ? 'active' : ''}`;
                btn.innerText = `${dong} ${getDeliveryProgressText(dongGroups[dong])}`;
                btn.onclick = () => {
                    activeDong = dong;
                    lastDongByApt[gAptKey(activeApartment)] = dong; // 이 아파트에서 마지막으로 본 동
                    document.querySelectorAll('.dong-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderOrderCards(dongGroups[dong]);
                };
                dongContainer.appendChild(btn);
            });

            // 초기 렌더링 호출
            if (activeDong === "전체") {
                renderOrderCards(aptOrders);
            } else if (dongGroups[activeDong]) {
                renderOrderCards(dongGroups[activeDong]);
            } else {
                activeDong = "전체";
                allBtn.classList.add('active');
                renderOrderCards(aptOrders);
            }
        }

        // 주문 리스트 카드 렌더링
        function renderOrderCards(dongOrders) {
            const listContainer = document.getElementById('order-list');
            listContainer.innerHTML = '';

            // 동별 그룹화된 주문들의 호수 오름차순 정렬을 위한 헬퍼
            const extractHoNum = (item) => {
                const detail = String(item.addressDetail || "").trim();
                const addr = String(item.address || "").trim();

                // 1. 상세주소에서 "202호" 또는 "202 호"
                let match = detail.match(/([0-9]+)\s*호/);
                if (match) return parseInt(match[1]);

                // 2. 상세주소에서 "101-202" 또는 "101 - 202" (하이픈 뒤 숫자가 호)
                match = detail.match(/[0-9]+\s*-\s*([0-9]+)/);
                if (match) return parseInt(match[1]);

                // 3. 상세주소에서 "101동 202" -> 뒤쪽 숫자
                match = detail.match(/동\s*([0-9]+)/);
                if (match) return parseInt(match[1]);

                match = detail.match(/\b([0-9]+)\b\s*$/);
                if (match) return parseInt(match[1]);

                // 4. 주소 전체에서 "202호"
                match = addr.match(/([0-9]+)\s*호/);
                if (match) return parseInt(match[1]);

                return 9999;
            };

            // 동 순 오름차순 -> 동이 같으면 호수 오름차순 정렬 유틸
            const sortOrdersByDongAndHo = (a, b) => {
                // [수정] 묶어 둔 구역(빌라)은 이름으로 묶어 정렬한다.
                //  동 번호로 세면 '102호'의 첫 숫자를 동으로 넘겨짚어 순서가 뒤죽박죽이 된다.
                const zA = findCustomZoneName(a.address);
                const zB = findCustomZoneName(b.address);
                if (zA || zB) {
                    if (zA !== zB) return String(zA || '힣').localeCompare(String(zB || '힣'), 'ko');
                } else {
                    const dongA = getDongNumber(a.addressDetail, a.address);
                    const dongB = getDongNumber(b.addressDetail, b.address);
                    if (dongA !== dongB) return dongA - dongB;
                }

                const hoA = extractHoNum(a);
                const hoB = extractHoNum(b);
                if (hoA !== hoB) {
                    return hoA - hoB;
                }

                return String(a.name || "").localeCompare(String(b.name || ""));
            };

            // 정렬 처리
            if (activeApartment === "전체") {
                const customOrder = ["푸지1차", "푸지2차", "푸르지오", "센트리버", "리버나인", "더샵", "더샾", "칸타빌"];
                const getAptWeight = (name) => {
                    if (name === "기타") return 9999;
                    const idx = customOrder.indexOf(name);
                    return idx !== -1 ? idx : 1000;
                };

                dongOrders.sort((a, b) => {
                    const aptA = extractApartmentName(a.address);
                    const aptB = extractApartmentName(b.address);

                    if (aptA !== aptB) {
                        const wA = getAptWeight(aptA);
                        const wB = getAptWeight(aptB);
                        if (wA !== wB) return wA - wB;
                        return aptA.localeCompare(aptB);
                    }

                    return sortOrdersByDongAndHo(a, b);
                });
            } else {
                dongOrders.sort((a, b) => {
                    return sortOrdersByDongAndHo(a, b);
                });
            }

            // 고객별(전화번호 기준) 주문 그룹화
            const customerGroups = {};
            dongOrders.forEach(item => {
                const customerKey = normalizePhoneNumber(item.phone);
                if (!customerKey) return;

                if (!customerGroups[customerKey]) {
                    customerGroups[customerKey] = {
                        name: item.name || "이름 없음",
                        phone: item.phone || "전화번호 없음",
                        address: item.address || "주소 없음",
                        addressDetail: item.addressDetail || "",
                        entrance: item.entrance || "",
                        itemsList: [],
                        orders: [],
                        status: "배달완료", // 기본 완료로 설정 후 미완료 주문 발견 시 하향 조정
                        deliveryPhoto: "",
                        deliveryPhotoExists: false,
                        deliveryPhotoTime: null
                    };
                }

                customerGroups[customerKey].orders.push(item);
                customerGroups[customerKey].itemsList.push({
                    name: item.item || "상품명 없음",
                    qty: item.qty || 1
                });

                if (item.entrance && !customerGroups[customerKey].entrance) {
                    customerGroups[customerKey].entrance = item.entrance;
                }

                if (item.deliveryPhotoExists && !customerGroups[customerKey].deliveryPhotoExists) {
                    customerGroups[customerKey].deliveryPhotoExists = true;
                    customerGroups[customerKey].deliveryPhotoTime = item.deliveryPhotoTime;
                }
                if (item.deliveryPhoto && !customerGroups[customerKey].deliveryPhoto) {
                    customerGroups[customerKey].deliveryPhoto = item.deliveryPhoto;
                    customerGroups[customerKey].deliveryPhotoTime = item.deliveryPhotoTime;
                }
            });

            // 고객별 통합 배달 상태 결정
            const groupedCustomers = Object.values(customerGroups);
            groupedCustomers.forEach(group => {
                const statuses = group.orders.map(o => o.status);
                const allDelivered = statuses.every(s => s === "배달완료");
                if (allDelivered) {
                    group.status = "배달완료";
                } else {
                    const hasStocked = statuses.some(s => s === "입고" || s === "배달완료");
                    group.status = hasStocked ? "입고" : "대기";
                }
            });

            // 대표 주문 기준 호수로 오름차순 정렬 (dongOrders의 순서대로 정렬)
            groupedCustomers.sort((a, b) => {
                return dongOrders.indexOf(a.orders[0]) - dongOrders.indexOf(b.orders[0]);
            });
            // 공동현관 비번 (동이 "전체"가 아닐 때만 노출)
            // [수정] '기타'는 빌라·다세대 모음이라 동마다 라인별 공동현관 비번이 없다.
            //  집집마다 비번이 달라 이 칸이 오히려 헷갈려서 빼둔다.
            // [수정] 1·2 / 3·4 두 칸으로 못 박아 두었는데, 아파트마다 라인 수가 달라 맞지 않았다.
            //  이제 '🚪 비번' 창에서 정한 호수 칸을 그대로 읽어 보여 준다. 고치는 것도 거기서 한다.
            if (activeDong !== "전체" && activeApartment !== "전체" && activeApartment !== "기타") {
                /* [수정] 그 동의 비번을 전부 늘어놓으니, 오늘 안 가는 호수 것까지 섞여 눈이 갔다.
                   오늘 배달 갈 호수가 든 칸만 보여 준다. (4호가 있으면 3~4호 칸)
                   호수를 못 읽는 주문이 섞여 있으면 놓치지 않게 전부 보여 준다. */
                const _allSlots = gSlotsOf(activeApartment, activeDong).filter(s => String(s.pwd || '').trim());
                const _hoLasts = new Set();
                let _unknownHo = false;
                groupedCustomers.forEach(g => {
                    const d = String((g.orders && g.orders[0] && g.orders[0].addressDetail) || g.addressDetail || '');
                    const hoN = gHoOf(d);
                    if (hoN != null) _hoLasts.add(hoN);
                    else _unknownHo = true;
                });
                const _fit = _allSlots.filter(s => s.from == null
                    || [..._hoLasts].some(h => h >= s.from && h <= s.to));
                const slots = (_unknownHo || _fit.length === 0) ? _allSlots : _fit;

                const pwdCard = document.createElement('div');
                /* [수정] 주문 카드와 짜임은 같게 두되, 색은 달리한다.
                   똑같이 회색·흰색이면 목록을 훑을 때 비번 카드인지 주문 카드인지 헷갈렸다.
                   테두리·머리줄을 살구빛으로 바꿔 한눈에 구분되게 하고, 짜임은 그대로 둔다. */
                pwdCard.className = 'rider-card';
                pwdCard.style.marginBottom = '14px';
                pwdCard.style.borderColor = '#fbbf24';
                pwdCard.style.background = '#fffdf7';
                pwdCard.innerHTML = `
                    <div class="rider-card-header" style="background:#fef3c7; border-bottom-color:#fbbf24;">
                        <span style="font-size:14px; font-weight:850; color:#92400e;">🚪 ${activeApartment} ${activeDong} 공동현관 비번</span>
                        <button type="button" onclick="openPasswordFinder(); pwdPickApt('${gEsc(activeApartment).replace(/'/g, "\'")}'); pwdPickDong('${gEsc(activeDong).replace(/'/g, "\'")}'); togglePwdEdit(true);"
                            title="비번 고치기"
                            style="flex:0 0 auto; padding:4px 10px; border:1.5px solid #fbbf24; background:#fff; color:#b45309; border-radius:7px; font-size:11.5px; font-weight:800; cursor:pointer;">✏️ 수정</button>
                    </div>
                    <div class="rider-card-body" style="gap:0; padding:10px 16px 12px;">
                        ${gCommonPwdOf(activeApartment) ? `
                                <div style="display:flex; align-items:stretch; gap:0; padding:7px 0;">
                                    <span style="flex:0 0 86px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; line-height:1.5; color:#a16207; white-space:nowrap; border-right:1px solid #fde68a; padding-right:14px;">공용</span>
                                    <span style="flex:1; min-width:0; display:flex; align-items:center; padding-left:16px; font-size:16px; font-weight:900; line-height:1.5; color:#78350f; word-break:break-all; letter-spacing:0.5px;">${gEsc(gCommonPwdOf(activeApartment))}</span>
                                </div>` : ''}
                        ${slots.length === 0
                            ? (gCommonPwdOf(activeApartment) ? '' : `<div style="font-size:12.5px; font-weight:700; color:#b7a894;">적어 둔 비번이 없습니다.</div>`)
                            : slots.map((s, i) => `
                                <div style="display:flex; align-items:stretch; gap:0; padding:7px 0; ${(i || gCommonPwdOf(activeApartment)) ? "border-top:1px solid #fde68a;" : ""}">
                                    <span style="flex:0 0 86px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; line-height:1.5; color:#a16207; white-space:nowrap; border-right:1px solid #fde68a; padding-right:14px;">${gEsc(gSlotLabel(s))}</span>
                                    <span style="flex:1; min-width:0; display:flex; align-items:center; padding-left:16px; font-size:16px; font-weight:900; line-height:1.5; color:#78350f; word-break:break-all; letter-spacing:0.5px;">${gEsc(s.pwd)}</span>
                                </div>`).join('')}
                    </div>
                `;
                listContainer.appendChild(pwdCard);
            }

            groupedCustomers.forEach(customer => {
                const card = document.createElement('div');
                const isCompleted = customer.status === '배달완료';
                card.className = `rider-card ${isCompleted ? 'completed' : ''}`;

                // 호수 추출 (첫 대표 주문 기준)
                const representativeItem = customer.orders[0];
                let hoLabel = "";
                const hoNum = extractHoNum(representativeItem);
                if (hoNum !== 9999) {
                    hoLabel = hoNum + "호";
                } else {
                    hoLabel = representativeItem.addressDetail || "주소상세";
                }

                // 동 원본 번호 및 아파트 표시 분기
                const rawDong = getDongNumber(representativeItem.addressDetail, representativeItem.address);
                /* [신규] 빌라·다세대는 동 번호가 없어 '[기타] 102호'로만 떠서 어느 집인지 알 수 없었다.
                   대분류는 '기타' 그대로 두고, 동(棟) 자리에 사장님이 묶어 둔 구역 이름을 넣는다. */
                //  묶어 둔 구역이면 구역 이름을 먼저 쓴다. 빌라는 상세주소가 '102호'뿐인데
                //  getDongNumber가 그 첫 숫자를 동으로 넘겨짚어 '102동 102호'가 되곤 한다.
                const zoneName = findCustomZoneName(representativeItem.address);
                // 9999는 '동 없음'을 뜻하는 내부 값이다. 그대로 찍으면 '9999동'이 되므로 빈칸으로 둔다.
                const hasDong = rawDong && rawDong !== 9999;
                const dongLabel = zoneName ? `${zoneName} ` : (hasDong ? `${rawDong}동 ` : '');

                /* [수정] 아파트를 고르면 이름을 빼고 '102동 1304호'만 찍었다.
                   어느 아파트를 보고 있는지 카드만으로는 알 수 없어, 골랐을 때도 이름을 붙인다. */
                const aptName = extractApartmentName(representativeItem.address);
                const fullDongHo = `[${aptName}] ${dongLabel}${hoLabel}`;

                // 전화번호 포맷 정규화
                const cleanPhone = String(customer.phone || "").replace(/\D/g, "");

                // 입금 상태 판정
                const isAllPaid = customer.orders.every(o => o.paid === true || o.paid === "true" || o.paid === "True" || o.isPaid === true || o.isPaid === "true");
                const isAnyPaid = customer.orders.some(o => o.paid === true || o.paid === "true" || o.paid === "True" || o.isPaid === true || o.isPaid === "true");

                let paidBadgeHtml = '';
                if (isAllPaid) {
                    paidBadgeHtml = `<span style="font-size: 11px; font-weight: 800; background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; border: 1px solid #a5d6a7; display: inline-flex; align-items: center; gap: 2px;">💵 입금완료</span>`;
                } else if (isAnyPaid) {
                    paidBadgeHtml = `<span style="font-size: 11px; font-weight: 800; background: #fff8e1; color: #b78103; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffe082; display: inline-flex; align-items: center; gap: 2px;">💵 부분입금</span>`;
                } else {
                    paidBadgeHtml = `<span style="font-size: 11px; font-weight: 800; background: #fef2f2; color: #ef4444; padding: 2px 6px; border-radius: 4px; border: 1px solid #fca5a5; display: inline-flex; align-items: center; gap: 2px;">🔴 미입금</span>`;
                }

                // 주문 상품 묶음 HTML 생성
                let itemHtml = customer.itemsList.map((it, idx) => {
                    const origOrder = customer.orders[idx];
                    const isPaidItem = origOrder && (origOrder.paid === true || origOrder.paid === "true" || origOrder.paid === "True" || origOrder.isPaid === true || origOrder.isPaid === "true");
                    return `
                        <div class="item-row" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>${it.name} ${isPaidItem ? `<span style="font-size:10px; font-weight:800; background:#e8f5e9; color:#2e7d32; padding:1px 4px; border-radius:3px; margin-left:4px;">💵 입금완료</span>` : `<span style="font-size:10px; font-weight:800; background:#fef2f2; color:#ef4444; padding:1px 4px; border-radius:3px; margin-left:4px;">🔴 미입금</span>`}</span>
                            <span class="item-qty">${it.qty}개</span>
                        </div>
                    `;
                }).join('');

                // 묶음 주문의 모든 orderKey들을 쉼표로 연결하여 액션 파라미터로 넘김
                // [버그수정] 상품명에 쉼표(,)가 있으면 orderKey에 쉼표가 포함됨 → 쉼표 join/split 시 키가 쪼개져
                // 엉뚱한 유령 키에 PATCH되고 실제 주문은 미처리됨. 상품명에 없는 '|@@|'로 구분(주문관리.html과 동일).
                const orderKeysStr = customer.orders.map(o => o.orderKey).join('|@@|');

                // [신규] 이 고객 주문금액 총합 (취소 제외)
                const cardTotalAmount = customer.orders.reduce((s, o) => {
                    const canceled = (o.canceled === true || String(o.canceled).toUpperCase() === "TRUE");
                    return canceled ? s : s + (parseInt(o.total || 0) || 0);
                }, 0);

                card.innerHTML = `
                    <div class="rider-card-header">
                        <span class="unit-number">${fullDongHo}</span>
                        <span class="customer-name">${customer.name}</span>
                    </div>
                    <div class="rider-card-body">
                        <!-- [수정] '📋 복사' 단추가 자리를 많이 먹어 뗐다. 이제 주소줄을 누르면 도로명주소가 복사된다.
                             (동·호수와 괄호는 빼고 내비에 찍는 도로명주소만) -->
                        <div class="address-text${String(representativeItem.address || "").trim() ? ' addr-copy' : ''}"
                            ${String(representativeItem.address || "").trim() ? `onclick="copyAddrBar(this, '${encodeURIComponent(String(representativeItem.address || "").trim())}')"` : ''}>
                            <span class="addr-full">${representativeItem.address || ""} ${representativeItem.addressDetail || ""}</span>
                            ${String(representativeItem.address || "").trim() ? `<span class="ab-tip">📋</span>` : ''}
                        </div>
                        ${customer.entrance ? `
                            <div class="address-box" style="background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8;">
                                🚪 공동현관 입력값: <b>${customer.entrance}</b>
                            </div>
                        ` : ''}
                        ${(() => {
                            /* [신규] 가게 메모와 손님 요청사항을 한자리에 모아 보여 준다.
                               문 앞에서 한 번에 눈에 들어와야 하므로 상자 하나에 줄로 쌓는다.
                                 · 🖨 인쇄메모 — 손님에게 붙어 다니는 말 (원래 인쇄물에 나가던 것)
                                 · 📝 주문메모 — 그 주문 한 건에만 붙는 말
                                 · 🙋 요청사항 — 손님이 주문할 때 적은 말
                               가게 안에서만 쓰는 고정메모는 뺀다. */
                            const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
                            const cleanPhone = String(customer.phone || '').replace(/\D/g, '');
                            const baseKey = cleanPhone || (String(customer.name || '무명').trim() + '_비인증');

                            const rows = [];
                            const printMemo = String(riderPrintMemos[baseKey] || '').trim();
                            if (printMemo) rows.push(['🖨', '인쇄메모', printMemo, '#7c3aed']);

                            const seen = new Set();
                            (customer.orders || []).forEach(o => {
                                const m = String(riderOrderMemos[baseKey + '_' + String((o && o.timestamp) || '').replace(/\s+/g, '')] || '').trim();
                                if (m && !seen.has(m)) { seen.add(m); rows.push(['📝', '주문메모', m, '#b45309']); }
                            });

                            const hit = (customer.orders || []).find(x => String((x && x.note) || '').trim());
                            if (hit) rows.push(['🙋', '요청사항', String(hit.note).trim(), '#1d4ed8']);

                            if (!rows.length) return '';
                            const line = ([ico, lab, txt, color]) => `
                                <div style="display:flex; gap:6px; align-items:baseline; line-height:1.5;">
                                    <span style="flex:0 0 74px; display:flex; gap:3px; align-items:baseline; color:${color}; font-weight:900;">
                                        <span style="flex:0 0 15px; text-align:center;">${ico}</span>
                                        <span style="flex:1; text-align:center;">${lab}</span>
                                    </span>
                                    <span style="flex:1; min-width:0; color:${color}; font-weight:800; word-break:break-all;">${esc(txt)}</span>
                                </div>`;
                            return `<div class="address-box" style="background:#fffbeb; border:1.5px solid #fcd34d; display:flex; flex-direction:column; gap:3px;">
                                ${rows.map(line).join('')}
                            </div>`;
                        })()}
                        
                        <div class="item-list">
                            ${itemHtml}
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:8px; border-top:1.5px solid #e5e7eb; font-weight:900; font-size:14px;">
                            <span>주문금액 총합</span>
                            <span style="color:var(--primary);">${cardTotalAmount.toLocaleString()}원</span>
                        </div>

                        ${(customer.deliveryPhotoExists || customer.deliveryPhoto) ? `
                            <div class="photo-thumbnail-container">
                                <span style="font-size:11px; font-weight:800; color:var(--primary);">📸 배달 완료 사진:</span>
                                ${customer.deliveryPhoto ? `
                                    <img src="${customer.deliveryPhoto}" class="photo-thumbnail" onclick="viewDeliveryPhotoRemote('${customer.phone}', '${encAttr(customer.orders[0].orderKey)}')">
                                ` : `
                                    <button class="btn-action-sm" style="font-size: 11px; padding: 4px 8px; cursor: pointer; border-radius: 4px; border: 1.5px solid var(--primary); background: #f0fdf4; color: var(--primary); font-weight: bold; height: auto; width: auto; line-height: 1.2;" onclick="viewDeliveryPhotoRemote('${customer.phone}', '${encAttr(customer.orders[0].orderKey)}')">보기 (클릭)</button>
                                `}
                            </div>
                        ` : ''}
                    </div>
                    <div class="rider-card-footer no-print">
                        <a href="tel:${cleanPhone}" class="btn-action btn-call">📞 전화</a>
                        <a href="sms:${cleanPhone}" class="btn-action btn-sms">💬 문자</a>
                        <button class="btn-action btn-photo" onclick="triggerCameraUpload('${customer.phone}', '${encAttr(orderKeysStr)}', '${encAttr(customer.name)}')">📸 사진업로드</button>
                        <button class="btn-action btn-complete" onclick="markAsDelivered('${customer.phone}', '${encAttr(orderKeysStr)}', '${encAttr(customer.name)}')">🚚 배달완료</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 공동현관 비밀번호 저장 — [변경] 라인별('12'=1·2라인 / '34'=3·4라인)
        async function saveEntrancePassword(line) {
            if (!activeApartment || !activeDong) return;
            const is34 = (line === '34');
            const input = document.getElementById(is34 ? "entrance-password-input-34" : "entrance-password-input-12");
            if (!input) return;
            const pwd = input.value.trim();
            const dongKeyName = is34 ? `${activeDong}_3-4라인` : `${activeDong}_1-2라인`;
            showLoader("공동현관 비밀번호 저장 중...");
            try {
                const aptKey = encodeURIComponent(gAptRoadKey(activeApartment));
                const dongKey = encodeURIComponent(dongKeyName);
                const url = `${FIREBASE_DB_URL}entrance_passwords/${aptKey}/${dongKey}.json`;
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pwd)
                });
                if (!res.ok) throw new Error("Firebase 저장 실패");
                showToast(`${is34 ? '3·4' : '1·2'} 라인 공동현관 비밀번호가 저장되었습니다.`);

                if (!entrancePasswords[activeApartment]) {
                    entrancePasswords[activeApartment] = {};
                }
                entrancePasswords[activeApartment][dongKeyName] = pwd;
            } catch (e) {
                console.error(e);
                showToast("저장에 실패했습니다.");
            } finally {
                hideLoader();
            }
        }

        // 단순 배달 완료 처리 (여러 주문 일괄 처리)
        // [신규] onclick 속성에 문자열을 안전하게 담기 위한 인코딩(따옴표/쉼표/특수문자 대응). 핸들러에서 decodeURIComponent로 복원.
        function encAttr(s){ return encodeURIComponent(String(s == null ? '' : s)).replace(/'/g, '%27'); }
        function decAttr(s){ try { return decodeURIComponent(String(s == null ? '' : s)); } catch(e){ return String(s == null ? '' : s); } }

        async function markAsDelivered(phone, orderKeysStr, customerName) {
            orderKeysStr = decAttr(orderKeysStr);
            customerName = decAttr(customerName);
            if (!confirm("배달 완료 처리하시겠습니까?")) return;
            showLoader("배달 완료 처리 중...");
            const cleanPhone = normalizePhoneNumber(phone);
            const orderKeys = orderKeysStr.split("|@@|");
            try {
                const promises = [];
                const patchBody = {
                    status: "배달완료",
                    canceled: false,
                    isStocked: true,
                    delivered: true
                };

                orderKeys.forEach(orderKey => {
                    const target = rawOrders.find(it => it.orderKey === orderKey);
                    // [버그수정] 여러 전화번호 변형(정규화·숫자만·82붙임 등)에 전부 PATCH하면, 실제 주문이 없는
                    // 변형 경로마다 상태 플래그만 있는 '유령 주문'이 새로 생성됨. 실제 저장 노드 키(firebasePhoneKey)
                    // 한 곳에만 PATCH해서 유령 생성을 원천 차단 (target 없으면 정규화 번호로 폴백).
                    const pKey = (target && target.firebasePhoneKey) ? String(target.firebasePhoneKey).trim()
                               : (target && target.phone) ? normalizePhoneNumber(target.phone)
                               : cleanPhone;
                    const url = `${FIREBASE_DB_URL}orders/${encodeURIComponent(pKey)}/${encodeURIComponent(orderKey)}.json`;
                    // [수정] 예전에는 응답을 확인하지 않아, 저장이 실패해도 화면만 '배달완료'로 바뀌었다.
                    //  (전체를 다시 받아 확인하던 방식은 매번 450KB가 들어 없앴다)
                    //  성공할 때까지 3번 다시 시도하고, 끝내 실패하면 아래에서 오류로 알린다.
                    promises.push((async () => {
                        let lastErr = null;
                        for (let a = 1; a <= 3; a++) {
                            try {
                                const r = await fetch(url, {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(patchBody)
                                });
                                if (!r.ok) throw new Error(`서버 응답 ${r.status}`);
                                return true;
                            } catch (e) {
                                lastErr = e;
                                await new Promise(res => setTimeout(res, 400 * a));
                            }
                        }
                        throw new Error(`배달완료 저장 실패: ${lastErr ? lastErr.message : ''}`);
                    })());
                });

                await Promise.all(promises);

                // 로컬 메모리 rawOrders 및 UI 즉시 회색 전환
                orderKeys.forEach(orderKey => {
                    const targets = rawOrders.filter(it => it.orderKey === orderKey || (normalizePhoneNumber(it.phone) === cleanPhone && it.orderKey === orderKey));
                    targets.forEach(t => {
                        Object.assign(t, patchBody);
                        t.status = "배달완료";
                        t.delivered = true;
                    });
                });
                renderFilteredData();

                showToast("배달 완료 처리되었습니다.");

                // 완료 메시지 발송 모달/연동 호출
                const messageText = `[모켓] ${customerName}님, 주문하신 상품의 배달이 완료되었습니다. 감사합니다.🙇🏻‍♂️`;
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const separator = isIOS ? '&' : '?';
                const smsUrl = `sms:${cleanPhone}${separator}body=${encodeURIComponent(messageText)}`;

                setTimeout(() => {
                    window.location.href = smsUrl;
                }, 800);

                // [수정] 여기서 전체 주문(약 450KB)을 다시 받고 있었다. 바로 위에서 rawOrders와 화면을
                //  이미 고쳐 놓았으므로 다시 받을 이유가 없다. 필요하면 '🔄 갱신'을 누른다.
            } catch (e) {
                console.error(e);
                // 저장에 실패했으면 화면도 그대로 둔다(회색 전환은 위에서 성공한 뒤에만 한다)
                showToast("⚠️ 배달완료 처리에 실패했습니다. 다시 시도해 주세요.");
            } finally {
                hideLoader();
            }
        }

        // 카메라 사진 업로드 준비
        let activeUploadKeys = [];
        let activeUploadCustomerName = "";
        function triggerCameraUpload(phone, orderKeysStr, customerName) {
            orderKeysStr = decAttr(orderKeysStr);
            customerName = decAttr(customerName);
            activeUploadPhone = phone;
            activeUploadKeys = orderKeysStr.split("|@@|");
            activeUploadCustomerName = customerName;
            document.getElementById('camera-input').click();
        }

        // 배달 완료 사진 업로드 처리 (여러 주문 일괄 처리)
        async function handleDeliveryPhotoUpload(event) {
            const file = event.target.files[0];
            if (!file || !activeUploadPhone) return;
            showLoader("사진 압축 및 업로드 중...");
            try {
                const compressedBase64 = await resizeAndCompressImage(file);
                const cleanPhone = normalizePhoneNumber(activeUploadPhone);

                const patchBody = {
                    status: "배달완료",
                    canceled: false,
                    isStocked: true,
                    delivered: true,
                    deliveryPhoto: null,
                    deliveryPhotoExists: true,
                    deliveryPhotoTime: Date.now()
                };

                const allKeysToPatch = new Set(activeUploadKeys || []);

                const promises = [];
                allKeysToPatch.forEach(orderKey => {
                    // [버그수정] 여러 전화번호 변형에 전부 PATCH하면 없는 경로마다 유령이 생김.
                    // 실제 저장 노드 키(firebasePhoneKey) 한 곳에만 PATCH (target 없으면 정규화 번호 폴백).
                    const target = rawOrders.find(it => it.orderKey === orderKey);
                    const pKey = (target && target.firebasePhoneKey) ? String(target.firebasePhoneKey).trim()
                               : (target && target.phone) ? normalizePhoneNumber(target.phone)
                               : cleanPhone;
                    const url = `${FIREBASE_DB_URL}orders/${encodeURIComponent(pKey)}/${encodeURIComponent(orderKey)}.json`;
                    const p = fetch(url, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(patchBody)
                    }).then(async (res) => {
                        if (!res.ok) throw new Error("Firebase 전송 실패");

                        // 실제 이미지 데이터는 delivery_photos 노드에 별도 저장
                        // [수정] 사진 저장 응답도 확인한다. 예전에는 사진이 안 올라가도 완료로 처리됐다.
                        const pr = await fetch(`${FIREBASE_DB_URL}delivery_photos/${encodeURIComponent(pKey)}/${encodeURIComponent(orderKey)}.json`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ photo: compressedBase64 })
                        });
                        if (!pr.ok) throw new Error(`사진 저장 실패 (서버 응답 ${pr.status})`);
                    });
                    promises.push(p);
                });

                await Promise.all(promises);

                // 로컬 메모리 rawOrders 및 UI 즉시 회색 전환
                rawOrders.forEach(t => {
                    if (normalizePhoneNumber(t.phone) === cleanPhone && allKeysToPatch.has(t.orderKey)) {
                        Object.assign(t, patchBody);
                        t.status = "배달완료";
                        t.delivered = true;
                        t.deliveryPhotoExists = true;
                        t.deliveryPhoto = compressedBase64;
                    }
                });
                renderFilteredData();

                showToast("배달 사진이 업로드되었으며, 배달 완료 처리되었습니다.");

                // 완료 메시지 발송 모달/연동 호출
                const customerName = activeUploadCustomerName || "고객";
                const messageText = `[모켓] ${customerName}님, 주문하신 상품의 배달이 완료되었습니다. 감사합니다.🙇🏻‍♂️`;
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const separator = isIOS ? '&' : '?';
                const smsUrl = `sms:${cleanPhone}${separator}body=${encodeURIComponent(messageText)}`;

                activeUploadPhone = "";
                activeUploadKeys = [];
                activeUploadCustomerName = "";

                setTimeout(() => {
                    window.location.href = smsUrl;
                }, 800);

                // [수정] 여기서 전체 주문(약 450KB)을 다시 받고 있었다. 바로 위에서 rawOrders와 화면을
                //  이미 고쳐 놓았으므로 다시 받을 이유가 없다. 필요하면 '🔄 갱신'을 누른다.
            } catch (e) {
                console.error(e);
                showToast("⚠️ 사진 업로드에 실패했습니다. 배달완료 처리도 되지 않았습니다.");
            } finally {
                hideLoader();
                event.target.value = "";
            }
        }

        // 사진 팝업 모달
        async function viewDeliveryPhotoRemote(phone, orderKey) {
            orderKey = decAttr(orderKey);
            const photoKey = phone + "_" + orderKey;
            let photoData = window.deliveryPhotos ? window.deliveryPhotos[photoKey] : null;
            if (!photoData) {
                showLoader("사진 가져오는 중...");
                try {
                    // [수정] 사진은 저장할 때 대표키(서랍 이름, firebasePhoneKey)로 넣는다.
                    //  찾을 때도 같은 값으로 찾아야 두 값이 다른 손님의 사진이 보인다.
                    const raw = String(phone || "").replace(/\D/g, "");
                    const hit = (rawOrders || []).find(o =>
                        String(o.firebasePhoneKey || "").replace(/\D/g, "") === raw
                        || String(o.phone || "").replace(/\D/g, "") === raw
                    );
                    const cleanPhone = (hit && String(hit.firebasePhoneKey || "").replace(/\D/g, "")) || raw;
                    const res = await fetch(`${FIREBASE_DB_URL}delivery_photos/${cleanPhone}/${orderKey}.json`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.photo) {
                            photoData = data.photo;
                            if (!window.deliveryPhotos) window.deliveryPhotos = {};
                            window.deliveryPhotos[photoKey] = photoData;
                        }
                    }
                } catch (e) {
                    console.error("배달 사진 가져오기 실패:", e);
                } finally {
                    hideLoader();
                }
            }
            if (photoData) {
                viewDeliveryPhoto(photoKey, photoData);
            } else {
                showToast("사진 데이터를 찾을 수 없습니다.");
            }
        }

        window.deliveryPhotos = {};
        function viewDeliveryPhoto(key, photoData) {
            const modal = document.getElementById("photo-modal");
            const modalImg = document.getElementById("photo-modal-img");
            if (modal && modalImg) {
                modalImg.src = photoData;
                modal.style.display = "flex";
            }
        }

        // 사진 모달 닫기
        function closePhotoModal() {
            const modal = document.getElementById("photo-modal");
            if (modal) modal.style.display = "none";
        }

        // 검색어 입력 이벤트
        function handleSearchInput() {
            renderFilteredData();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = '';
                renderFilteredData();
            }
        }

        // 유틸 UI 효과
        function showLoader(text = "처리 중입니다...") {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loader').style.display = 'flex';
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        window.onload = function () {
            // [수정] 앱을 열 때 한 번만 받는다.
            //  예전에는 화면이 켜지거나(visibilitychange) 다른 앱에서 돌아올 때(pageshow)마다
            //  전체 주문(약 450KB)을 다시 받아, 문자·사진·지도로 오갈 때마다 데이터가 크게 나갔다.
            //  이제 최신 주문이 필요하면 위의 '🔄 갱신' 버튼을 누른다.
            // [신규] 묶어 둔 구역 이름을 먼저 받아 둔다. 몇 KB라 부담이 없고,
            //  이게 없으면 빌라가 전부 '기타'로 떠서 어느 집인지 알 수 없다.
            Promise.all([
                loadApartmentCustom().catch(e => console.warn('구역 자료 실패:', e)),
                loadApartmentTable().catch(e => console.warn('아파트 표 실패:', e)),
                loadApartmentOrder().catch(e => console.warn('아파트 순서 실패:', e))
            ]).finally(() => loadData());
        };
    </script>
    <!-- [신규] 설정 창 — 공동현관 비번 · 아파트 순서 -->
    <div id="settings-modal" style="display:none; position:fixed; z-index:10050; left:0; top:0; width:100%; height:100%; background:rgba(15,23,42,0.55); align-items:center; justify-content:center; padding:14px; box-sizing:border-box;" onclick="if(event.target===this) closeSettings()">
        <div style="background:#fff; border-radius:16px; width:100%; max-width:380px; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.25);">
            <div style="padding:13px 15px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; gap:8px;">
                <div style="flex:1; font-size:15px; font-weight:900; color:#0f172a;">⚙️ 설정</div>
                <span onclick="closeSettings()" style="flex:0 0 auto; font-size:24px; font-weight:800; color:#94a3b8; cursor:pointer; line-height:1;">&times;</span>
            </div>
            <div style="padding:12px 15px 16px; display:flex; flex-direction:column; gap:9px;">
                <button type="button" onclick="settingsOpenPwd()"
                    style="width:100%; text-align:left; padding:14px 15px; border:1.5px solid #e2e8f0; background:#fff; border-radius:12px; font-size:14.5px; font-weight:800; color:#0f172a; cursor:pointer;">🚪 공동현관 비번</button>
                <button type="button" onclick="openAptOrder()"
                    style="width:100%; text-align:left; padding:14px 15px; border:1.5px solid #e2e8f0; background:#fff; border-radius:12px; font-size:14.5px; font-weight:800; color:#0f172a; cursor:pointer;">🏢 아파트 순서</button>
                <!-- [신규] 가게 로그인 — 누가 로그인했는지 보이고 로그아웃한다 -->
                <button type="button" onclick="gStaffSignOut()"
                    style="width:100%; text-align:left; padding:12px 15px; border:1.5px solid #e2e8f0; background:#f8fafc; border-radius:12px; font-size:13.5px; font-weight:800; color:#475569; cursor:pointer;">👤 <span id="staff-me-label">로그인 정보</span> · 로그아웃</button>
            </div>
        </div>
    </div>

    <!-- [신규] 아파트 순서 창 — 위로 올린 아파트가 앞에 나온다 -->
    <div id="apt-order-modal" style="display:none; position:fixed; z-index:10051; left:0; top:0; width:100%; height:100%; background:rgba(15,23,42,0.55); align-items:center; justify-content:center; padding:14px; box-sizing:border-box;" onclick="if(event.target===this) closeAptOrder()">
        <div style="background:#fff; border-radius:16px; width:100%; max-width:400px; max-height:86vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.25);">
            <div style="padding:13px 15px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; gap:8px;">
                <button type="button" onclick="closeAptOrder(); openSettings();" style="flex:0 0 auto; width:34px; height:34px; border:1.5px solid #e2e8f0; background:#fff; color:#475569; border-radius:9px; font-size:15px; font-weight:800; cursor:pointer;">‹</button>
                <div style="flex:1; font-size:15px; font-weight:900; color:#0f172a;">🏢 아파트 순서</div>
                <span onclick="closeAptOrder()" style="flex:0 0 auto; font-size:24px; font-weight:800; color:#94a3b8; cursor:pointer; line-height:1;">&times;</span>
            </div>
            <div style="padding:10px 15px 0; font-size:12px; font-weight:700; color:#94a3b8; line-height:1.5;">
                ≡ 를 끌어서 옮기면 위에 있는 아파트가 앞에 나옵니다.<br>지금까지 배달 간 아파트를 모두 보여 줍니다.
            </div>
            <div id="apt-order-body" style="overflow-y:auto; padding:6px 15px 10px; -webkit-overflow-scrolling:touch;"></div>
            <div style="padding:11px 15px 14px; border-top:1px solid #f1f5f9;">
                <button type="button" id="apt-order-save" onclick="saveAptOrder()"
                    style="width:100%; height:44px; border:none; background:#2563eb; color:#fff; border-radius:11px; font-size:15px; font-weight:900; cursor:pointer;">저장</button>
            </div>
        </div>
    </div>

    <!-- [신규] 공동현관 비번 조회 창 — 아파트 → 동 → 비번 -->
    <div id="pwd-finder-modal" style="display:none; position:fixed; z-index:10050; left:0; top:0; width:100%; height:100%; background:rgba(15,23,42,0.55); align-items:center; justify-content:center; padding:14px; box-sizing:border-box;" onclick="if(event.target===this) closePasswordFinder()">
        <div style="background:#fff; border-radius:16px; width:100%; max-width:440px; max-height:86vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.25);">
            <div style="padding:13px 15px; border-bottom:1px solid #e2e8f0; display:flex; align-items:center; gap:8px;">
                <button type="button" id="pwd-finder-back" onclick="pwdFinderBack()" style="display:none; flex:0 0 auto; width:34px; height:34px; border:1.5px solid #e2e8f0; background:#fff; color:#475569; border-radius:9px; font-size:15px; font-weight:800; cursor:pointer;">‹</button>
                <div id="pwd-finder-title" style="flex:1; font-size:15px; font-weight:900; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🚪 공동현관 비번</div>
                <span onclick="closePasswordFinder()" style="flex:0 0 auto; font-size:24px; font-weight:800; color:#94a3b8; cursor:pointer; line-height:1;">&times;</span>
            </div>
            <div style="padding:10px 15px; border-bottom:1px solid #f1f5f9;">
                <input type="text" id="pwd-finder-search" oninput="renderPasswordFinder()" placeholder="🔍 아파트·동 찾기"
                    style="width:100%; box-sizing:border-box; height:38px; padding:8px 11px; border:1.5px solid #cbd5e1; border-radius:9px; font-size:13px; font-weight:700;">
            </div>
            <div id="pwd-finder-body" style="overflow-y:auto; padding:12px 15px 16px; -webkit-overflow-scrolling:touch;"></div>
        </div>
    </div>

</body>
