                filtered = filtered.filter(item => {
                    const cleanPhone = String(item.phone || "").replace(/\D/g, "");
                    const customerItems = customerCompletionMap[cleanPhone] || [item];
                    const isCustomerCompleted = customerItems.every(it => {
                        return (it.delivered === true || it.delivered === "true" || String(it.delivered).toUpperCase() === "TRUE" || it.status === "배달완료");
                    });

                    if (filterStatus === 'completed') {
                        return isCustomerCompleted;
                    } else if (filterStatus === 'incomplete') {
                        return !isCustomerCompleted;
                    }
                    return true;
                });
            }

            // 4단계: 아파트별 그룹화
            const aptGroups = {};
            filtered.forEach(item => {
                const aptName = extractApartmentName(item.address);
                if (!aptGroups[aptName]) {
                    aptGroups[aptName] = [];
                }
                aptGroups[aptName].push(item);
            });

            // 아파트 버튼 생성
            const aptContainer = document.getElementById('apartment-buttons');
            aptContainer.innerHTML = '';

            // [수정] 아파트 버튼 순서 — 배달 갈 집이 많은 곳부터.
            //  세는 단위는 버튼에 찍히는 숫자와 같은 '집 수'다. 상품 줄 수로 세면
            //  한 집에서 많이 시킨 아파트가 실제보다 앞으로 올라온다.
            //  [수정] 예전에는 '푸지2차'를 코드에 박아 늘 맨 앞에 뒀다. 그날 물량이 적어도
            //   맨 앞에 있어서 순서가 실제와 달랐다. 이제 어느 아파트든 그날 집 수로만 줄 세운다.
            //   '기타'만 늘 맨 뒤에 둔다 (아파트로 안 잡힌 주소 모음이라 마지막에 도는 편이 낫다).
            const gHouseCount = (list) => new Set(
                (list || []).map(it => normalizePhoneNumber(it.phone)).filter(Boolean)
            ).size;
            //  [수정] 설정에서 순서를 정해 두면 그 순서가 먼저다. 안 적힌 아파트만 집 수로 줄 세운다.
            window.__aptGroupsNow = aptGroups;   // 설정 창이 '오늘 배달 있는 아파트'를 여기서 본다
            const apartments = Object.keys(aptGroups).sort((a, b) => {
                if (a === "기타") return 1;
                if (b === "기타") return -1;
                const oa = gAptOrderIdx(a), ob = gAptOrderIdx(b);
                if (oa !== ob) return oa - ob;
                const diff = gHouseCount(aptGroups[b]) - gHouseCount(aptGroups[a]);
                if (diff !== 0) return diff;
                return a.localeCompare(b);
            });
            if (apartments.length === 0) {
                aptContainer.innerHTML = '<div style="font-size:13px; color:var(--text-sub); font-weight:700; padding:10px;">배달 건이 없습니다.</div>';
                document.getElementById('dong-section').style.display = 'none';
                document.getElementById('order-list').innerHTML = '<div style="text-align:center; padding:50px; font-weight:800; color:var(--text-sub);">조건에 일치하는 배달 주문이 없습니다.</div>';
                return;
            }

            if (!activeApartment) {
                // 이 날짜에서 마지막으로 보던 아파트가 있으면 그리로 돌아간다
                const remembered = lastAptByDay[gDayKey()];
                activeApartment = (remembered && apartments.includes(remembered)) ? remembered : "전체";
                if (activeApartment !== "전체") activeDong = lastDongByApt[gAptKey(activeApartment)] || "전체";
            } else if (activeApartment !== "전체" && !apartments.includes(activeApartment)) {
                // 기억해 둔 아파트가 이번 날짜엔 배달이 없을 때만 전체로 되돌린다
                activeApartment = "전체";
                lastAptByDay[gDayKey()] = "전체";
            }

            /* [수정] 맨 앞에 '전체' 버튼을 다시 뒀다. 아파트를 한 번 더 눌러 푸는 것만으로는
               지금 전체를 보고 있는지 알기 어려웠다. 누르면 그날 배달을 모두 보여 준다. */
            const allAptBtn = document.createElement('button');
            allAptBtn.className = `btn-select apt-btn ${activeApartment === "전체" ? 'active' : ''}`;
            allAptBtn.innerHTML = `<span style="display:block; line-height:1.15;">전체</span><span style="display:block; font-size:11px; font-weight:800; line-height:1.15; opacity:0.85;">${getDeliveryProgressText(filtered)}</span>`;
            allAptBtn.onclick = () => {
                activeApartment = "전체";
                activeDong = "전체";
                lastAptByDay[gDayKey()] = "전체";
                document.querySelectorAll('.apt-btn').forEach(b => b.classList.remove('active'));
                allAptBtn.classList.add('active');
                document.getElementById('dong-section').style.display = 'none';
                renderOrderCards(filtered);
            };
            aptContainer.appendChild(allAptBtn);

            apartments.forEach(apt => {
                const btn = document.createElement('button');
                btn.className = `btn-select apt-btn ${apt === activeApartment ? 'active' : ''}`;
                btn.innerHTML = `<span style="display:block; line-height:1.15;">${apt}</span><span style="display:block; font-size:11px; font-weight:800; line-height:1.15; opacity:0.85;">${getDeliveryProgressText(aptGroups[apt])}</span>`;
                btn.onclick = () => {
                    // [수정] 그 아파트에서 마지막으로 보던 동으로 되돌아간다 (없으면 전체)
                    activeDong = lastDongByApt[gAptKey(apt)] || "전체";
                    if (activeApartment === apt) {
                        // [변경] 토글 해제 → 전체(선택 없음, 하이라이트 없음)
                        activeApartment = "전체";
                        lastAptByDay[gDayKey()] = "전체";
                        document.querySelectorAll('.apt-btn').forEach(b => b.classList.remove('active'));
                        allAptBtn.classList.add('active');   // [수정] 전체 버튼에 불이 들어오게
                        document.getElementById('dong-section').style.display = 'none';
                        renderOrderCards(filtered);
                    } else {
                        activeApartment = apt;
                        lastAptByDay[gDayKey()] = apt;
                        document.querySelectorAll('.apt-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        renderDongButtons(aptGroups[apt]);
                    }
                };
                aptContainer.appendChild(btn);
            });

            if (activeApartment === "전체") {
                document.getElementById('dong-section').style.display = 'none';
                renderOrderCards(filtered);
            } else if (aptGroups[activeApartment]) {
                renderDongButtons(aptGroups[activeApartment]);
            } else {
                activeApartment = "전체";
                allAptBtn.classList.add('active');
                document.getElementById('dong-section').style.display = 'none';
                renderOrderCards(filtered);
            }
        }

        /* [신규] 하위 묶음 이름 — 카드 제목과 같은 기준을 쓴다.
           묶어 둔 구역(빌라)이면 구역 이름, 아니면 예전처럼 '101동'.
           '기타' 탭이 동별로 쪼개지던 문제를 여기서 잡는다. (빌라는 '102호'의 첫 숫자를
           동으로 넘겨짚어 102동·203동처럼 엉뚱한 칸이 잔뜩 생겼다) */
        function getDongGroupName(item) {
            const zone = findCustomZoneName(item.address);
            if (zone) return zone;
            return formatDongName(getDongNumber(item.addressDetail, item.address));
        }


        /* [신규] 공동현관 비번 빈칸 자동 채우기
           손님이 주문서에 적어 둔 '공동현관 입력값'을, 그 동·호수에 적어 둔 비번이 없을 때만 넣는다.
             · 그 호수를 덮는 칸에 비번이 있으면 손대지 않는다 (1-2라인이 있으면 2호는 이미 덮인 것이다)
             · 단지 공용 비번은 따로 관리하는 값이라, 있어도 그 호수 칸은 따로 채운다
             · 칸은 쓰던 방식 그대로 만든다 — 예: 1304호면 '13동_4-4라인'
             · 빌라·다세대(기타·묶어 둔 구역)는 집집마다 달라 넣지 않는다 */
        async function gAutoFillEntrancePwd() {
            // [수정] 비번 쓰기는 가게 계정만 된다(서버 규칙). 기사 화면에서는 채우지 않고, 가게 화면이 열릴 때 채운다.
            if (!gIsStore()) return 0;
            const seen = new Set();
            const jobs = [];
            (rawOrders || []).forEach(it => {
                if (!it) return;
                const pwd = String(it.entrance || '').trim();
                if (!pwd) return;
                // [수정] '경비실'처럼 글자만 적어 둔 것은 비번이 아니라 넣지 않는다 (숫자가 둘 이상 있어야 한다)
                if ((pwd.match(/\d/g) || []).length < 2) return;
                if (findCustomZoneName(it.address)) return;
                const apt = extractApartmentName(it.address || '');
                if (!apt || apt === '기타') return;
                // [수정] 단지 공용 비번은 따로 관리하므로, 있어도 그 호수에 맞는 칸은 따로 채운다
                const dong = getDongGroupName(it);
                if (!dong || dong === '기타') return;
                const ho = gHoOf(it.addressDetail || '');
                if (ho == null) return;
                const covered = gSlotsOf(apt, dong).some(s => String(s.pwd || '').trim()
                    && (s.from == null || (ho >= s.from && ho <= s.to)));
                if (covered) return;
                const key = gSlotKey(dong, ho, ho);
                const id = `${apt}|${key}`;
                if (seen.has(id)) return;
                seen.add(id);
                jobs.push({ apt, key, pwd });
            });
            if (!jobs.length) return 0;

            let n = 0;
            for (const j of jobs) {
                try {
                    const url = `${FIREBASE_DB_URL}entrance_passwords/${encodeURIComponent(gAptRoadKey(j.apt))}/${encodeURIComponent(j.key)}.json`;
                    const res = await fetch(url, {
                        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(j.pwd)
                    });
                    if (!res.ok) continue;
                    if (!entrancePasswords[j.apt]) entrancePasswords[j.apt] = {};
                    entrancePasswords[j.apt][j.key] = j.pwd;
                    n++;
                } catch (e) { /* 하나 실패해도 나머지는 넣는다 */ }
            }
            if (!n) return 0;
            try { localStorage.setItem('moket_entrance_passwords_cache', JSON.stringify(entrancePasswords)); } catch (e) { }
            renderFilteredData();
            showToast(`공동현관 비번 ${n}곳을 손님이 적은 값으로 채웠습니다.`);
            return n;
        }

        /* ===== [신규] 설정 =====
           공동현관 비번과 아파트 순서를 여기서 고친다.
             · 아파트 순서 — 아파트 단추가 나오는 순서. 정해 둔 것이 없으면 예전처럼 그날 집 수가 많은 곳부터.
             · 정한 순서는 서버(apartment_order)에 담아 기사 모두가 같은 순서로 본다. */
        const APT_ORDER_KEY = 'moket_apt_order';
        let APT_ORDER = [];
        try { const _c = localStorage.getItem(APT_ORDER_KEY); if (_c) APT_ORDER = JSON.parse(_c) || []; } catch (e) { }

        async function loadApartmentOrder() {
            try {
                const res = await fetch(`${FIREBASE_DB_URL}apartment_order.json?t=${Date.now()}`);
                if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
                const data = await res.json();
                const list = Array.isArray(data) ? data : (data ? Object.values(data) : []);
                APT_ORDER = list.map(x => String(x || '').trim()).filter(Boolean);
                try { localStorage.setItem(APT_ORDER_KEY, JSON.stringify(APT_ORDER)); } catch (e) { }
            } catch (e) {
                console.warn('아파트 순서 불러오기 실패:', e);   // 못 받으면 기기에 담아 둔 순서를 쓴다
            }
            return APT_ORDER;
        }

        // 정해 둔 순서에서 몇 번째인지. 안 적힌 아파트는 뒤로 보낸다.
        function gAptOrderIdx(name) {
            const i = APT_ORDER.indexOf(name);
            return i < 0 ? Infinity : i;
        }

        // [신규] 지금 로그인한 사람이 가게 계정인지 (배달기사면 false)
        function gIsStore() { const me = window.gStaffMe; return !!(me && me.role === 'store'); }

        function openSettings() {
            const me = window.gStaffMe, el = document.getElementById('staff-me-label');
            if (el && me) el.innerText = `${me.name || me.email} (${me.role === 'store' ? '가게' : '기사'})`;
            // [수정] 가게 계정은 설정이 전부 보이고, 배달기사는 '정산'과 로그아웃만 보인다 (본인 건수·금액 보기용)
            const isStore = !!(me && me.role === 'store');
            document.querySelectorAll('#settings-modal [data-store-only]').forEach(b => { b.style.display = isStore ? '' : 'none'; });
            document.getElementById('settings-modal').style.display = 'flex';
        }

        /* ── [신규] 정산 — 달마다 기사별 단가 · 건수 · 금액 · 지급 ────────────────
           배달 기록(deliveries)에서 그 달 것만 받아 기사별 건수를 센다. 한 칸 = 집 하나 · 하루 = 1건.
           기사마다 단가를 적으면 금액 = 건수 × 단가.
           '지급'을 누르면 그때까지 안 준 건수 × 단가를 한 번의 지급으로 남긴다. 같은 달에 지급한 뒤
           배달이 더 생기면 '지급 +N'으로 그 몫만 따로 지급한다(2026-10-01 사용자 선택). 지급한 금액은 고정이다.
             rider_pay / 2026-09 / 기사uid = { rate, name, payments: { 지급번호: { at, by, count, rate, amount } } }
           단가를 아직 안 적은 달은 지난달 단가를 이어 쓴다(저장은 고치거나 지급할 때).
           가게 계정은 전체 기사를 보고 고치고, 배달기사는 본인 것만 본다(고치기 없음). */
        let payMonthData = {};         // { DD: { 집키: 기록 } }
        let paySaved = {};             // { 기사uid: { rate, name, payments } }  (고른 달)
        let payPrevRate = {};          // { 기사uid: 지난달 단가 }
        /* [신규] 날짜별 할증 — 그날은 한 집마다 기본 단가에 이만큼 더한다. 그날 배달한 기사 모두에게 같이 붙는다.
             rider_surcharge / 2026-09 / 14 = 500
           가게가 정산 달력에서 날짜를 눌러 적는다. 기사도 볼 수는 있다(본인 금액 계산에 쓰이므로). */
        let paySurcharge = {};         // { DD: 건당 할증 }  (고른 달)
        let paySurPick = '';           // 할증을 고치려고 고른 날짜 'DD'
        let payOpenRider = '';

        function payMonthKeys() {
            const out = [], d = new Date();
            d.setDate(1);
            for (let i = 0; i < 12; i++) {
                out.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                d.setMonth(d.getMonth() - 1);
            }
            return out;
        }
        function payPrevMonth(m) { const [y, mm] = m.split('-').map(Number); const d = new Date(y, mm - 2, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; }
        function payMonthLabel(m) { const [y, mm] = m.split('-'); return `${y}년 ${parseInt(mm)}월`; }
        function payWon(n) { return (parseInt(n) || 0).toLocaleString() + '원'; }
        function payDigits(s) { return parseInt(String(s || '').replace(/\D/g, '')) || 0; }
        function payMD(ts) { const d = new Date(parseInt(ts) || 0); return `${d.getMonth() + 1}/${d.getDate()}`; }
        function payIsStore() { const me = window.gStaffMe; return !!(me && me.role === 'store'); }

        async function openPay() {
            const me = window.gStaffMe;
            if (!me) return;
            closeSettings();
            const sel = document.getElementById('pay-month');
            const keep = sel.value;
            sel.innerHTML = payMonthKeys().map(m => `<option value="${m}">${payMonthLabel(m)}</option>`).join('');
            if (keep) sel.value = keep;
            payOpenRider = '';
            document.getElementById('pay-modal').style.display = 'flex';
            await payLoad();
        }
        function closePay() { document.getElementById('pay-modal').style.display = 'none'; }

        async function payLoad() {
            const month = document.getElementById('pay-month').value;
            const body = document.getElementById('pay-body');
            body.innerHTML = `<div class="pay-empty">불러오는 중...</div>`;
            try {
                // 배달기사는 단가·지급도 본인 칸만 받는다 (다른 기사 것은 규칙상 못 본다)
                const me = window.gStaffMe || {};
                const mine = encodeURIComponent(me.uid || '');
                const store = payIsStore();
                const prev = payPrevMonth(month);
                const [dRes, pRes, qRes, sRes] = await Promise.all([
                    fetch(`${FIREBASE_DB_URL}${DELIV_NODE}/${month}.json`),
                    fetch(`${FIREBASE_DB_URL}rider_pay/${month}${store ? '' : '/' + mine}.json`),
                    fetch(`${FIREBASE_DB_URL}rider_pay/${prev}${store ? '' : '/' + mine}.json`),
                    fetch(`${FIREBASE_DB_URL}rider_surcharge/${month}.json`)
                ]);
                if (!dRes.ok || !pRes.ok || !qRes.ok || !sRes.ok) throw new Error('서버 응답 ' + [dRes.status, pRes.status, qRes.status, sRes.status].join('/'));
                payMonthData = (await dRes.json()) || {};
                paySurcharge = (await sRes.json()) || {};
                paySurPick = '';
                const p = await pRes.json(), q = await qRes.json();
                paySaved = store ? (p || {}) : (p ? { [me.uid]: p } : {});
                const prevAll = store ? (q || {}) : (q ? { [me.uid]: q } : {});
                payPrevRate = {};
                Object.keys(prevAll).forEach(uid => { const r = parseInt((prevAll[uid] || {}).rate) || 0; if (r) payPrevRate[uid] = r; });
                payRender();
            } catch (e) {
                console.warn('정산 불러오기 실패:', e);
                body.innerHTML = `<div class="pay-empty" style="color:var(--red); line-height:1.6;">불러오지 못했습니다.<br><span style="color:#94a3b8; font-weight:700;">Firebase 규칙을 게시하기 전이면 막혀 있습니다.</span></div>`;
            }
        }

        // 그 달 기록을 기사별로 묶는다. 기록은 없어도 저장해 둔 사람은 같이 보인다.
        function payByRider() {
            const riders = {};
            Object.keys(payMonthData).forEach(dd => {
                const houses = payMonthData[dd] || {};
                Object.keys(houses).forEach(h => {
                    const rec = houses[h] || {};
                    const uid = rec.rider || ('이름:' + (rec.riderName || '?'));
                    const r = riders[uid] = riders[uid] || { uid, name: '', count: 0, days: {} };
                    if (rec.riderName) r.name = rec.riderName;
                    r.count++;
                    (r.days[dd] = r.days[dd] || []).push(Object.assign({ house: h }, rec));
                });
            });
            Object.keys(paySaved).forEach(uid => {
                if (!riders[uid]) riders[uid] = { uid, name: (paySaved[uid] && paySaved[uid].name) || '', count: 0, days: {} };
            });
            return Object.values(riders).sort((a, b) => b.count - a.count);
        }
        // 이 달 단가 (안 적었으면 지난달 단가)
        function payRateOf(uid) { return parseInt((paySaved[uid] || {}).rate) || payPrevRate[uid] || 0; }
        // 이 달 지급 기록들 (날짜순) · 지급한 건수·금액 합
        function payPaymentsOf(uid) {
            const s = paySaved[uid] || {};
            const list = Object.entries(s.payments || {}).map(([id, p]) => Object.assign({ id }, p));
            list.sort((a, b) => (a.at || 0) - (b.at || 0));
            return {
                list,
                count: list.reduce((n, p) => n + (parseInt(p.count) || 0), 0),
                amount: list.reduce((n, p) => n + (parseInt(p.amount) || 0), 0)
            };
        }
        function paySurOf(dd) { return parseInt(paySurcharge[dd]) || 0; }
        // 한 사람의 이 달 배달을 날짜 순으로 (지급은 앞에서부터 덮는다고 본다)
        function payDeliveriesOf(r) {
            const list = [];
            Object.keys(r.days || {}).forEach(dd => (r.days[dd] || []).forEach(rec => list.push({ dd, at: parseInt(rec.at) || 0 })));
            list.sort((a, b) => a.dd.localeCompare(b.dd) || a.at - b.at);
            return list;
        }
        /* 한 사람의 이 달 셈.
           지급한 몫은 그때 고정된 금액 그대로. 아직 안 준 몫은 날짜 순으로 앞에서부터 지급이 덮고 남은 배달들이고,
           한 건마다 (단가 + 그날 할증)을 더한다. */
        function payCalc(r, rateOverride) {
            const pay = payPaymentsOf(r.uid);
            const rate = rateOverride != null ? rateOverride : payRateOf(r.uid);
            const rest = payDeliveriesOf(r).slice(Math.min(pay.count, r.count));
            const left = rest.length;
            const surDue = rest.reduce((s, x) => s + paySurOf(x.dd), 0);
            const due = left * rate + surDue;
            return { pay, rate, left, surDue, due, total: pay.amount + due };
        }

        function payRender() {
            if (!payIsStore()) return payRenderMine();
            const month = document.getElementById('pay-month').value;
            const body = document.getElementById('pay-body');
            const riders = payByRider();
            if (!riders.length) {
                body.innerHTML = `<div class="pay-empty">${payMonthLabel(month)} 배달 기록이 없습니다.</div>`;
                return;
            }
            const rows = riders.map(r => {
                const c = payCalc(r);
                const last = c.pay.list[c.pay.list.length - 1];
                const uidAttr = encAttr(r.uid);
                const open = payOpenRider === r.uid;
                const locked = c.pay.list.length > 0 && c.left === 0;   // 다 줬으면 단가를 바꿀 일이 없다
                // [수정] 지급 날짜는 단추에서 빼고, 펼치면 나오는 지급 기록 표의 '지급일' 칸에 둔다
                const action = c.left > 0
                    ? `<button type="button" class="pay-act go" onclick="payPay('${uidAttr}')">${c.pay.list.length ? `지급<small>+${c.left}</small>` : '지급'}</button>`
                    : (last
                        ? `<span class="pay-act done" style="cursor:default;" title="지급일은 건수를 눌러 펼치면 보입니다">완료</span>`
                        : `<span class="pay-act" style="cursor:default;"></span>`);
                return `
                    <div class="pay-item${open ? ' open' : ''}">
                        <div class="pay-row">
                            <div class="pay-who"><span class="nm">${gEsc(r.name || '이름 없음')}</span></div>
                            <label class="pay-rate">
                                <input type="text" inputmode="numeric" id="pay-rate-${uidAttr}" data-pay-uid="${uidAttr}" value="${c.rate ? c.rate.toLocaleString() : ''}" placeholder="0" aria-label="단가"
                                    oninput="payRateInput(this)" onchange="paySaveRate('${uidAttr}', this.value)"
                                    ${locked ? 'disabled title="이 달 몫을 다 지급해서 단가를 바꿀 일이 없습니다. 지급 표시를 지우면 고칠 수 있습니다."' : ''}>
                            </label>
                            <span class="pay-cnt"><b>${r.count}</b>${c.pay.list.length && c.left > 0 ? `<em>+${c.left}</em>` : ''}</span>
                            <span class="amt${c.total ? '' : ' zero'}" data-pay-amt="${uidAttr}">${c.total.toLocaleString()}</span>
                            ${action}
                            <!-- [수정] 상세보기(지급 기록 · 날짜별 건수)는 맨 오른쪽 단추로 -->
                            <button type="button" class="pay-more${open ? ' open' : ''}" onclick="payToggleRider('${uidAttr}')" title="상세보기" aria-label="상세보기">${open ? '▲' : '▼'}</button>
                        </div>
                        ${open ? `<div class="pay-days">${payHistory(r, true)}${payRiderDetail(r)}</div>` : ''}
                    </div>`;
            }).join('');
            body.innerHTML = `
                <div class="pay-sum" id="pay-sum"></div>
                ${paySurBar(true)}
                <div class="pay-list">
                    <div class="pay-head"><span>기사</span><span class="c">단가</span><span class="c">건수</span><span class="r">금액(원)</span><span class="c">지급</span><span></span></div>
                    ${rows}
                </div>`;
            payUpdateSummary();
        }

        /* 지급 기록 — 작은 표. 칸은 위 기사 줄과 같다(지급일 · 건수 · 단가 · 금액 · 취소)라 세로로 맞는다.
           가게는 줄마다 '취소'로 지울 수 있다. 지급한 뒤 늦게 들어온 몫은 맨 아래 '미지급' 줄로 */
        function payHistory(r, canEdit) {
            const c = payCalc(r);
            if (!c.pay.list.length) return '';
            const uidAttr = encAttr(r.uid);
            const rows = c.pay.list.map(p => `
                <div class="pay-hrow">
                    <span class="d">${payMD(p.at)}</span>
                    <span class="c">${(parseInt(p.rate) || 0).toLocaleString()}</span>
                    <span class="c">${(parseInt(p.count) || 0).toLocaleString()}</span>
                    <span class="r">${(parseInt(p.amount) || 0).toLocaleString()}${parseInt(p.surcharge) ? `<small class="pay-sur-n">할증 ${parseInt(p.surcharge).toLocaleString()}</small>` : ''}</span>
                    <span class="c">${canEdit ? `<button type="button" onclick="payUnpay('${uidAttr}', '${encAttr(p.id)}')">취소</button>` : ''}</span>
                    <span></span>
                </div>`).join('');
            const due = c.left > 0 ? `
                <div class="pay-hrow due">
                    <span class="d">미지급</span>
                    <span class="c">${c.rate.toLocaleString()}</span>
                    <span class="c">${c.left.toLocaleString()}</span>
                    <span class="r">${c.due.toLocaleString()}${c.surDue ? `<small class="pay-sur-n">할증 ${c.surDue.toLocaleString()}</small>` : ''}</span>
                    <span></span><span></span>
                </div>` : '';
            return `<div class="pay-sec">지급 기록</div>
                <div class="pay-htable">
                    <div class="pay-hrow head"><span>지급일</span><span class="c">단가</span><span class="c">건수</span><span class="r">금액</span><span></span><span></span></div>
                    ${rows}${due}
                </div>`;
        }

        // 맨 위 요약 — 총 건수 · 총액 · 아직 안 준 금액. 단가를 치는 동안에도 따라 바뀐다.
        function payUpdateSummary() {
            const el = document.getElementById('pay-sum');
            if (!el) return;
            let cnt = 0, total = 0, due = 0;
            payByRider().forEach(r => {
                const inp = document.querySelector(`[data-pay-uid="${encAttr(r.uid)}"]`);
                const c = payCalc(r, inp && !inp.disabled ? payDigits(inp.value) : null);
                cnt += r.count; total += c.total; due += c.due;
            });
            el.innerHTML = `
                <div><span>총 건수</span><b>${cnt.toLocaleString()}건</b></div>
                <div><span>총액</span><b>${payWon(total)}</b></div>
                <div><span>미지급</span><b class="${due ? 'due' : ''}">${payWon(due)}</b></div>`;
        }

        // 단가를 치는 동안 쉼표를 붙이고, 그 줄 금액과 요약을 바로 다시 계산해 보여 준다
        function payRateInput(el) {
            const n = payDigits(el.value);
            el.value = n ? n.toLocaleString() : '';
            const uidAttr = el.getAttribute('data-pay-uid');
            const r = payByRider().find(x => x.uid === decAttr(uidAttr));
            const amt = document.querySelector(`[data-pay-amt="${uidAttr}"]`);
            if (r && amt) { const c = payCalc(r, n); amt.textContent = c.total.toLocaleString(); amt.classList.toggle('zero', !c.total); }
            payUpdateSummary();
        }
        // 단가 칸에서 손을 떼면 저장한다 (그 사람 · 그 달). 이미 지급한 몫은 안 바뀐다.
        async function paySaveRate(uidEnc, raw) {
            const uid = decAttr(uidEnc);
            const month = document.getElementById('pay-month').value;
            const rate = payDigits(raw);
            const r = payByRider().find(x => x.uid === uid) || {};
            try {
                const res = await fetch(`${FIREBASE_DB_URL}rider_pay/${month}/${encodeURIComponent(uid)}.json`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rate, name: r.name || '' })
                });
                if (!res.ok) throw new Error('서버 응답 ' + res.status);
                paySaved[uid] = Object.assign(paySaved[uid] || {}, { rate, name: r.name || '' });
                showToast(`${r.name || ''} 단가 ${rate.toLocaleString()}원`);
                payRender();
            } catch (e) { console.warn(e); showToast('⚠️ 단가를 저장하지 못했습니다.'); }
        }

        // 아직 안 준 몫(남은 건수 × 단가)을 한 번의 지급으로 남긴다
        async function payPay(uidEnc) {
            const uid = decAttr(uidEnc);
            const month = document.getElementById('pay-month').value;
            const r = payByRider().find(x => x.uid === uid);
            if (!r) return;
            const c = payCalc(r);
            if (!c.left) return;
            if (!c.rate) { showToast('단가를 먼저 적어 주세요.'); return; }
            const head = c.pay.list.length ? `${r.name || '이름 없음'} · ${payMonthLabel(month)} 추가분` : `${r.name || '이름 없음'} · ${payMonthLabel(month)}`;
            const surTxt = c.surDue ? ` + 할증 ${c.surDue.toLocaleString()}원` : '';
            if (!confirm(`${head}\n단가 ${c.rate.toLocaleString()}원 × ${c.left}건${surTxt} = ${c.due.toLocaleString()}원\n\n지급으로 표시할까요?`)) return;
            const me = window.gStaffMe || {};
            const id = String(Date.now());
            const rec = { at: Date.now(), by: me.name || me.email || '', count: c.left, rate: c.rate, surcharge: c.surDue, amount: c.due };
            try {
                const res = await fetch(`${FIREBASE_DB_URL}rider_pay/${month}/${encodeURIComponent(uid)}.json`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rate: c.rate, name: r.name || '', ['payments/' + id]: rec })
                });
                if (!res.ok) throw new Error('서버 응답 ' + res.status);
                const s = paySaved[uid] = Object.assign(paySaved[uid] || {}, { rate: c.rate, name: r.name || '' });
                s.payments = Object.assign(s.payments || {}, { [id]: rec });
                showToast('지급');
                payRender();
            } catch (e) { console.warn(e); showToast('⚠️ 지급 표시를 남기지 못했습니다.'); }
        }
        // 지급 한 번을 지운다 (잘못 눌렀을 때)
        async function payUnpay(uidEnc, idEnc) {
            const uid = decAttr(uidEnc), id = decAttr(idEnc);
            const month = document.getElementById('pay-month').value;
            const p = ((paySaved[uid] || {}).payments || {})[id];
            if (!p) return;
            if (!confirm(`${payMD(p.at)} 지급 ${payWon(p.amount)} 표시를 지울까요?`)) return;
            try {
                const res = await fetch(`${FIREBASE_DB_URL}rider_pay/${month}/${encodeURIComponent(uid)}/payments/${encodeURIComponent(id)}.json`, { method: 'DELETE' });
                if (!res.ok) throw new Error('서버 응답 ' + res.status);
                delete paySaved[uid].payments[id];
                showToast('지급 표시 지움');
                payRender();
            } catch (e) { console.warn(e); showToast('⚠️ 지우지 못했습니다.'); }
        }

        // 배달기사가 보는 화면 — 본인 단가 · 건수 · 금액 · 지급 기록 · 날짜별 내역. 고치기 없음.
        function payRenderMine() {
            const me = window.gStaffMe || {};
            const month = document.getElementById('pay-month').value;
            const body = document.getElementById('pay-body');
            const mine = payByRider().find(r => r.uid === me.uid)
                || { uid: me.uid, name: me.name || me.email || '', count: 0, days: {} };
            const c = payCalc(mine);
            const pill = c.left > 0
                ? `<span class="pay-pill wait">미지급 ${c.left}건</span>`
                : (c.pay.list.length ? `<span class="pay-pill">지급 완료</span>` : '');   // 날짜는 아래 지급 기록 표의 '지급일' 칸에
            body.innerHTML = `
                <div class="pay-me">
                    <div class="pay-me-top">
                        <div class="r1"><b>${gEsc(mine.name || '나')}</b>${pill}</div>
                        <div class="r2">
                            <span>${c.rate ? `단가 ${c.rate.toLocaleString()}원` : '단가 미정'} · ${mine.count}건</span>
                            <b>${c.rate || c.pay.list.length ? payWon(c.total) : '-'}</b>
                        </div>
                    </div>
                    ${paySurBar(false)}
                    <div class="pay-days">${payHistory(mine, false)}${mine.count ? payRiderDetail(mine) : `<div class="pay-empty" style="padding:16px 0;">${payMonthLabel(month)} 배달 기록이 없습니다.</div>`}</div>
                </div>`;
        }

        /* 날짜별 건수 — 달력 한 장으로 보여 준다 (한 줄씩 늘어놓으니 26줄이 넘어 너무 길었다).
           칸마다 날짜(작게)와 그날 건수(크게). 배달 없는 날은 비워 둔다. 집 하나하나는 '📋 배달 기록'에서 본다. */
        function payRiderDetail(r) {
            const month = document.getElementById('pay-month').value;
            const [y, m] = month.split('-').map(n => parseInt(n));
            if (!Object.keys(r.days).length) return `<div class="pay-empty" style="padding:14px 0;">이 달 배달 기록이 없습니다.</div>`;
            const first = new Date(y, m - 1, 1).getDay();
            const last = new Date(y, m, 0).getDate();
            const cells = [];
            for (let i = 0; i < first; i++) cells.push('<span class="pay-cal-x"></span>');
            for (let d = 1; d <= last; d++) {
                const dd = String(d).padStart(2, '0');
                const n = (r.days[dd] || []).length;
                const wd = (first + d - 1) % 7;
                const sur = paySurOf(dd);
                cells.push(`<span class="pay-cal-d ${n ? 'on' : 'off'}${wd === 0 ? ' sun' : ''}${sur ? ' sur' : ''}"${sur ? ` title="할증 건당 ${sur.toLocaleString()}원"` : ''}><i>${d}</i><b>${n || '–'}</b></span>`);
            }
            return `<div class="pay-sec">날짜별 건수</div><div class="pay-cal">
                ${['일', '월', '화', '수', '목', '금', '토'].map((w, i) => `<span class="pay-cal-w${i === 0 ? ' sun' : ''}">${w}</span>`).join('')}
                ${cells.join('')}
            </div>`;
        }
        /* [신규] 할증 줄 — 정산 요약 바로 아래. 그날 배달한 모든 기사에게 건당 이만큼 더 붙는다.
           가게: 날짜 칩을 누르면 고치기, '＋'로 새로 적기. 기사: 보기만. */
        function paySurBar(canEdit) {
            const month = document.getElementById('pay-month').value;
            const [y, m] = month.split('-').map(n => parseInt(n));
            const days = Object.keys(paySurcharge).filter(dd => paySurOf(dd) > 0).sort();
            if (!canEdit && !days.length) return '';
            const W = ['일', '월', '화', '수', '목', '금', '토'];
            const label = dd => `${m}/${parseInt(dd)}(${W[new Date(y, m - 1, parseInt(dd)).getDay()]})`;
            const chips = days.map(dd => canEdit
                ? `<button type="button" class="pay-sur-chip${paySurPick === dd ? ' on' : ''}" onclick="paySurEdit('${dd}')">${label(dd)} <b>+${paySurOf(dd).toLocaleString()}</b></button>`
                : `<span class="pay-sur-chip">${label(dd)} <b>+${paySurOf(dd).toLocaleString()}</b></span>`).join('');
            let editor = '';
            if (canEdit && paySurPick) {
                const last = new Date(y, m, 0).getDate();
                const dd = paySurPick === '+' ? '' : paySurPick;
                editor = `
                    <div class="pay-sur-edit">
                        <input type="date" id="pay-sur-date" min="${month}-01" max="${month}-${String(last).padStart(2, '0')}" value="${dd ? `${month}-${dd}` : ''}" aria-label="날짜">
                        <label class="pay-rate"><input type="text" inputmode="numeric" id="pay-sur-amt" placeholder="건당" aria-label="건당 할증" value="${dd ? paySurOf(dd).toLocaleString() : ''}" oninput="const n=payDigits(this.value);this.value=n?n.toLocaleString():''"></label>
                        <button type="button" class="go" onclick="paySurSave()">저장</button>
                        ${dd ? `<button type="button" onclick="paySurSave(true)">삭제</button>` : ''}
                        <button type="button" onclick="paySurEdit('')">닫기</button>
                    </div>`;
            }
            return `
                <div class="pay-sur">
                    <div class="pay-sur-line">
                        <span class="pay-sur-t">할증</span>
                        ${chips || (canEdit ? '<span class="pay-sur-none">없음</span>' : '')}
                        ${canEdit && !paySurPick ? `<button type="button" class="pay-sur-add" onclick="paySurEdit('+')" title="할증 넣기" aria-label="할증 넣기">＋</button>` : ''}
                    </div>
                    ${editor}
                </div>`;
        }
        function paySurEdit(dd) {
            paySurPick = (dd && paySurPick === dd) ? '' : dd;
            payRender();
            if (paySurPick) setTimeout(() => { const el = document.getElementById(paySurPick === '+' ? 'pay-sur-date' : 'pay-sur-amt'); if (el) el.focus(); }, 0);
        }
        // 할증 저장 — 삭제면 그 날짜 칸을 지운다. 이미 지급한 몫은 그때 금액 그대로.
        async function paySurSave(remove) {
            if (!payIsStore()) return;
            const month = document.getElementById('pay-month').value;
            const dateVal = (document.getElementById('pay-sur-date') || {}).value || '';
            if (!dateVal.startsWith(month + '-')) { showToast('날짜를 골라 주세요.'); return; }
            const dd = dateVal.slice(8, 10);
            const amt = remove ? 0 : payDigits((document.getElementById('pay-sur-amt') || {}).value || '');
            if (!remove && !amt) { showToast('금액을 적어 주세요.'); return; }
            // 고치던 날짜를 다른 날로 바꿨으면 옛 날짜 칸은 지운다
            const old = paySurPick !== '+' && paySurPick !== dd ? paySurPick : '';
            try {
                const url = `${FIREBASE_DB_URL}rider_surcharge/${month}/${dd}.json`;
                const res = amt
                    ? await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(amt) })
                    : await fetch(url, { method: 'DELETE' });
                if (!res.ok) throw new Error('서버 응답 ' + res.status);
                if (old) {
                    const r2 = await fetch(`${FIREBASE_DB_URL}rider_surcharge/${month}/${old}.json`, { method: 'DELETE' });
                    if (r2.ok) delete paySurcharge[old];
                }
                if (amt) paySurcharge[dd] = amt; else delete paySurcharge[dd];
                paySurPick = '';
                showToast(amt ? `${parseInt(month.slice(5))}/${parseInt(dd)} 할증 ${amt.toLocaleString()}원` : '할증 삭제');
                payRender();
            } catch (e) { console.warn(e); showToast('⚠️ 할증을 저장하지 못했습니다.'); }
        }
        function payToggleRider(uidEnc) {
            const uid = decAttr(uidEnc);
            payOpenRider = (payOpenRider === uid) ? '' : uid;
            payRender();
        }
        /* ── [신규] 배달 기록 — 날짜를 고르면 그날 누가 어느 집에 몇 시에 갔는지 (가게 계정만) ──
           정산에서는 날짜별 건수만 보이고, 집 하나하나는 여기서 본다. 그날 한 칸(deliveries/달/날짜)만 받는다. */
        let dlogData = {};
        let dlogRider = '';
        function dlogYmd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
        function openDlog() {
            if (!payIsStore()) { showToast('가게 계정만 볼 수 있습니다.'); return; }
            closeSettings();
            const inp = document.getElementById('dlog-date');
            if (!inp.value) inp.value = dlogYmd(new Date());
            document.getElementById('dlog-modal').style.display = 'flex';
            dlogLoad();
        }
        function closeDlog() { document.getElementById('dlog-modal').style.display = 'none'; }
        function dlogShift(n) {
            const inp = document.getElementById('dlog-date');
            const [y, m, d] = (inp.value || dlogYmd(new Date())).split('-').map(Number);
            inp.value = dlogYmd(new Date(y, m - 1, d + n));
            dlogLoad();
        }
        async function dlogLoad() {
            const v = document.getElementById('dlog-date').value;
            const body = document.getElementById('dlog-body');
            const mm = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            if (!mm) return;
            body.innerHTML = `<div class="pay-empty">불러오는 중...</div>`;
            try {
                const r = await fetch(`${FIREBASE_DB_URL}${DELIV_NODE}/${mm[1]}-${mm[2]}/${mm[3]}.json`);
                if (!r.ok) throw new Error('서버 응답 ' + r.status);
                dlogData = (await r.json()) || {};
                dlogRider = '';
                dlogRender();
            } catch (e) {
                console.warn('배달 기록 불러오기 실패:', e);
                body.innerHTML = `<div class="pay-empty" style="color:var(--red); line-height:1.6;">불러오지 못했습니다.<br><span style="color:#94a3b8; font-weight:700;">Firebase 규칙을 게시하기 전이면 막혀 있습니다.</span></div>`;
            }
        }
        function dlogPick(nameEnc) { dlogRider = decAttr(nameEnc); dlogRender(); }

        /* [신규] 건수만 추가 — 앱으로 완료를 못 누른 배달을 나중에 정산에 넣는다 (목록 카드는 안 생긴다).
           고른 날짜의 배달 기록에 'manual' 표시를 단 칸을 건수만큼 만든다. 그 칸만 여기서 지울 수 있다. */
        let dlogAddOpen = false;
        let dlogStaff = null;            // [{ uid, name, role }]
        async function dlogLoadStaff() {
            if (dlogStaff) return dlogStaff;
            try {
                const r = await fetch(`${FIREBASE_DB_URL}staff.json`);
                const s = r.ok ? (await r.json()) || {} : {};
                dlogStaff = Object.keys(s).map(uid => ({ uid, name: (s[uid] && (s[uid].name || s[uid].email)) || '이름 없음', role: (s[uid] && s[uid].role) || '' }))
                    .sort((a, b) => (a.role === 'rider' ? 0 : 1) - (b.role === 'rider' ? 0 : 1) || a.name.localeCompare(b.name, 'ko'));
            } catch (e) { dlogStaff = []; }
            return dlogStaff;
        }
        async function dlogToggleAdd(on) {
            dlogAddOpen = on;
            if (on) await dlogLoadStaff();
            dlogRender();
        }
        async function dlogAddSave() {
            if (!payIsStore()) return;
            const ymd = document.getElementById('dlog-date').value;
            const mm = String(ymd || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            const uid = (document.getElementById('dlog-add-who') || {}).value || '';
            const n = Math.min(50, payDigits((document.getElementById('dlog-add-n') || {}).value));
            const place = ((document.getElementById('dlog-add-place') || {}).value || '').trim();
            const who = (dlogStaff || []).find(s => s.uid === uid);
            if (!mm) { showToast('날짜를 골라 주세요.'); return; }
            if (!who) { showToast('기사를 골라 주세요.'); return; }
            if (!n) { showToast('건수를 적어 주세요.'); return; }
            const me = window.gStaffMe || {};
            // 시각: 오늘이면 지금, 지난 날이면 그날 낮 12시로 둔다
            const today = dlogYmd(new Date()) === ymd;
            const at = today ? Date.now() : new Date(+mm[1], +mm[2] - 1, +mm[3], 12, 0).getTime();
            const base = Date.now();
            const patch = {};
            for (let i = 0; i < n; i++) {
                patch[`m${base}${String(i).padStart(2, '0')}`] = {
                    rider: who.uid, riderName: who.name, at: at + i,
                    name: '', apt: '', detail: place || '수기', items: 0,
                    manual: true, by: me.name || me.email || ''
                };
            }
            showLoader('추가하는 중...');
            try {
                const r = await fetch(`${FIREBASE_DB_URL}${DELIV_NODE}/${mm[1]}-${mm[2]}/${mm[3]}.json`, {
                    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch)
                });
                if (!r.ok) throw new Error('서버 응답 ' + r.status);
                Object.assign(dlogData, patch);
                delete deliveryRecordCache[`${mm[1]}-${mm[2]}/${mm[3]}`];
                dlogAddOpen = false;
                showToast(`${who.name} ${n}건 추가`);
                dlogRender();
            } catch (e) { console.warn(e); showToast('⚠️ 추가하지 못했습니다.'); }
            finally { hideLoader(); }
        }
        async function dlogDel(houseEnc) {
            if (!payIsStore()) return;
            const house = decAttr(houseEnc);
            const rec = dlogData[house];
            if (!rec || !rec.manual) return;
            if (!confirm(`${rec.riderName || ''} 수기 1건을 지울까요?`)) return;
            const ymd = document.getElementById('dlog-date').value;
            const [y, m, d] = ymd.split('-');
            try {
                const r = await fetch(`${FIREBASE_DB_URL}${DELIV_NODE}/${y}-${m}/${d}/${encodeURIComponent(house)}.json`, { method: 'DELETE' });
                if (!r.ok) throw new Error('서버 응답 ' + r.status);
                delete dlogData[house];
                delete deliveryRecordCache[`${y}-${m}/${d}`];
                showToast('지웠습니다.');
                dlogRender();
            } catch (e) { console.warn(e); showToast('⚠️ 지우지 못했습니다.'); }
        }
        function dlogAddHtml() {
            if (!payIsStore()) return '';
            if (!dlogAddOpen) return `<button type="button" class="dlog-add" onclick="dlogToggleAdd(true)">＋ 건수 추가</button>`;
            const opts = (dlogStaff || []).map(s => `<option value="${gEsc(s.uid)}">${gEsc(s.name)}${s.role === 'store' ? ' (가게)' : ''}</option>`).join('');
            return `<div class="dlog-addbox">
                <div class="dlog-addrow">
                    <select id="dlog-add-who" aria-label="기사"><option value="">기사</option>${opts}</select>
                    <input id="dlog-add-n" type="text" inputmode="numeric" value="1" aria-label="건수"><span class="u">건</span>
                </div>
                <input id="dlog-add-place" type="text" placeholder="어디 (안 적어도 됨)">
                <div class="dlog-addrow">
                    <button type="button" class="go" onclick="dlogAddSave()">추가</button>
                    <button type="button" onclick="dlogToggleAdd(false)">닫기</button>
                </div>
            </div>`;
        }

        function dlogRender() {
            const body = document.getElementById('dlog-body');
            const recs = Object.entries(dlogData).map(([h, r]) => Object.assign({ house: h }, r || {}))
                .sort((a, b) => (a.at || 0) - (b.at || 0));
            if (!recs.length) { body.innerHTML = `<div class="pay-empty">이날 배달 기록이 없습니다.</div>${dlogAddHtml()}`; return; }
            const counts = {};
            recs.forEach(r => { const k = r.riderName || '이름 없음'; counts[k] = (counts[k] || 0) + 1; });
            const chip = (label, val, n) => `<button type="button" class="dlog-chip${dlogRider === val ? ' on' : ''}" onclick="dlogPick('${encAttr(val)}')">${gEsc(label)} ${n}</button>`;
            const chips = chip('전체', '', recs.length) + Object.entries(counts).sort((a, b) => b[1] - a[1]).map(([k, n]) => chip(k, k, n)).join('');
            const shown = dlogRider ? recs.filter(r => (r.riderName || '이름 없음') === dlogRider) : recs;
            const hm = ts => { const t = new Date(parseInt(ts) || 0); return ts ? `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}` : ''; };
            const rows = shown.map(r => {
                const place = [r.apt && r.apt !== '기타' ? `[${r.apt}]` : '', r.detail || ''].join(' ').trim() || '-';
                return `<div class="dlog-row">
                    <span class="t">${hm(r.at)}</span>
                    <span class="h"><b>${gEsc(place)}${r.manual ? ' <span class="man-tag">✍️ 수기</span>' : ''}</b><span>${gEsc(r.name || '')}${r.items ? ` · ${r.items}개` : ''}${r.manual && r.by ? `${r.name ? ' · ' : ''}${gEsc(r.by)} 추가` : ''}</span></span>
                    <span class="r">${gEsc(r.riderName || '')}${r.photo ? `<small>📸 사진${r.photoBy && r.photoBy !== r.riderName ? ` · ${gEsc(r.photoBy)}` : ''}</small>` : ''}${r.manual ? `<button type="button" class="man-del" style="margin-top:3px;" onclick="dlogDel('${encAttr(r.house)}')">삭제</button>` : ''}</span>
                </div>`;
            }).join('');
            body.innerHTML = `<div class="dlog-chips">${chips}</div><div class="dlog-list">${rows}</div>${dlogAddHtml()}`;
        }

        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
        function settingsOpenPwd() { closeSettings(); openPasswordFinder(true); }

        // ── 아파트 순서 고치기
        let aptOrderEdit = [];
        function openAptOrder() {
            if (!gIsStore()) { showToast('아파트 순서는 가게에서만 고칠 수 있습니다.'); return; }   // [신규]
            const list = [];
            const add = n => { n = String(n || '').trim(); if (n && n !== '기타' && !list.includes(n)) list.push(n); };
            APT_ORDER.forEach(add);
            Object.keys(window.__aptGroupsNow || {}).forEach(add);   // 오늘 배달이 있는 아파트
            /* [수정] 오늘 것만 보여 주니 오늘 안 가는 아파트는 순서를 정해 둘 수 없었다.
               받아 둔 주문 전체에서 배달 간 적 있는 아파트를 모두 넣는다. 비번을 적어 둔 곳도 함께. */
            (rawOrders || []).forEach(o => add(extractApartmentName(o && o.address)));
            Object.keys(entrancePasswords || {}).forEach(add);
            aptOrderEdit = list;
            closeSettings();
            document.getElementById('apt-order-modal').style.display = 'flex';
            renderAptOrder();
        }
        function closeAptOrder() { document.getElementById('apt-order-modal').style.display = 'none'; }

        function renderAptOrder() {
            const box = document.getElementById('apt-order-body');
            if (!box) return;
            if (!aptOrderEdit.length) {
                box.innerHTML = `<div style="padding:26px 0; text-align:center; color:#94a3b8; font-size:13px; font-weight:700;">순서를 정할 아파트가 없습니다.</div>`;
                return;
            }
            box.innerHTML = aptOrderEdit.map((name, i) => {
                const held = aptDrag && aptDrag.i === i;
                return `
                <div data-apt-row="${i}" style="display:flex; align-items:center; gap:10px; padding:11px 10px; margin-top:${i ? 6 : 0}px; border:1.5px solid ${held ? '#93c5fd' : '#e2e8f0'}; border-radius:11px; background:${held ? '#eff6ff' : '#fff'}; ${held ? 'box-shadow:0 6px 14px rgba(37,99,235,.18);' : ''}">
                    <span style="flex:0 0 22px; font-size:12.5px; font-weight:900; color:#94a3b8;">${i + 1}</span>
                    <span style="flex:1; min-width:0; font-size:14px; font-weight:800; color:#0f172a; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${gEsc(name)}</span>
                    <span data-apt-grip="${i}" title="끌어서 옮기기"
                        style="flex:0 0 auto; width:42px; height:36px; display:flex; align-items:center; justify-content:center; border:1.5px solid #e2e8f0; border-radius:9px; background:#f8fafc; color:#64748b; font-size:16px; font-weight:900; cursor:grab; touch-action:none; user-select:none;">≡</span>
                </div>`;
            }).join('');
        }

        /* [수정] ↑↓ 단추 대신 ≡ 를 끌어서 옮긴다. 손가락으로도 되게 포인터 이벤트를 쓴다.
           목록은 손잡이(≡)에서만 잡히므로, 줄을 쓸어 올려 목록을 굴리는 것도 그대로 된다. */
        let aptDrag = null;
        function aptDragMove(e) {
            if (!aptDrag) return;
            e.preventDefault();
            const step = Math.round((e.clientY - aptDrag.startY) / aptDrag.rowH);
            const to = Math.min(Math.max(aptDrag.i + step, 0), aptOrderEdit.length - 1);
            if (to !== aptDrag.i) {
                const moved = aptOrderEdit.splice(aptDrag.i, 1)[0];
                aptOrderEdit.splice(to, 0, moved);
                aptDrag.startY += (to - aptDrag.i) * aptDrag.rowH;   // 옮긴 만큼 기준도 옮긴다
                aptDrag.i = to;
                renderAptOrder();
            }
        }
        function aptDragEnd() {
            aptDrag = null;
            document.removeEventListener('pointermove', aptDragMove);
            document.removeEventListener('pointerup', aptDragEnd);
            document.removeEventListener('pointercancel', aptDragEnd);
            renderAptOrder();
        }
        document.addEventListener('pointerdown', e => {
            const grip = e.target && e.target.closest ? e.target.closest('[data-apt-grip]') : null;
            if (!grip) return;
            e.preventDefault();
            // 줄 하나 높이 — 줄 사이 간격으로 잰다. 못 재면 넉넉한 값을 쓴다 (0으로 나누지 않게)
            const rows = [...document.querySelectorAll('[data-apt-row]')];
            const a = rows[0] && rows[0].getBoundingClientRect();
            const b = rows[1] && rows[1].getBoundingClientRect();
            const rowH = (a && b && b.top - a.top > 1) ? (b.top - a.top) : ((a && a.height > 1) ? a.height + 6 : 60);
            aptDrag = { i: +grip.dataset.aptGrip, startY: e.clientY, rowH };
            document.addEventListener('pointermove', aptDragMove);
            document.addEventListener('pointerup', aptDragEnd);
            document.addEventListener('pointercancel', aptDragEnd);
            renderAptOrder();
        });

        async function saveAptOrder() {
            // [신규] 배달기사는 고칠 수 있는 게 없다 — 아파트 순서도 가게 계정만
            if (!gIsStore()) { showToast('아파트 순서는 가게에서만 고칠 수 있습니다.'); return; }
            const btn = document.getElementById('apt-order-save');
            if (btn) { btn.disabled = true; btn.innerText = '저장 중...'; }
            APT_ORDER = aptOrderEdit.slice();
            try { localStorage.setItem(APT_ORDER_KEY, JSON.stringify(APT_ORDER)); } catch (e) { }
            let ok = true;
            try {
                const res = await fetch(`${FIREBASE_DB_URL}apartment_order.json`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(APT_ORDER)
                });
                ok = res.ok;
            } catch (e) { ok = false; }
            if (btn) { btn.disabled = false; btn.innerText = '저장'; }
            showToast(ok ? '아파트 순서를 저장했습니다.' : '서버 저장에 실패했습니다. 이 기기에서만 바뀝니다.');
            closeAptOrder();
            renderFilteredData();   // 바뀐 순서로 단추를 다시 그린다
        }

        /* ===== [신규] 공동현관 비번 조회 =====
           지금까지 배달 간 아파트를 모아 보여 주고, 아파트 → 동 → 비번 순으로 파고든다.
           예전에는 아파트와 동을 둘 다 고른 뒤에야 비번 칸이 떴다. 그래서 오늘 안 가는
           아파트의 비번은 확인할 방법이 없었다.
           목록은 받아 둔 주문에서 만든다 (따로 받는 자료가 없어 부담이 없다). */
        let _pwdView = { apt: '', dong: '' };

        let _pwdFromSettings = false;   // [신규] 설정에서 들어왔으면 첫 화면에도 '‹' 를 두어 설정으로 돌아간다
        function openPasswordFinder(fromSettings) {
            _pwdFromSettings = !!fromSettings;
            _pwdView = { apt: "", dong: "" }; _pwdEdit = false;
            const box = document.getElementById('pwd-finder-modal');
            if (box) box.style.display = 'flex';
            const s = document.getElementById('pwd-finder-search');
            if (s) s.value = '';
            renderPasswordFinder();
        }

        function closePasswordFinder() {
            const box = document.getElementById('pwd-finder-modal');
            if (box) box.style.display = 'none';
        }

        function pwdFinderBack() {
            if (_pwdView.dong) _pwdView.dong = '';
            else if (_pwdView.apt) _pwdView.apt = '';
            else if (_pwdFromSettings) { closePasswordFinder(); openSettings(); return; }
            renderPasswordFinder();
        }

        function pwdPickApt(apt) { _pwdView = { apt, dong: "" }; _pwdEdit = false; renderPasswordFinder(); }
        function pwdPickDong(dong) { _pwdView.dong = dong; _pwdEdit = false; renderPasswordFinder(); }

        /* 배달 간 아파트 → 동 → 집 수. 받아 둔 주문 전체에서 만든다.
           비번만 등록해 두고 배달 기록이 없는 아파트도 빠지지 않게 함께 넣는다. */
        function gPwdTree() {
            const tree = {};
            (rawOrders || []).forEach(it => {
                if (!it) return;
                const apt = extractApartmentName(it.address || '');
                if (!apt) return;
                const dong = getDongGroupName(it) || '(동 없음)';
                if (!tree[apt]) tree[apt] = {};
                if (!tree[apt][dong]) tree[apt][dong] = new Set();
                tree[apt][dong].add(normalizePhoneNumber(it.phone) || Math.random());
            });
            Object.keys(entrancePasswords || {}).forEach(apt => {
                if (!tree[apt]) tree[apt] = {};
                Object.keys(entrancePasswords[apt] || {}).forEach(k => {
                    /* [버그수정 2026-09-02] 1-2·3-4만 떼어 내고 있었다.
                       1~3호처럼 다른 범위로 만든 칸은 이름이 안 떨어져서,
                       '09동' 옆에 '09동_1-3라인'이 딴 동인 것처럼 하나 더 생겼다.
                       호수 범위는 사장님이 정하므로 숫자를 가리지 말고 떼어 낸다. */
                    const dong = String(k).replace(/_\d+-\d+라인$/, '');
                    if (!tree[apt][dong]) tree[apt][dong] = new Set();
                });
            });
            return tree;
        }

        // 그 동에 적어 둔 비번들 (라인별로 나눠 저장한 것까지 함께 본다)
        function gPwdOf(apt, dong) {
            const m = (entrancePasswords || {})[apt] || {};
            return {
                하나: String(m[dong] || '').trim(),
                line12: String(m[`${dong}_1-2라인`] || '').trim(),
                line34: String(m[`${dong}_3-4라인`] || '').trim()
            };
        }

        /* ===== [신규] 호수 칸(라인) 다루기 =====
           비번은 '동 + 호수 범위'마다 하나씩 있다. 저장 키는 `03동_1-2라인` 꼴이다.
           예전에는 1·2라인과 3·4라인 두 칸만 코드에 박혀 있었는데, 아파트마다 라인 수가
           달라서 (1~3호, 1~4호처럼) 맞지 않는 곳이 있었다. 이제 범위를 사장님이 정한다.

           · `03동`        → 범위 없는 옛 값. '전체' 칸으로 본다.
           · `03동_1-2라인` → 1호~2호 칸
           키 형식은 그대로 두어 예전 자료도 그대로 읽힌다. */
        function gSlotKey(dong, from, to) {
            if (from == null || to == null || from === '' || to === '') return dong;
            return `${dong}_${from}-${to}라인`;
        }

        // 그 동에 있는 칸들을 범위 순으로 (전체 칸은 맨 뒤)
        function gSlotsOf(apt, dong) {
            const map = (entrancePasswords || {})[apt] || {};
            const out = [];
            Object.keys(map).forEach(k => {
                if (k === dong) { out.push({ key: k, from: null, to: null, pwd: String(map[k] || '') }); return; }
                const m = String(k).match(/^(.+)_(\d+)-(\d+)라인$/);
                if (m && m[1] === dong) out.push({ key: k, from: parseInt(m[2]), to: parseInt(m[3]), pwd: String(map[k] || '') });
            });
            out.sort((a, b) => {
                if (a.from === null) return 1;
                if (b.from === null) return -1;
                return a.from - b.from || a.to - b.to;
            });
            return out;
        }

        function gSlotLabel(s) {
            if (s.from == null) return '전체';
            return (s.from === s.to) ? `${s.from}호` : `${s.from} ~ ${s.to}호`;   // [수정] 물결 앞뒤를 띄워 답답해 보이지 않게
        }

        /* 칸 하나를 저장한다. 범위가 바뀌었으면 옛 키를 지우고 새 키로 옮긴다.
           (키 이름이 곧 범위라, 범위를 고치는 것은 키를 바꾸는 일이다) */
        async function savePwdSlot(oldKey, dong, from, to, pwd) {
            if (!gIsStore()) return false;   // [신규] 가게 계정만
            const apt = _pwdView.apt;
            if (!apt || !dong) return false;
            const newKey = gSlotKey(dong, from, to);
            // [수정] 서버에는 도로명주소를 열쇠로 적는다 (화면 이름은 사람이 읽으라고 쓰는 것)
            const base = `${FIREBASE_DB_URL}entrance_passwords/${encodeURIComponent(gAptRoadKey(apt))}`;
            const res = await fetch(`${base}/${encodeURIComponent(newKey)}.json`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(String(pwd || ''))
            });
            if (!res.ok) throw new Error('저장 실패 ' + res.status);
            if (!entrancePasswords[apt]) entrancePasswords[apt] = {};
            entrancePasswords[apt][newKey] = String(pwd || '');

            if (oldKey && oldKey !== newKey) {
                await fetch(`${base}/${encodeURIComponent(oldKey)}.json`, { method: 'DELETE' });
                delete entrancePasswords[apt][oldKey];
            }
            try { localStorage.setItem('moket_entrance_passwords_cache', JSON.stringify(entrancePasswords)); } catch (e) {}
            return true;
        }

        async function deletePwdSlot(key) {
            if (!gIsStore()) return;   // [신규] 가게 계정만
            const apt = _pwdView.apt;
            if (!apt || !key) return;
            await fetch(`${FIREBASE_DB_URL}entrance_passwords/${encodeURIComponent(gAptRoadKey(apt))}/${encodeURIComponent(key)}.json`, { method: 'DELETE' });
            if (entrancePasswords[apt]) delete entrancePasswords[apt][key];
            try { localStorage.setItem('moket_entrance_passwords_cache', JSON.stringify(entrancePasswords)); } catch (e) {}
        }

        // 지우기는 한 번 더 눌러 확인받는다 (confirm 창은 기기에 따라 막힌다)
        let _pwdDelArmed = '';
        function askDeletePwdSlot(key) {
            if (_pwdDelArmed !== key) {
                _pwdDelArmed = key;
                renderPasswordFinder();
                setTimeout(() => { if (_pwdDelArmed === key) { _pwdDelArmed = ''; renderPasswordFinder(); } }, 5000);
                return;
            }
            _pwdDelArmed = '';
            (async () => {
                showLoader('지우는 중...');
                try { await deletePwdSlot(key); showToast('칸을 지웠습니다.'); }
                catch (e) { showToast('삭제 실패: ' + e.message); }
                // [수정] 뒤에 깔린 배달 목록의 비번 카드도 함께 다시 그린다 (아래 commitPwdSlot과 같은 이유)
                finally { hideLoader(); renderPasswordFinder(); renderFilteredData(); }
            })();
        }

        // 화면에 적은 값을 그대로 저장 (범위·비번 함께)
        function commitPwdSlot(idx) {
            const row = document.querySelector(`[data-slot="${idx}"]`);
            if (!row) return;
            const oldKey = row.getAttribute('data-key') || '';
            const f = row.querySelector('[data-f]')?.value.trim();
            const t = row.querySelector('[data-t]')?.value.trim();
            const p = row.querySelector('[data-p]')?.value ?? '';
            const isAll = row.getAttribute('data-all') === '1';

            if (!isAll) {
                const fn = parseInt(f), tn = parseInt(t);
                if (isNaN(fn) || isNaN(tn)) { showToast('호수 범위를 숫자로 적어 주세요.'); return; }
                if (fn > tn) { showToast('앞 숫자가 뒤 숫자보다 큽니다.'); return; }
                /* [버그수정] 이미 있는 호수 칸으로 바꾸면 그 칸의 비번을 덮어써서
                   적어 둔 비번이 사라졌다. 다른 칸이 쓰고 있으면 손대지 않는다. */
                const newKey = gSlotKey(_pwdView.dong, fn, tn);
                if (newKey !== oldKey && ((entrancePasswords[_pwdView.apt] || {})[newKey]) !== undefined) {
                    showToast(`${fn}~${tn}호 칸은 이미 있습니다. 다른 호수를 골라 주세요.`); return;
                }
            }
            (async () => {
                showLoader('저장 중...');
                try {
                    await savePwdSlot(oldKey, _pwdView.dong, isAll ? null : parseInt(f), isAll ? null : parseInt(t), p);
                    showToast('저장했습니다.');
                    _pwdNewSlot = null;   // 새로 만들던 칸이었으면 접는다
                } catch (e) { showToast('저장 실패: ' + e.message); }
                /* [수정] 예전에는 '🚪 비번' 창만 다시 그렸다. 그래서 창을 닫으면
                   뒤에 깔린 배달 목록의 비번 카드에 옛 값이 그대로 남아,
                   '🔄 갱신'으로 자료를 다시 받아야 바뀐 비번이 보였다.
                   고친 값은 이미 메모리와 저장소에 들어가 있으므로 목록만 다시 그리면 된다. */
                finally { hideLoader(); renderPasswordFinder(); renderFilteredData(); }
            })();
        }

        // 새로 만들던 칸을 접는다
        function cancelNewPwdSlot() { _pwdNewSlot = null; renderPasswordFinder(); }

        /* 빈 칸을 하나 더한다.
           [수정] 예전에는 '가장 큰 호수 다음'으로 잡아서, 3~4호만 있는 동에 1~2호를
           넣으려 해도 5~6호가 나왔다. 라인은 1~2 · 3~4처럼 두 집씩 묶이므로,
           그 자리들 중 비어 있는 첫 자리를 고른다. (주문관리 전단지 화면과 같은 방식) */
        function addPwdSlot() {
            const slots = gSlotsOf(_pwdView.apt, _pwdView.dong).filter(s => s.from != null);
            const 빈자리 = gFreeHoRange(slots);
            if (!빈자리) { showToast('넣을 자리가 다 찼습니다.'); return; }
            _pwdNewSlot = { from: 빈자리[0], to: 빈자리[1] };
            renderPasswordFinder();
        }

        /* 이미 쓰고 있는 호수를 뺀 뒤, 남은 첫 자리부터 두 집을 잡는다.
           1~2호가 있으면 3~4호, 1~3호가 있으면 4~5호가 나온다.
           바로 뒤 호수까지 비어 있어야 두 집으로 잡고, 아니면 한 집만 잡는다. */
        function gFreeHoRange(slots) {
            const 쓰는중 = new Set();
            (slots || []).forEach(s => {
                if (s.from == null) return;
                for (let i = s.from; i <= s.to; i++) 쓰는중.add(i);
            });
            for (let a = 1; a <= 99; a++) {
                if (쓰는중.has(a)) continue;
                const b = (a < 99 && !쓰는중.has(a + 1)) ? a + 1 : a;
                return [a, b];
            }
            return null;
        }
        let _pwdNewSlot = null;

        // 보기 ↔ 고치기 전환. 창을 새로 열 때는 늘 보기부터 시작한다.
        let _pwdEdit = false;
        // [수정] 비번 고치기는 가게 계정만 (배달기사는 보기만). 서버 규칙도 가게만 쓰게 막혀 있다.
        function togglePwdEdit(on) {
            if (on && !gIsStore()) { showToast('비번은 가게에서만 고칠 수 있습니다.'); return; }
            _pwdEdit = !!on; _pwdNewSlot = null; _pwdDelArmed = ""; renderPasswordFinder();
        }

        function renderPasswordFinder() {
            const body = document.getElementById('pwd-finder-body');
            const title = document.getElementById('pwd-finder-title');
            const back = document.getElementById('pwd-finder-back');
            if (!body) return;

            const q = String(document.getElementById('pwd-finder-search')?.value || '').trim().toLowerCase();
            const tree = gPwdTree();
            const has = (apt, dong) => gSlotsOf(apt, dong).some(s => String(s.pwd || '').trim());

            if (back) back.style.display = (_pwdView.apt || _pwdView.dong || _pwdFromSettings) ? '' : 'none';

            /* 줄 하나짜리 목록. 상자를 겹겹이 두르면 좁은 화면에서 조잡해 보여서,
               얇은 가로선으로만 나누고 오른쪽 끝에 딸림 정보를 흐리게 둔다. */
            const listRow = (onclick, left, right, dim) =>
                `<div onclick="${onclick}" style="display:flex; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid #f1f5f9; cursor:pointer;">`
                + `<span style="flex:1; min-width:0; font-size:15px; font-weight:800; color:${dim ? '#94a3b8' : '#0f172a'}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${left}</span>`
                + (right ? `<span style="flex:0 0 auto; font-size:11.5px; font-weight:700; color:#94a3b8;">${right}</span>` : '')
                + `<span style="flex:0 0 auto; color:#cbd5e1; font-size:13px;">›</span></div>`;

            // ── 3단계: 비번 보기 / 고치기
            if (_pwdView.apt && _pwdView.dong) {
                if (title) title.innerText = `${_pwdView.apt} ${_pwdView.dong}`;
                const slots = gSlotsOf(_pwdView.apt, _pwdView.dong);

                if (!_pwdEdit) {
                    const live = slots.filter(s => String(s.pwd || '').trim());
                    const com = gCommonPwdOf(_pwdView.apt);
                    body.innerHTML =
                        (com ? `<div style="display:flex; align-items:center; gap:10px; margin-bottom:12px; padding:12px 14px; border:1.5px solid #c7d2fe; background:#eef2ff; border-radius:12px;">`
                             + `<span style="flex:0 0 auto; font-size:12px; font-weight:900; color:#4338ca;">🔑 공용</span>`
                             + `<span style="flex:1; min-width:0; font-size:19px; font-weight:900; color:#312e81; letter-spacing:1px; word-break:break-all;">${gEsc(com)}</span></div>` : '')
                        + (live.length === 0
                            ? (com ? '' : `<div style="padding:34px 0; text-align:center; color:#94a3b8; font-size:13px; font-weight:700;">적어 둔 비번이 없습니다.</div>`)
                            : `<div style="border:1.5px solid #fde68a; border-radius:12px; overflow:hidden; background:#fffdf7;">`
                              + live.map((s, i) => `
                                <div style="display:flex; align-items:stretch; ${i ? 'border-top:1px solid #fde68a;' : ''}">
                                    <span style="flex:0 0 92px; display:flex; align-items:center; justify-content:center; padding:13px 8px; border-right:1px solid #fde68a; font-size:14px; font-weight:800; color:#a16207; white-space:nowrap;">${gEsc(gSlotLabel(s))}</span>
                                    <span style="flex:1; min-width:0; display:flex; align-items:center; padding:13px 14px; font-size:19px; font-weight:900; color:#78350f; letter-spacing:1px; word-break:break-all;">${gEsc(s.pwd)}</span>
                                </div>`).join('')
                              + `</div>`)
                        + (gIsStore() ? `<button type="button" onclick="togglePwdEdit(true)" style="width:100%; margin-top:14px; padding:12px; border:1.5px solid #cbd5e1; background:#fff; color:#475569; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer;">✏️ 수정</button>` : '');
                    return;
                }

                // 고치기
                const editing = slots.slice();
                if (_pwdNewSlot) editing.push({ key: '', from: _pwdNewSlot.from, to: _pwdNewSlot.to, pwd: '', isNew: true });

                const cell = 'height:38px; padding:4px 8px; border:1.5px solid #e2e8f0; border-radius:8px; font-size:15px; font-weight:800; text-align:center; box-sizing:border-box;';
                const rowHtml = (s, i) => {
                    const isAll = (s.from == null);
                    const armed = (_pwdDelArmed === s.key && s.key);
                    return `<div data-slot="${i}" data-key="${gEsc(s.key)}" data-all="${isAll ? '1' : '0'}" style="padding:12px 0; ${i ? 'border-top:1px solid #f1f5f9;' : ''}">`
                        + `<div style="display:flex; align-items:center; gap:6px;">`
                        + (isAll
                            ? `<span style="flex:1; font-size:13px; font-weight:800; color:#94a3b8;">전체 (호수 구분 없음)</span>`
                            : `<input data-f type="number" inputmode="numeric" value="${s.from}" style="width:56px; ${cell}">`
                              + `<span style="font-size:13px; font-weight:800; color:#cbd5e1;">~</span>`
                              + `<input data-t type="number" inputmode="numeric" value="${s.to}" style="width:56px; ${cell}">`
                              + `<span style="font-size:13px; font-weight:800; color:#64748b; margin-right:auto;">호</span>`)
                        + `<button type="button" onclick="commitPwdSlot(${i})" style="height:38px; padding:0 14px; border:none; background:#10b981; color:#fff; border-radius:8px; font-size:12.5px; font-weight:800; cursor:pointer;">저장</button>`
                        + (s.key
                            ? `<button type="button" onclick="askDeletePwdSlot('${gEsc(s.key).replace(/'/g, "\\'")}')" style="height:38px; padding:0 11px; border:1.5px solid ${armed ? '#dc2626' : '#e2e8f0'}; background:${armed ? '#dc2626' : '#fff'}; color:${armed ? '#fff' : '#94a3b8'}; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer; white-space:nowrap;">${armed ? '한 번 더' : '삭제'}</button>`
                            : `<button type="button" onclick="cancelNewPwdSlot()" style="height:38px; padding:0 11px; border:1.5px solid #e2e8f0; background:#fff; color:#94a3b8; border-radius:8px; font-size:12px; font-weight:800; cursor:pointer;">취소</button>`)
                        + `</div>`
                        + `<input data-p type="text" value="${gEsc(s.pwd)}" placeholder="비번"`
                        + ` style="width:100%; box-sizing:border-box; margin-top:7px; height:46px; padding:8px 12px; border:1.5px solid #e2e8f0; border-radius:9px; font-size:18px; font-weight:900; letter-spacing:1px; text-align:center; background:#fff;">`
                        + `</div>`;
                };

                body.innerHTML =
                    (editing.length === 0
                        ? `<div style="padding:24px 0; text-align:center; color:#94a3b8; font-size:13px; font-weight:700;">칸이 없습니다.</div>`
                        : editing.map(rowHtml).join(''))
                    + `<button type="button" onclick="addPwdSlot()" style="width:100%; margin-top:12px; padding:12px; border:1.5px dashed #cbd5e1; background:#fff; color:#64748b; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer;">＋ 호수 칸 추가</button>`
                    + `<button type="button" onclick="togglePwdEdit(false)" style="width:100%; margin-top:7px; padding:12px; border:none; background:#475569; color:#fff; border-radius:10px; font-size:13px; font-weight:800; cursor:pointer;">✔ 마치기</button>`
                    + `<div style="margin-top:10px; font-size:11px; font-weight:700; color:#cbd5e1; line-height:1.6;">호수를 고치면 그 칸이 통째로 옮겨집니다. 고친 뒤 <b>저장</b>을 눌러 주세요.</div>`;
                return;
            }

            // ── 2단계: 동 고르기
            if (_pwdView.apt) {
                if (title) title.innerText = _pwdView.apt;
                const dongs = Object.keys(tree[_pwdView.apt] || {})
                    .filter(d => !q || d.toLowerCase().includes(q))
                    .sort((a, b) => (parseInt(a.replace(/\D/g, '')) || 9999) - (parseInt(b.replace(/\D/g, '')) || 9999) || a.localeCompare(b));
                body.innerHTML = dongs.length === 0
                    ? `<div style="padding:34px 0; text-align:center; color:#94a3b8; font-weight:700;">동이 없습니다.</div>`
                    : dongs.map(d => {
                        const ok = has(_pwdView.apt, d);
                        return listRow(`pwdPickDong('${gEsc(d).replace(/'/g, "\\'")}')`, gEsc(d), ok ? '🚪' : '', !ok);
                    }).join('');
                return;
            }

            // ── 1단계: 아파트 고르기
            if (title) title.innerText = '🚪 공동현관 비번';
            const apts = Object.keys(tree)
                .filter(a => !q || a.toLowerCase().includes(q))
                .sort((a, b) => {
                    if (a === '기타') return 1;
                    if (b === '기타') return -1;
                    return a.localeCompare(b, 'ko');
                });
            body.innerHTML = apts.length === 0
                ? `<div style="padding:34px 0; text-align:center; color:#94a3b8; font-weight:700;">찾는 아파트가 없습니다.</div>`
                : apts.map(a => {
                    const dongs = Object.keys(tree[a]);
                    const okCount = dongs.filter(d => has(a, d)).length;
                    return listRow(`pwdPickApt('${gEsc(a).replace(/'/g, "\\'")}')`, gEsc(a),
                        okCount ? `${okCount}개` : '', !okCount);
                }).join('');
        }

        function gEsc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        // 동 버튼 생성
        function renderDongButtons(aptOrders) {
            const dongContainer = document.getElementById('dong-buttons');
            dongContainer.innerHTML = '';

            // 아파트 주문 건 중 동 이름으로 분류 (묶어 둔 구역은 그 이름으로)
            const dongGroups = {};
            aptOrders.forEach(item => {
                const dongFormatted = getDongGroupName(item);
                if (!dongGroups[dongFormatted]) {
                    dongGroups[dongFormatted] = [];
                }
                dongGroups[dongFormatted].push(item);
            });

            const dongs = Object.keys(dongGroups).sort((a, b) => {
                const numA = parseInt(a.replace(/\D/g, "")) || 9999;
                const numB = parseInt(b.replace(/\D/g, "")) || 9999;
                if (numA !== numB) return numA - numB;
                return a.localeCompare(b);
            });

            if (dongs.length === 0) {
                document.getElementById('dong-section').style.display = 'none';
                document.getElementById('order-list').innerHTML = '<div style="text-align:center; padding:50px; font-weight:800; color:var(--text-sub); font-size: 14px;">동 정보 파싱에 실패한 주문만 있거나 배달이 없습니다.</div>';
                return;
            }

            document.getElementById('dong-section').style.display = 'block';

            if (!activeDong) {
                activeDong = "전체";
            } else if (activeDong !== "전체" && !dongs.includes(activeDong)) {
                // 기억해 둔 동이 이번 날짜엔 배달이 없을 때만 전체로 되돌린다
                activeDong = "전체";
                lastDongByApt[gAptKey(activeApartment)] = "전체";
            }

            // "전체" 버튼 생성
            const allBtn = document.createElement('button');
            allBtn.className = `btn-select dong-btn ${activeDong === '전체' ? 'active' : ''}`;
            allBtn.innerText = `전체 ${getDeliveryProgressText(aptOrders)}`;
            allBtn.onclick = () => {
                activeDong = "전체";
                lastDongByApt[gAptKey(activeApartment)] = "전체"; // 이 아파트에서 마지막으로 본 동
                document.querySelectorAll('.dong-btn').forEach(b => b.classList.remove('active'));
                allBtn.classList.add('active');
                renderOrderCards(aptOrders);
            };
            dongContainer.appendChild(allBtn);

            dongs.forEach(dong => {
                const btn = document.createElement('button');
                btn.className = `btn-select dong-btn ${dong === activeDong ? 'active' : ''}`;
                btn.innerText = `${dong} ${getDeliveryProgressText(dongGroups[dong])}`;
                btn.onclick = () => {
                    activeDong = dong;
                    lastDongByApt[gAptKey(activeApartment)] = dong; // 이 아파트에서 마지막으로 본 동
                    document.querySelectorAll('.dong-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderOrderCards(dongGroups[dong]);
                };
                dongContainer.appendChild(btn);
            });

            // 초기 렌더링 호출
            if (activeDong === "전체") {
                renderOrderCards(aptOrders);
            } else if (dongGroups[activeDong]) {
                renderOrderCards(dongGroups[activeDong]);
            } else {
                activeDong = "전체";
                allBtn.classList.add('active');
                renderOrderCards(aptOrders);
            }
        }

        // 주문 리스트 카드 렌더링
        function renderOrderCards(dongOrders) {
            const listContainer = document.getElementById('order-list');
            listContainer.innerHTML = '';

            // 동별 그룹화된 주문들의 호수 오름차순 정렬을 위한 헬퍼
            const extractHoNum = (item) => {
                const detail = String(item.addressDetail || "").trim();
                const addr = String(item.address || "").trim();

                // 1. 상세주소에서 "202호" 또는 "202 호"
                let match = detail.match(/([0-9]+)\s*호/);
                if (match) return parseInt(match[1]);

                // 2. 상세주소에서 "101-202" 또는 "101 - 202" (하이픈 뒤 숫자가 호)
                match = detail.match(/[0-9]+\s*-\s*([0-9]+)/);
                if (match) return parseInt(match[1]);

                // 3. 상세주소에서 "101동 202" -> 뒤쪽 숫자
                match = detail.match(/동\s*([0-9]+)/);
                if (match) return parseInt(match[1]);

                match = detail.match(/\b([0-9]+)\b\s*$/);
                if (match) return parseInt(match[1]);

                // 4. 주소 전체에서 "202호"
                match = addr.match(/([0-9]+)\s*호/);
                if (match) return parseInt(match[1]);

                return 9999;
            };

            // 동 순 오름차순 -> 동이 같으면 호수 오름차순 정렬 유틸
            const sortOrdersByDongAndHo = (a, b) => {
                // [수정] 묶어 둔 구역(빌라)은 이름으로 묶어 정렬한다.
                //  동 번호로 세면 '102호'의 첫 숫자를 동으로 넘겨짚어 순서가 뒤죽박죽이 된다.
                const zA = findCustomZoneName(a.address);
                const zB = findCustomZoneName(b.address);
                if (zA || zB) {
                    if (zA !== zB) return String(zA || '힣').localeCompare(String(zB || '힣'), 'ko');
                } else {
                    const dongA = getDongNumber(a.addressDetail, a.address);
                    const dongB = getDongNumber(b.addressDetail, b.address);
                    if (dongA !== dongB) return dongA - dongB;
                }

                const hoA = extractHoNum(a);
                const hoB = extractHoNum(b);
                if (hoA !== hoB) {
                    return hoA - hoB;
                }

                return String(a.name || "").localeCompare(String(b.name || ""));
            };

            // 정렬 처리
            if (activeApartment === "전체") {
                const customOrder = ["푸지1차", "푸지2차", "푸르지오", "센트리버", "리버나인", "더샵", "더샾", "칸타빌"];
                const getAptWeight = (name) => {
                    if (name === "기타") return 9999;
                    const idx = customOrder.indexOf(name);
                    return idx !== -1 ? idx : 1000;
                };

                dongOrders.sort((a, b) => {
                    const aptA = extractApartmentName(a.address);
                    const aptB = extractApartmentName(b.address);

                    if (aptA !== aptB) {
                        const wA = getAptWeight(aptA);
                        const wB = getAptWeight(aptB);
                        if (wA !== wB) return wA - wB;
                        return aptA.localeCompare(aptB);
                    }

                    return sortOrdersByDongAndHo(a, b);
                });
            } else {
                dongOrders.sort((a, b) => {
                    return sortOrdersByDongAndHo(a, b);
                });
            }

            // 고객별(전화번호 기준) 주문 그룹화
            const customerGroups = {};
            dongOrders.forEach(item => {
                const customerKey = normalizePhoneNumber(item.phone);
                if (!customerKey) return;

                if (!customerGroups[customerKey]) {
                    customerGroups[customerKey] = {
                        name: item.name || "이름 없음",
