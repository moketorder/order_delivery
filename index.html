                        phone: item.phone || "전화번호 없음",
                        address: item.address || "주소 없음",
                        addressDetail: item.addressDetail || "",
                        entrance: item.entrance || "",
                        itemsList: [],
                        orders: [],
                        status: "배달완료", // 기본 완료로 설정 후 미완료 주문 발견 시 하향 조정
                        deliveryPhoto: "",
                        deliveryPhotoExists: false,
                        deliveryPhotoTime: null
                    };
                }

                customerGroups[customerKey].orders.push(item);
                customerGroups[customerKey].itemsList.push({
                    name: item.item || "상품명 없음",
                    qty: item.qty || 1
                });

                if (item.entrance && !customerGroups[customerKey].entrance) {
                    customerGroups[customerKey].entrance = item.entrance;
                }

                if (item.deliveryPhotoExists && !customerGroups[customerKey].deliveryPhotoExists) {
                    customerGroups[customerKey].deliveryPhotoExists = true;
                    customerGroups[customerKey].deliveryPhotoTime = item.deliveryPhotoTime;
                }
                if (item.deliveryPhoto && !customerGroups[customerKey].deliveryPhoto) {
                    customerGroups[customerKey].deliveryPhoto = item.deliveryPhoto;
                    customerGroups[customerKey].deliveryPhotoTime = item.deliveryPhotoTime;
                }
            });

            // 고객별 통합 배달 상태 결정
            const groupedCustomers = Object.values(customerGroups);
            groupedCustomers.forEach(group => {
                const statuses = group.orders.map(o => o.status);
                const allDelivered = statuses.every(s => s === "배달완료");
                if (allDelivered) {
                    group.status = "배달완료";
                } else {
                    const hasStocked = statuses.some(s => s === "입고" || s === "배달완료");
                    group.status = hasStocked ? "입고" : "대기";
                }
            });

            // 대표 주문 기준 호수로 오름차순 정렬 (dongOrders의 순서대로 정렬)
            groupedCustomers.sort((a, b) => {
                return dongOrders.indexOf(a.orders[0]) - dongOrders.indexOf(b.orders[0]);
            });
            // 공동현관 비번 (동이 "전체"가 아닐 때만 노출)
            // [수정] '기타'는 빌라·다세대 모음이라 동마다 라인별 공동현관 비번이 없다.
            //  집집마다 비번이 달라 이 칸이 오히려 헷갈려서 빼둔다.
            // [수정] 1·2 / 3·4 두 칸으로 못 박아 두었는데, 아파트마다 라인 수가 달라 맞지 않았다.
            //  이제 '🚪 비번' 창에서 정한 호수 칸을 그대로 읽어 보여 준다. 고치는 것도 거기서 한다.
            if (activeDong !== "전체" && activeApartment !== "전체" && activeApartment !== "기타") {
                /* [수정] 그 동의 비번을 전부 늘어놓으니, 오늘 안 가는 호수 것까지 섞여 눈이 갔다.
                   오늘 배달 갈 호수가 든 칸만 보여 준다. (4호가 있으면 3~4호 칸)
                   호수를 못 읽는 주문이 섞여 있으면 놓치지 않게 전부 보여 준다. */
                const _allSlots = gSlotsOf(activeApartment, activeDong).filter(s => String(s.pwd || '').trim());
                const _hoLasts = new Set();
                let _unknownHo = false;
                groupedCustomers.forEach(g => {
                    const d = String((g.orders && g.orders[0] && g.orders[0].addressDetail) || g.addressDetail || '');
                    const hoN = gHoOf(d);
                    if (hoN != null) _hoLasts.add(hoN);
                    else _unknownHo = true;
                });
                const _fit = _allSlots.filter(s => s.from == null
                    || [..._hoLasts].some(h => h >= s.from && h <= s.to));
                const slots = (_unknownHo || _fit.length === 0) ? _allSlots : _fit;

                const pwdCard = document.createElement('div');
                /* [수정] 주문 카드와 짜임은 같게 두되, 색은 달리한다.
                   똑같이 회색·흰색이면 목록을 훑을 때 비번 카드인지 주문 카드인지 헷갈렸다.
                   테두리·머리줄을 살구빛으로 바꿔 한눈에 구분되게 하고, 짜임은 그대로 둔다. */
                pwdCard.className = 'rider-card';
                pwdCard.style.marginBottom = '14px';
                pwdCard.style.borderColor = '#fbbf24';
                pwdCard.style.background = '#fffdf7';
                pwdCard.innerHTML = `
                    <div class="rider-card-header" style="background:#fef3c7; border-bottom-color:#fbbf24;">
                        <span style="font-size:14px; font-weight:850; color:#92400e;">🚪 ${activeApartment} ${activeDong} 공동현관 비번</span>
                        ${gIsStore() ? `<button type="button" onclick="openPasswordFinder(); pwdPickApt('${gEsc(activeApartment).replace(/'/g, "\'")}'); pwdPickDong('${gEsc(activeDong).replace(/'/g, "\'")}'); togglePwdEdit(true);"
                            title="비번 고치기"
                            style="flex:0 0 auto; padding:4px 10px; border:1.5px solid #fbbf24; background:#fff; color:#b45309; border-radius:7px; font-size:11.5px; font-weight:800; cursor:pointer;">✏️ 수정</button>` : ''}
                    </div>
                    <div class="rider-card-body" style="gap:0; padding:10px 16px 12px;">
                        ${gCommonPwdOf(activeApartment) ? `
                                <div style="display:flex; align-items:stretch; gap:0; padding:7px 0;">
                                    <span style="flex:0 0 86px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; line-height:1.5; color:#a16207; white-space:nowrap; border-right:1px solid #fde68a; padding-right:14px;">공용</span>
                                    <span style="flex:1; min-width:0; display:flex; align-items:center; padding-left:16px; font-size:16px; font-weight:900; line-height:1.5; color:#78350f; word-break:break-all; letter-spacing:0.5px;">${gEsc(gCommonPwdOf(activeApartment))}</span>
                                </div>` : ''}
                        ${slots.length === 0
                            ? (gCommonPwdOf(activeApartment) ? '' : `<div style="font-size:12.5px; font-weight:700; color:#b7a894;">적어 둔 비번이 없습니다.</div>`)
                            : slots.map((s, i) => `
                                <div style="display:flex; align-items:stretch; gap:0; padding:7px 0; ${(i || gCommonPwdOf(activeApartment)) ? "border-top:1px solid #fde68a;" : ""}">
                                    <span style="flex:0 0 86px; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; line-height:1.5; color:#a16207; white-space:nowrap; border-right:1px solid #fde68a; padding-right:14px;">${gEsc(gSlotLabel(s))}</span>
                                    <span style="flex:1; min-width:0; display:flex; align-items:center; padding-left:16px; font-size:16px; font-weight:900; line-height:1.5; color:#78350f; word-break:break-all; letter-spacing:0.5px;">${gEsc(s.pwd)}</span>
                                </div>`).join('')}
                    </div>
                `;
                listContainer.appendChild(pwdCard);
            }

            groupedCustomers.forEach(customer => {
                const card = document.createElement('div');
                const isCompleted = customer.status === '배달완료';
                card.className = `rider-card ${isCompleted ? 'completed' : ''}`;
                // [신규] 완료된 카드에 누가 언제 배달했는지 (배달 기록에서 그날 것만 받아 온다)
                //  배달 완료 사진 줄 오른쪽에 붙인다. 사진이 없으면 그 자리에 배달자만 오른쪽에 둔다.
                const delivRec = isCompleted ? gDelivRecordOf(customer.orders) : null;

                // 호수 추출 (첫 대표 주문 기준)
                const representativeItem = customer.orders[0];
                let hoLabel = "";
                const hoNum = extractHoNum(representativeItem);
                if (hoNum !== 9999) {
                    hoLabel = hoNum + "호";
                } else {
                    hoLabel = representativeItem.addressDetail || "주소상세";
                }

                // 동 원본 번호 및 아파트 표시 분기
                const rawDong = getDongNumber(representativeItem.addressDetail, representativeItem.address);
                /* [신규] 빌라·다세대는 동 번호가 없어 '[기타] 102호'로만 떠서 어느 집인지 알 수 없었다.
                   대분류는 '기타' 그대로 두고, 동(棟) 자리에 사장님이 묶어 둔 구역 이름을 넣는다. */
                //  묶어 둔 구역이면 구역 이름을 먼저 쓴다. 빌라는 상세주소가 '102호'뿐인데
                //  getDongNumber가 그 첫 숫자를 동으로 넘겨짚어 '102동 102호'가 되곤 한다.
                const zoneName = findCustomZoneName(representativeItem.address);
                // 9999는 '동 없음'을 뜻하는 내부 값이다. 그대로 찍으면 '9999동'이 되므로 빈칸으로 둔다.
                const hasDong = rawDong && rawDong !== 9999;
                const dongLabel = zoneName ? `${zoneName} ` : (hasDong ? `${rawDong}동 ` : '');

                /* [수정] 아파트를 고르면 이름을 빼고 '102동 1304호'만 찍었다.
                   어느 아파트를 보고 있는지 카드만으로는 알 수 없어, 골랐을 때도 이름을 붙인다. */
                const aptName = extractApartmentName(representativeItem.address);
                /* [수정] 아파트는 '[아파트] 동·호수', 아파트가 아닌 곳(기타)은 '도로명주소 + 상세주소'로 보인다.
                   도로명주소는 시·도까지 떼고(예: 경기 수원시 → 영통구부터), 괄호 속 동네 이름도 뺀다. */
                const fullDongHo = (aptName && aptName !== '기타')
                    ? `[${aptName}] ${dongLabel}${hoLabel}`
                    : `${gShortRoadAddr(representativeItem.roadAddress || representativeItem.address)} ${String(representativeItem.addressDetail || '').trim()}`.trim();

                // 전화번호 포맷 정규화
                const cleanPhone = String(customer.phone || "").replace(/\D/g, "");

                // 입금 상태 판정
                const isAllPaid = customer.orders.every(o => o.paid === true || o.paid === "true" || o.paid === "True" || o.isPaid === true || o.isPaid === "true");
                const isAnyPaid = customer.orders.some(o => o.paid === true || o.paid === "true" || o.paid === "True" || o.isPaid === true || o.isPaid === "true");

                let paidBadgeHtml = '';
                if (isAllPaid) {
                    paidBadgeHtml = `<span style="font-size: 11px; font-weight: 800; background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; border: 1px solid #a5d6a7; display: inline-flex; align-items: center; gap: 2px;">💵 입금완료</span>`;
                } else if (isAnyPaid) {
                    paidBadgeHtml = `<span style="font-size: 11px; font-weight: 800; background: #fff8e1; color: #b78103; padding: 2px 6px; border-radius: 4px; border: 1px solid #ffe082; display: inline-flex; align-items: center; gap: 2px;">💵 부분입금</span>`;
                } else {
                    paidBadgeHtml = `<span style="font-size: 11px; font-weight: 800; background: #fef2f2; color: #ef4444; padding: 2px 6px; border-radius: 4px; border: 1px solid #fca5a5; display: inline-flex; align-items: center; gap: 2px;">🔴 미입금</span>`;
                }

                // 주문 상품 묶음 HTML 생성
                /* [신규] 배달비와 배달비 차감은 두 줄로 따로 보이지 않게, 더해서 최종 배달비 한 줄만 보여 준다.
                   (0원이 되면 줄을 아예 안 보인다) */
                const _isFeeRow = o => { const n = String((o && o.item) || '').trim(); return n === '배달비' || n === '배달비 차감'; };
                const _feeRows = customer.orders.filter(_isFeeRow);
                const _feeNet = _feeRows.reduce((s, o) => s + (parseInt(String(o.total || 0).replace(/,/g, '')) || 0), 0);
                // 입금한 배달비가 최종 배달비만큼 되면 입금완료 (예: 배달비 둘 중 하나만 입금 + 차감 하나 → 입금완료)
                const _isPaidRow = o => o.paid === true || o.paid === "true" || o.paid === "True" || o.isPaid === true || o.isPaid === "true";
                const _feePaidAmt = _feeRows.filter(o => _isPaidRow(o)).reduce((s, o) => s + Math.max(0, parseInt(String(o.total || 0).replace(/,/g, '')) || 0), 0);
                const _feePaid = _feeNet > 0 ? _feePaidAmt >= _feeNet : _feeRows.filter(o => (parseInt(String(o.total || 0).replace(/,/g, '')) || 0) < 0).every(_isPaidRow);
                let itemHtml = customer.itemsList.map((it, idx) => {
                    const origOrder = customer.orders[idx];
                    if (_isFeeRow(origOrder)) return '';
                    const isPaidItem = origOrder && (origOrder.paid === true || origOrder.paid === "true" || origOrder.paid === "True" || origOrder.isPaid === true || origOrder.isPaid === "true");
                    // [신규] 수기 배달 줄 — 입금 표시 대신 '수기', 가게는 지울 수 있다
                    if (origOrder && origOrder._manual) return `
                        <div class="item-row" style="display: flex; justify-content: space-between; align-items: center; gap:6px;">
                            <span>${gEsc(it.name)} <span class="man-tag">✍️ 수기</span></span>
                            <span style="display:inline-flex; align-items:center; gap:6px;">
                                <span class="item-qty">${it.qty}개</span>
                                ${gIsStore() ? `<button type="button" class="man-del" onclick="gManualDelete('${encAttr(origOrder.firebasePhoneKey)}', '${encAttr(origOrder.orderKey)}')">삭제</button>` : ''}
                            </span>
                        </div>`;
                    return `
                        <div class="item-row" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>${it.name} ${isPaidItem ? `<span style="font-size:10px; font-weight:800; background:#e8f5e9; color:#2e7d32; padding:1px 4px; border-radius:3px; margin-left:4px;">💵 입금완료</span>` : `<span style="font-size:10px; font-weight:800; background:#fef2f2; color:#ef4444; padding:1px 4px; border-radius:3px; margin-left:4px;">🔴 미입금</span>`}</span>
                            <span class="item-qty">${it.qty}개</span>
                        </div>
                    `;
                }).join('') + (_feeNet ? `
                        <div class="item-row" style="display: flex; justify-content: space-between; align-items: center;">
                            <span>${_feeNet > 0 ? '배달비' : '배달비 차감'} ${_feePaid ? `<span style="font-size:10px; font-weight:800; background:#e8f5e9; color:#2e7d32; padding:1px 4px; border-radius:3px; margin-left:4px;">💵 입금완료</span>` : `<span style="font-size:10px; font-weight:800; background:#fef2f2; color:#ef4444; padding:1px 4px; border-radius:3px; margin-left:4px;">🔴 미입금</span>`}</span>
                            <span class="item-qty">${_feeNet.toLocaleString()}원</span>
                        </div>` : '');

                // 묶음 주문의 모든 orderKey들을 쉼표로 연결하여 액션 파라미터로 넘김
                // [버그수정] 상품명에 쉼표(,)가 있으면 orderKey에 쉼표가 포함됨 → 쉼표 join/split 시 키가 쪼개져
                // 엉뚱한 유령 키에 PATCH되고 실제 주문은 미처리됨. 상품명에 없는 '|@@|'로 구분(주문관리.html과 동일).
                const orderKeysStr = customer.orders.map(o => o.orderKey).join('|@@|');

                // [신규] 이 고객 주문금액 총합 (취소 제외)
                const cardTotalAmount = customer.orders.reduce((s, o) => {
                    const canceled = (o.canceled === true || String(o.canceled).toUpperCase() === "TRUE");
                    return canceled ? s : s + (parseInt(o.total || 0) || 0);
                }, 0);

                card.innerHTML = `
                    <div class="rider-card-header">
                        <span class="unit-number">${fullDongHo}</span>
                        <span class="customer-name">${customer.name}</span>
                    </div>
                    <div class="rider-card-body">
                        <!-- [수정] '📋 복사' 단추가 자리를 많이 먹어 뗐다. 이제 주소줄을 누르면 도로명주소가 복사된다.
                             (동·호수와 괄호는 빼고 내비에 찍는 도로명주소만) -->
                        <div class="address-text${String(representativeItem.address || "").trim() ? ' addr-copy' : ''}"
                            ${String(representativeItem.address || "").trim() ? `onclick="copyAddrBar(this, '${encodeURIComponent(String(representativeItem.address || "").trim())}')"` : ''}>
                            <span class="addr-full">${representativeItem.address || ""} ${representativeItem.addressDetail || ""}</span>
                            ${String(representativeItem.address || "").trim() ? `<span class="ab-tip">📋</span>` : ''}
                        </div>
                        ${customer.entrance ? `
                            <div class="address-box" style="background:#eff6ff; border:1px solid #bfdbfe; color:#1d4ed8;">
                                🚪 공동현관 입력값: <b>${customer.entrance}</b>
                            </div>
                        ` : ''}
                        ${(() => {
                            /* [신규] 가게 메모와 손님 요청사항을 한자리에 모아 보여 준다.
                               문 앞에서 한 번에 눈에 들어와야 하므로 상자 하나에 줄로 쌓는다.
                                 · 🖨 인쇄메모 — 손님에게 붙어 다니는 말 (원래 인쇄물에 나가던 것)
                                 · 📝 주문메모 — 그 주문 한 건에만 붙는 말
                                 · 🙋 요청사항 — 손님이 주문할 때 적은 말
                               가게 안에서만 쓰는 고정메모는 뺀다. */
                            const esc = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
                            const cleanPhone = String(customer.phone || '').replace(/\D/g, '');
                            const baseKey = cleanPhone || (String(customer.name || '무명').trim() + '_비인증');

                            const rows = [];
                            const printMemo = String(riderPrintMemos[baseKey] || '').trim();
                            if (printMemo) rows.push(['🖨', '인쇄메모', printMemo, '#7c3aed']);

                            const seen = new Set();
                            (customer.orders || []).forEach(o => {
                                const m = String(riderOrderMemos[baseKey + '_' + String((o && o.timestamp) || '').replace(/\s+/g, '')] || '').trim();
                                if (m && !seen.has(m)) { seen.add(m); rows.push(['📝', '주문메모', m, '#b45309']); }
                            });

                            // [수정] 여러 번 주문하면 요청사항도 여러 개 — 첫 것만 보이던 것을 다른 글이면 모두 보여 준다
                            const seenNote = new Set();
                            (customer.orders || []).forEach(o => {
                                const n = String((o && o.note) || '').trim();
                                // [신규] 수기 배달의 메모는 손님 말이 아니라 가게가 적은 말이다
                                if (n && !seenNote.has(n)) { seenNote.add(n); rows.push(o._manual ? ['✍️', '가게메모', n, '#6d28d9'] : ['🙋', '요청사항', n, '#1d4ed8']); }
                            });

                            if (!rows.length) return '';
                            const line = ([ico, lab, txt, color]) => `
                                <div style="display:flex; gap:6px; align-items:baseline; line-height:1.5;">
                                    <span style="flex:0 0 74px; display:flex; gap:3px; align-items:baseline; color:${color}; font-weight:900;">
                                        <span style="flex:0 0 15px; text-align:center;">${ico}</span>
                                        <span style="flex:1; text-align:center;">${lab}</span>
                                    </span>
                                    <span style="flex:1; min-width:0; color:${color}; font-weight:800; word-break:break-all;">${esc(txt)}</span>
                                </div>`;
                            return `<div class="address-box" style="background:#fffbeb; border:1.5px solid #fcd34d; display:flex; flex-direction:column; gap:3px;">
                                ${rows.map(line).join('')}
                            </div>`;
                        })()}
                        
                        <div class="item-list">
                            ${itemHtml}
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; padding-top:8px; border-top:1.5px solid #e5e7eb; font-weight:900; font-size:14px;">
                            <span>주문금액 총합</span>
                            <span style="color:var(--primary);">${cardTotalAmount.toLocaleString()}원</span>
                        </div>

                        ${(customer.deliveryPhotoExists || customer.deliveryPhoto || delivRec) ? `
                            <div class="photo-thumbnail-container">
                                ${(customer.deliveryPhotoExists || customer.deliveryPhoto) ? `
                                <span style="font-size:11px; font-weight:800; color:var(--primary);">📸 배달 완료 사진:</span>
                                ${customer.deliveryPhoto ? `
                                    <img src="${customer.deliveryPhoto}" class="photo-thumbnail" onclick="viewDeliveryPhotoRemote('${customer.phone}', '${encAttr(customer.orders[0].orderKey)}')">
                                ` : `
                                    <button class="btn-action-sm" style="font-size: 11px; padding: 4px 8px; cursor: pointer; border-radius: 4px; border: 1.5px solid var(--primary); background: #f0fdf4; color: var(--primary); font-weight: bold; height: auto; width: auto; line-height: 1.2;" onclick="viewDeliveryPhotoRemote('${customer.phone}', '${encAttr(customer.orders[0].orderKey)}')">보기 (클릭)</button>
                                `}` : ''}
                                ${delivRec ? `<span style="margin-left:auto; font-size:12px; font-weight:800; color:#475569; white-space:nowrap;">🚚 ${gDelivWhoLabel(delivRec)}</span>` : ''}
                            </div>
                        ` : ''}
                    </div>
                    <div class="rider-card-footer no-print">
                        <a href="tel:${cleanPhone}" class="btn-action btn-call">📞 전화</a>
                        <a href="sms:${cleanPhone}" class="btn-action btn-sms">💬 문자</a>
                        <button class="btn-action btn-photo" onclick="triggerCameraUpload('${customer.phone}', '${encAttr(orderKeysStr)}', '${encAttr(customer.name)}')">📸 사진업로드</button>
                        <button class="btn-action btn-complete" onclick="markAsDelivered('${customer.phone}', '${encAttr(orderKeysStr)}', '${encAttr(customer.name)}')">🚚 배달완료</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 공동현관 비밀번호 저장 — [변경] 라인별('12'=1·2라인 / '34'=3·4라인)
        async function saveEntrancePassword(line) {
            if (!gIsStore()) return;   // [신규] 가게 계정만
            if (!activeApartment || !activeDong) return;
            const is34 = (line === '34');
            const input = document.getElementById(is34 ? "entrance-password-input-34" : "entrance-password-input-12");
            if (!input) return;
            const pwd = input.value.trim();
            const dongKeyName = is34 ? `${activeDong}_3-4라인` : `${activeDong}_1-2라인`;
            showLoader("공동현관 비밀번호 저장 중...");
            try {
                const aptKey = encodeURIComponent(gAptRoadKey(activeApartment));
                const dongKey = encodeURIComponent(dongKeyName);
                const url = `${FIREBASE_DB_URL}entrance_passwords/${aptKey}/${dongKey}.json`;
                const res = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pwd)
                });
                if (!res.ok) throw new Error("Firebase 저장 실패");
                showToast(`${is34 ? '3·4' : '1·2'} 라인 공동현관 비밀번호가 저장되었습니다.`);

                if (!entrancePasswords[activeApartment]) {
                    entrancePasswords[activeApartment] = {};
                }
                entrancePasswords[activeApartment][dongKeyName] = pwd;
            } catch (e) {
                console.error(e);
                showToast("저장에 실패했습니다.");
            } finally {
                hideLoader();
            }
        }

        // 단순 배달 완료 처리 (여러 주문 일괄 처리)
        // [신규] onclick 속성에 문자열을 안전하게 담기 위한 인코딩(따옴표/쉼표/특수문자 대응). 핸들러에서 decodeURIComponent로 복원.
        function encAttr(s){ return encodeURIComponent(String(s == null ? '' : s)).replace(/'/g, '%27'); }
        function decAttr(s){ try { return decodeURIComponent(String(s == null ? '' : s)); } catch(e){ return String(s == null ? '' : s); } }

        /* ── [신규] 배달 기록 (deliveries) ─────────────────────────────
           누가 언제 배달했는지 주문 줄과 따로, '집 하나 · 하루 · 한 칸'으로 남긴다. (기사 정산용)
           주문 줄에 붙이면 상품마다 같은 내용이 적히고, 10일 뒤 저장함으로 넘어가 월말에 모으기 무겁다.
             deliveries / 2026-10 / 14 / 집키 = { rider, riderName, at, name, apt, detail, items, keys,
                                                photo, photoAt, photoBy }
           - 집키는 그 손님 주문이 담긴 서랍 이름(대표키)이다.
           - 날짜는 배달 예정일(기사가 보는 날짜 탭)이다. 실제로 누른 시각은 at 에 남는다.
           - 기사·완료 시각은 처음 누른 사람 것으로 남는다. 다시 눌러도 안 바뀌고 사진만 바뀐다.
           주문 줄에는 지금처럼 배달완료 표시만 한다(주문관리·손님 주문내역·저장함 이관이 그걸 본다). */
        const DELIV_NODE = 'deliveries';
        let deliveryRecordCache = {};      // 'YYYY-MM/DD' -> { 집키: 기록 }  (한 번 받은 날짜)
        const _delivQueue = new Set();     // 받아야 할 'YYYY-MM/DD'
        let _delivTimer = null;

        function gDelivParts(item) {
            const m = String(getOrderDateInfo(item).dateStr || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
            return m ? { month: `${m[1]}-${m[2]}`, day: m[3], ymd: `${m[1]}-${m[2]}-${m[3]}` } : null;
        }
        function gHouseKeyOf(item) {
            return String((item && (item.firebasePhoneKey || normalizePhoneNumber(item.phone))) || '').replace(/\D/g, '');
        }
        function gIsFeeItem(item) {
            const n = String((item && item.item) || '').trim();
            return n === '배달비' || n === '배달비 차감';
        }
        // 카드의 주문키들을 실제 주문 줄로 바꾼다 (같은 손님 것을 먼저 찾는다)
        function gRowsOfKeys(orderKeys, cleanPhone) {
            return orderKeys.map(k =>
                rawOrders.find(it => it.orderKey === k && (normalizePhoneNumber(it.phone) === cleanPhone || gHouseKeyOf(it) === cleanPhone))
                || rawOrders.find(it => it.orderKey === k)
            ).filter(Boolean);
        }
        function gIsAllDelivered(orderKeys, cleanPhone) {
            const rows = gRowsOfKeys(orderKeys, cleanPhone);
            return rows.length > 0 && rows.every(o => o.status === '배달완료' || o.delivered === true || String(o.delivered).toUpperCase() === 'TRUE');
        }
        function gOpenDoneSms(cleanPhone, customerName) {
            const messageText = `[모켓] ${customerName || '고객'}님, 주문하신 상품의 배달이 완료되었습니다. 감사합니다.🙇🏻‍♂️`;
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            window.location.href = `sms:${cleanPhone}${isIOS ? '&' : '?'}body=${encodeURIComponent(messageText)}`;
        }

        /* 한 번의 '배달'·'사진' 처리에 들어간 주문들을 날짜·집마다 한 칸씩 기록한다.
           날짜 탭이 '전체'면 한 카드에 여러 날짜 주문이 섞일 수 있어 날짜마다 따로 쓴다.
           실패해도 배달완료는 그대로 두고, 끝까지 성공했는지만 돌려준다. */
        async function gWriteDeliveryRecords(orderKeys, cleanPhone, opts) {
            const me = window.gStaffMe || {};
            const who = me.name || me.email || '';
            const now = Date.now();
            const groups = {};
            gRowsOfKeys(orderKeys, cleanPhone).forEach(o => {
                const parts = gDelivParts(o), house = gHouseKeyOf(o);
                if (!parts || !house) return;
                const id = `${parts.month}/${parts.day}/${house}`;
                (groups[id] = groups[id] || { parts, house, rows: [] }).rows.push(o);
            });

            let allOk = true;
            for (const id of Object.keys(groups)) {
                const g = groups[id];
                const url = `${FIREBASE_DB_URL}${DELIV_NODE}/${id}.json`;
                try {
                    let cur = null;
                    const r0 = await fetch(url);
                    if (r0.ok) cur = await r0.json();

                    let body, method;
                    if (cur && cur.rider) {
                        // 이미 기록이 있으면 기사·시각은 그대로 두고 사진만 바꾼다
                        if (!(opts && opts.photo)) { gDelivPut(g.parts, g.house, cur); continue; }
                        body = { photo: true, photoAt: now, photoBy: who };
                        method = 'PATCH';
                    } else {
                        const rep = g.rows[0];
                        body = {
                            rider: me.uid || '', riderName: who, at: now,
                            name: rep.name || '',
                            apt: extractApartmentName(rep.address) || '',
                            detail: String(rep.addressDetail || '').trim(),
                            items: g.rows.filter(o => !gIsFeeItem(o)).length,
                            keys: g.rows.map(o => o.orderKey)
                        };
                        if (opts && opts.photo) Object.assign(body, { photo: true, photoAt: now, photoBy: who });
                        method = 'PUT';
                    }
                    const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    if (!r.ok) throw new Error(`서버 응답 ${r.status}`);
                    gDelivPut(g.parts, g.house, Object.assign({}, cur || {}, body));
                } catch (e) {
                    console.warn('배달 기록 저장 실패:', id, e);
                    allOk = false;
                }
            }
            return allOk;
        }
        function gDelivPut(parts, house, rec) {
            const ck = `${parts.month}/${parts.day}`;
            if (!deliveryRecordCache[ck]) deliveryRecordCache[ck] = {};
            deliveryRecordCache[ck][house] = rec;
        }

        // 카드에 '누가 · 언제'를 띄우려고 그 카드의 기록을 찾는다. 아직 안 받은 날짜면 받아 오게 줄 세운다.
        function gDelivRecordOf(orders) {
            for (const o of (orders || [])) {
                const parts = gDelivParts(o), house = gHouseKeyOf(o);
                if (!parts || !house) continue;
                const ck = `${parts.month}/${parts.day}`;
                if (!deliveryRecordCache[ck]) { gDelivNeed(ck); continue; }
                const rec = deliveryRecordCache[ck][house];
                if (rec) return Object.assign({ _ymd: parts.ymd }, rec);
            }
            return null;
        }
        function gDelivNeed(ck) {
            _delivQueue.add(ck);
            if (_delivTimer) return;
            _delivTimer = setTimeout(gDelivLoadQueued, 60);
        }
        /* 그날 것만 받는다(하루 몇 KB). 한 달에서 4일 넘게 필요하면(날짜 탭 '전체') 그 달을 한 번에 받는다.
           실패해도 빈 칸으로 적어 두어 같은 날짜를 계속 다시 받지 않게 한다. */
        async function gDelivLoadQueued() {
            _delivTimer = null;
            const want = [..._delivQueue].filter(ck => !deliveryRecordCache[ck]);
            _delivQueue.clear();
            if (!want.length) return;
            const byMonth = {};
            want.forEach(ck => { const [m, d] = ck.split('/'); (byMonth[m] = byMonth[m] || []).push(d); });
            for (const m of Object.keys(byMonth)) {
                const days = byMonth[m];
                try {
                    if (days.length >= 4) {
                        const r = await fetch(`${FIREBASE_DB_URL}${DELIV_NODE}/${m}.json`);
                        const data = r.ok ? (await r.json()) || {} : {};
                        Object.keys(data).forEach(d => { deliveryRecordCache[`${m}/${d}`] = data[d] || {}; });
                        days.forEach(d => { if (!deliveryRecordCache[`${m}/${d}`]) deliveryRecordCache[`${m}/${d}`] = {}; });
                    } else {
                        await Promise.all(days.map(async d => {
                            const r = await fetch(`${FIREBASE_DB_URL}${DELIV_NODE}/${m}/${d}.json`);
                            deliveryRecordCache[`${m}/${d}`] = r.ok ? (await r.json()) || {} : {};
                        }));
                    }
                } catch (e) {
                    days.forEach(d => { if (!deliveryRecordCache[`${m}/${d}`]) deliveryRecordCache[`${m}/${d}`] = {}; });
                }
            }
            renderFilteredData();
        }
        // '홍길동 · 14:32' — 배달 예정일과 다른 날 눌렀으면 날짜도 붙인다
        function gDelivWhoLabel(rec) {
            const t = new Date(parseInt(rec.at) || 0);
            if (!rec.at || isNaN(t)) return gEsc(rec.riderName || '');
            const hm = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
            const ymd = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
            const when = (rec._ymd && rec._ymd !== ymd) ? `${t.getMonth() + 1}/${t.getDate()} ${hm}` : hm;
            return `${gEsc(rec.riderName || '')} · ${when}`;
        }

        /* ── [신규] 수기 배달 (가게만 넣고 지운다. 배달완료·사진·문자는 기사도 주문처럼 한다) ── */
        // 받아 둔 수기 배달을 주문 줄 모양으로 rawOrders 에 섞는다
        function gMergeManual() {
            rawOrders = rawOrders.filter(o => !o._manual);
            Object.keys(manualDeliveries || {}).forEach(house => {
                const box = manualDeliveries[house];
                if (!box || typeof box !== 'object') return;
                Object.keys(box).forEach(key => {
                    const it = box[key];
                    if (!it || typeof it !== 'object' || !it.item) return;
                    const delivered = it.delivered === true || String(it.delivered).toUpperCase() === 'TRUE';
                    rawOrders.push(Object.assign({}, it, {
                        firebasePhoneKey: house, phone: it.phone || house, orderKey: key,
                        _manual: true, status: delivered ? '배달완료' : '입고'
                    }));
                });
            });
        }

        // 아파트 이름을 고르면 주소 칸에는 도로명(없으면 이름 조각)을 넣어 아파트·동 묶음이 맞게 한다
        function gManualAddrOf(text) {
            const t = String(text || '').trim();
            const hit = APT_TABLE.find(a => a && a.name === t);
            if (!hit) return t;
            const road = (hit.roads || [])[0];
            return road ? `${road} (${hit.name})` : ((hit.words || [])[0] || hit.name);
        }
        function gYmdOfView() {
            const y = parseInt(currentYear), m = parseInt(currentMonth), d = parseInt(currentDay);
            if (y && m && d) return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            return dlogYmd(new Date());
        }
        function openManual() {
            if (!gIsStore()) { showToast('가게 계정만 넣을 수 있습니다.'); return; }
            closeSettings();
            ['man-phone', 'man-name', 'man-addr', 'man-detail', 'man-memo'].forEach(id => { document.getElementById(id).value = ''; });
            document.getElementById('man-item').value = '';
            document.getElementById('man-date').value = gYmdOfView();
            const dl = document.getElementById('man-apts');
            dl.innerHTML = [...new Set(APT_TABLE.map(a => a.name))].map(n => `<option value="${gEsc(n)}"></option>`).join('');
            document.getElementById('man-hint').textContent = '';
            document.getElementById('man-find').value = '';
            document.getElementById('man-find-list').innerHTML = '';
            const post = document.getElementById('man-post'); post.style.display = 'none'; post.innerHTML = '';
            manualRoad = ''; manualEntrance = '';
            document.getElementById('manual-modal').style.display = 'flex';
            manualLoadCustomers();
            setTimeout(() => document.getElementById('man-find').focus(), 50);
        }
        function closeManual() { document.getElementById('manual-modal').style.display = 'none'; }

        /* [신규] 손님 찾기 — 손님 명부(customers, 가게만 읽음)와 지금 받아 둔 주문을 합쳐 이름·번호로 찾는다.
           명부는 창을 처음 열 때 한 번만 받는다(기사 앱이라 평소엔 안 받는다). 못 받아도 주문 손님은 찾힌다. */
        let manualCustomers = null;      // [{ phone, name, address, addressDetail, entrance, roadAddress }]
        let manualRoad = '';             // 주소 검색으로 고른 도로명주소
        let manualEntrance = '';         // 고른 손님의 공동현관 입력값
        async function manualLoadCustomers() {
            if (manualCustomers) return;
            const map = {};
            const put = (phone, v) => {
                const p = normalizePhoneNumber(phone);
                if (!/^01\d{8,9}$/.test(p)) return;
                const cur = map[p] || (map[p] = { phone: p });
                ['name', 'address', 'addressDetail', 'entrance', 'roadAddress'].forEach(f => {
                    const x = String((v && v[f]) || '').trim();
                    if (x && !cur[f]) cur[f] = x;
                });
            };
            try {
                const r = await fetch(`${FIREBASE_DB_URL}customers.json`);
                const c = r.ok ? (await r.json()) || {} : {};
                Object.keys(c).forEach(k => { const x = c[k] || {}; if (x.withdrawn) return; put(k, Object.assign({}, x, { name: x.name || x.kakaoName || '' })); });
            } catch (e) { console.warn('손님 명부 불러오기 실패:', e); }
            // 주문에만 있는 손님도 넣는다 (주소는 상세주소가 붙어 있을 수 있어 떼어 낸다)
            rawOrders.forEach(o => {
                if (o._manual) return;
                const detail = String(o.addressDetail || '').trim();
                let addr = String(o.address || '').trim();
                if (detail && addr.endsWith(detail)) addr = addr.slice(0, -detail.length).trim();
                put(o.phone, { name: o.name, address: addr, addressDetail: detail, entrance: o.entrance, roadAddress: o.roadAddress });
            });
            manualCustomers = Object.values(map);
            const q = (document.getElementById('man-find') || {}).value;
            if (q) manualFind(q);
        }
        function manualFind(q) {
            const box = document.getElementById('man-find-list');
            const s = String(q || '').trim();
            if (!s) { box.innerHTML = ''; return; }
            if (!manualCustomers) { box.innerHTML = '<div class="none">손님 명부 받는 중...</div>'; return; }
            const digits = s.replace(/\D/g, '');
            const word = s.replace(/\s+/g, '');
            const hits = manualCustomers.filter(c =>
                (digits.length >= 3 && c.phone.includes(digits))
                || (!digits && String(c.name || '').replace(/\s+/g, '').includes(word))
            ).slice(0, 8);
            if (!hits.length) { box.innerHTML = '<div class="none">찾는 손님이 없습니다</div>'; return; }
            box.innerHTML = hits.map(c => {
                const apt = extractApartmentName(c.roadAddress || c.address);
                const place = (apt && apt !== '기타') ? `[${apt}] ${c.addressDetail || ''}` : `${gShortRoadAddr(c.address || '')} ${c.addressDetail || ''}`;
                const ph = c.phone.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3');
                return `<button type="button" onclick="manualPick('${c.phone}')"><b>${gEsc(c.name || '이름 없음')} · ${ph}</b><small>${gEsc(place.trim() || '주소 없음')}</small></button>`;
            }).join('');
        }
        function manualPick(phone) {
            const c = (manualCustomers || []).find(x => x.phone === phone);
            if (!c) return;
            const set = (id, v) => { document.getElementById(id).value = v || ''; };
            set('man-phone', c.phone); set('man-name', c.name); set('man-addr', c.address); set('man-detail', c.addressDetail);
            manualRoad = c.roadAddress || '';
            manualEntrance = c.entrance || '';
            document.getElementById('man-find').value = '';
            document.getElementById('man-find-list').innerHTML = '';
            document.getElementById('man-hint').textContent = `${c.name || ''} 손님을 골랐습니다`;
            document.getElementById('man-item').focus();
        }
        /* [신규] 주소 검색 — 주문관리와 같은 다음 우편번호 창. 폰에서 새 창이 막히지 않게 이 창 안에 펼친다. */
        function gLoadPostcode() {
            return new Promise((resolve, reject) => {
                if (window.daum && window.daum.Postcode) return resolve();
                const s = document.createElement('script');
                s.src = 'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('주소 검색을 불러오지 못했습니다. 인터넷을 확인해 주세요.'));
                document.head.appendChild(s);
            });
        }
        async function manualAddrSearch() {
            const box = document.getElementById('man-post');
            if (box.style.display !== 'none') { box.style.display = 'none'; box.innerHTML = ''; return; }
            try { await gLoadPostcode(); } catch (e) { showToast(e.message); return; }
            box.innerHTML = '';
            box.style.display = 'block';
            new daum.Postcode({
                oncomplete: function (data) {
                    let addr = (data.userSelectedType === 'R') ? data.roadAddress : data.jibunAddress;
                    let extra = '';
                    if (data.userSelectedType === 'R') {
                        if (data.bname && /[동|로|가]$/.test(data.bname)) extra += data.bname;
                        if (data.buildingName && data.apartment === 'Y') extra += (extra ? ', ' + data.buildingName : data.buildingName);
                        if (extra) extra = ' (' + extra + ')';
                    }
                    document.getElementById('man-addr').value = addr + extra;
                    manualRoad = String(data.roadAddress || '');
                    box.style.display = 'none'; box.innerHTML = '';
                    document.getElementById('man-detail').focus();
                },
                width: '100%', height: '100%'
            }).embed(box, { autoClose: false });
        }
        // 번호를 다 적으면 예전 주문에서 이름·주소를 찾아 빈칸만 채운다
        function manualPhoneLookup() {
            const p = normalizePhoneNumber(document.getElementById('man-phone').value);
            const hint = document.getElementById('man-hint');
            if (p.length < 10) { hint.textContent = ''; return; }
            // 손님 명부에 있으면 그것으로 채운다
            if ((manualCustomers || []).some(c => c.phone === p)) {
                const nm = document.getElementById('man-name').value.trim(), ad = document.getElementById('man-addr').value.trim();
                if (!nm && !ad) { manualPick(p); return; }
            }
            const hit = rawOrders.find(o => !o._manual && normalizePhoneNumber(o.phone) === p && String(o.address || '').trim());
            if (!hit) { hint.textContent = '처음 보는 번호'; return; }
            const fill = (id, v) => { const el = document.getElementById(id); if (!el.value.trim() && v) el.value = String(v).trim(); };
            fill('man-name', hit.name);
            // 주문 줄 주소에는 상세주소가 붙어 있을 수 있어 떼어 낸다
            const detail = String(hit.addressDetail || '').trim();
            let addr = String(hit.address || '').trim();
            if (detail && addr.endsWith(detail)) addr = addr.slice(0, -detail.length).trim();
            fill('man-addr', addr);
            fill('man-detail', detail);
            hint.textContent = `${hit.name || ''} 손님 주소를 채웠습니다`;
        }
        async function manualSave() {
            if (!gIsStore()) return;
            const v = id => document.getElementById(id).value.trim();
            const phone = normalizePhoneNumber(v('man-phone'));
            const ymd = v('man-date');
            if (!/^\d{4}-\d{2}-\d{2}$/.test(ymd)) { showToast('날짜를 골라 주세요.'); return; }
            if (phone.length < 9) { showToast('전화번호를 적어 주세요.'); return; }
            if (!v('man-addr')) { showToast('주소를 적어 주세요.'); return; }
            const me = window.gStaffMe || {};
            const key = 'm' + Date.now();
            // 같은 손님 주문이 있으면 공동현관 입력값도 이어 쓴다
            const prev = rawOrders.find(o => normalizePhoneNumber(o.phone) === phone && o.entrance);
            const row = {
                item: v('man-item') || '수기 배달', qty: 1, total: 0,
                name: v('man-name') || '이름 없음', phone,
                address: gManualAddrOf(v('man-addr')), addressDetail: v('man-detail'),
                roadAddress: manualRoad || '',
                note: v('man-memo'), entrance: manualEntrance || (prev && prev.entrance) || '',
                pickupDate: ymd, timestamp: `${ymd} 00:00:00`, shippingMethod: '배달주문',
                manual: true, by: me.name || me.email || '', at: Date.now()
            };
            showLoader('수기 배달 넣는 중...');
            try {
                const r = await fetch(`${FIREBASE_DB_URL}${MANUAL_NODE}/${phone}/${key}.json`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(row)
                });
                if (!r.ok) throw new Error('서버 응답 ' + r.status);
                (manualDeliveries[phone] = manualDeliveries[phone] || {})[key] = row;
                try { localStorage.setItem('moket_manual_cache', JSON.stringify(manualDeliveries)); } catch (e) { }
                gMergeManual();
                // 넣은 날짜로 옮겨 바로 보이게 한다
                const [y, m, d] = ymd.split('-').map(Number);
                currentYear = `${y}년`; currentMonth = `${m}월`; currentDay = `${d}일`;
                buildDateTabs();
                closeManual();
                showToast(`${m}/${d} 수기 배달을 넣었습니다.`);
            } catch (e) {
                console.warn(e);
                showToast('⚠️ 넣지 못했습니다. (규칙 게시 전이면 막혀 있습니다)');
            } finally { hideLoader(); }
        }
        /* 수기 배달 지우기 (가게만). 배달완료한 것이면 그 집·그날 배달 기록도 이 줄로만 된 것일 때 같이 지운다
           (정산 건수에서 빠진다). 주문과 같이 묶인 기록이면 기록은 그대로 둔다. */
        async function gManualDelete(houseEnc, keyEnc) {
            if (!gIsStore()) return;
            const house = decAttr(houseEnc), key = decAttr(keyEnc);
            const row = rawOrders.find(o => o._manual && o.orderKey === key);
            if (!row) return;
            const done = row.status === '배달완료';
            if (!confirm(`수기 배달을 지울까요?\n${row.name || ''} · ${row.item || ''}${done ? '\n\n배달완료한 건이라 정산 건수에서도 빠집니다.' : ''}`)) return;
            showLoader('지우는 중...');
            try {
                const r = await fetch(`${FIREBASE_DB_URL}${MANUAL_NODE}/${encodeURIComponent(house)}/${encodeURIComponent(key)}.json`, { method: 'DELETE' });
                if (!r.ok) throw new Error('서버 응답 ' + r.status);
                fetch(`${FIREBASE_DB_URL}delivery_photos/${encodeURIComponent(house)}/${encodeURIComponent(key)}.json`, { method: 'DELETE' }).catch(() => { });
                const parts = gDelivParts(row);
                if (done && parts) {
                    const url = `${FIREBASE_DB_URL}${DELIV_NODE}/${parts.month}/${parts.day}/${encodeURIComponent(house)}.json`;
                    try {
                        const r0 = await fetch(url);
                        const rec = r0.ok ? await r0.json() : null;
                        if (rec && Array.isArray(rec.keys) && rec.keys.every(k => k === key)) {
                            const rd = await fetch(url, { method: 'DELETE' });
                            if (rd.ok && deliveryRecordCache[`${parts.month}/${parts.day}`]) delete deliveryRecordCache[`${parts.month}/${parts.day}`][house];
                        }
                    } catch (e) { console.warn('배달 기록 정리 실패:', e); }
                }
                if (manualDeliveries[house]) delete manualDeliveries[house][key];
                try { localStorage.setItem('moket_manual_cache', JSON.stringify(manualDeliveries)); } catch (e) { }
                gMergeManual();
                buildDateTabs();
                showToast('지웠습니다.');
            } catch (e) { console.warn(e); showToast('⚠️ 지우지 못했습니다.'); }
            finally { hideLoader(); }
        }

        async function markAsDelivered(phone, orderKeysStr, customerName) {
            orderKeysStr = decAttr(orderKeysStr);
            customerName = decAttr(customerName);
            const cleanPhone = normalizePhoneNumber(phone);
            const orderKeys = orderKeysStr.split("|@@|");
            // [신규] 이미 완료된 카드면 다시 처리하지 않고, 완료 문자만 다시 보낼지 묻는다
            //  (문자를 깜빡하고 못 보냈을 때 다시 보내려는 용도)
            if (gIsAllDelivered(orderKeys, cleanPhone)) {
                if (!confirm("이미 완료된 건입니다.\n문자를 다시 보낼까요?")) return;
                gOpenDoneSms(cleanPhone, customerName);
                return;
            }
            if (!confirm("배달 완료 처리하시겠습니까?")) return;
            showLoader("배달 완료 처리 중...");
            try {
                const promises = [];
                const patchBody = {
                    status: "배달완료",
                    canceled: false,
                    isStocked: true,
                    delivered: true
                };

                orderKeys.forEach(orderKey => {
                    const target = rawOrders.find(it => it.orderKey === orderKey);
                    // [버그수정] 여러 전화번호 변형(정규화·숫자만·82붙임 등)에 전부 PATCH하면, 실제 주문이 없는
                    // 변형 경로마다 상태 플래그만 있는 '유령 주문'이 새로 생성됨. 실제 저장 노드 키(firebasePhoneKey)
                    // 한 곳에만 PATCH해서 유령 생성을 원천 차단 (target 없으면 정규화 번호로 폴백).
                    const pKey = (target && target.firebasePhoneKey) ? String(target.firebasePhoneKey).trim()
                               : (target && target.phone) ? normalizePhoneNumber(target.phone)
                               : cleanPhone;
                    // [신규] 수기 배달 줄은 주문이 아니라 manual_deliveries 에 표시한다
                    const node = (target && target._manual) ? MANUAL_NODE : 'orders';
                    const url = `${FIREBASE_DB_URL}${node}/${encodeURIComponent(pKey)}/${encodeURIComponent(orderKey)}.json`;
                    // [수정] 예전에는 응답을 확인하지 않아, 저장이 실패해도 화면만 '배달완료'로 바뀌었다.
                    //  (전체를 다시 받아 확인하던 방식은 매번 450KB가 들어 없앴다)
                    //  성공할 때까지 3번 다시 시도하고, 끝내 실패하면 아래에서 오류로 알린다.
                    promises.push((async () => {
                        let lastErr = null;
                        for (let a = 1; a <= 3; a++) {
                            try {
                                const r = await fetch(url, {
                                    method: 'PATCH',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(patchBody)
                                });
                                if (!r.ok) throw new Error(`서버 응답 ${r.status}`);
                                return true;
                            } catch (e) {
                                lastErr = e;
                                await new Promise(res => setTimeout(res, 400 * a));
                            }
                        }
                        throw new Error(`배달완료 저장 실패: ${lastErr ? lastErr.message : ''}`);
                    })());
                });

                await Promise.all(promises);

                // [신규] 누가 언제 배달했는지 배달 기록에 남긴다 (기사 정산용).
                //  실패해도 배달완료는 이미 저장됐으니 그대로 두고 알리기만 한다.
                const recOk = await gWriteDeliveryRecords(orderKeys, cleanPhone, {});

                // 로컬 메모리 rawOrders 및 UI 즉시 회색 전환
                orderKeys.forEach(orderKey => {
                    const targets = rawOrders.filter(it => it.orderKey === orderKey || (normalizePhoneNumber(it.phone) === cleanPhone && it.orderKey === orderKey));
                    targets.forEach(t => {
                        Object.assign(t, patchBody);
                        t.status = "배달완료";
                        t.delivered = true;
                    });
                });
                renderFilteredData();

                showToast(recOk ? "배달 완료 처리되었습니다." : "배달 완료 처리했지만 ⚠️ 배달 기록은 남기지 못했습니다.");

                // 완료 메시지 발송 모달/연동 호출
                const messageText = `[모켓] ${customerName}님, 주문하신 상품의 배달이 완료되었습니다. 감사합니다.🙇🏻‍♂️`;
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const separator = isIOS ? '&' : '?';
                const smsUrl = `sms:${cleanPhone}${separator}body=${encodeURIComponent(messageText)}`;

                setTimeout(() => {
                    window.location.href = smsUrl;
                }, 800);

                // [수정] 여기서 전체 주문(약 450KB)을 다시 받고 있었다. 바로 위에서 rawOrders와 화면을
                //  이미 고쳐 놓았으므로 다시 받을 이유가 없다. 필요하면 '🔄 갱신'을 누른다.
            } catch (e) {
                console.error(e);
                // 저장에 실패했으면 화면도 그대로 둔다(회색 전환은 위에서 성공한 뒤에만 한다)
                showToast("⚠️ 배달완료 처리에 실패했습니다. 다시 시도해 주세요.");
            } finally {
                hideLoader();
            }
        }

        // 카메라 사진 업로드 준비
        let activeUploadKeys = [];
        let activeUploadCustomerName = "";
        function triggerCameraUpload(phone, orderKeysStr, customerName) {
            orderKeysStr = decAttr(orderKeysStr);
            customerName = decAttr(customerName);
            // [신규] 이미 완료된 카드면 사진을 다시 찍을지 먼저 묻는다 (잘못 찍었을 때 바꾸려는 용도)
            if (gIsAllDelivered(orderKeysStr.split("|@@|"), normalizePhoneNumber(phone))) {
                if (!confirm("이미 완료된 건입니다.\n사진을 다시 찍을까요?")) return;
            }
            activeUploadPhone = phone;
            activeUploadKeys = orderKeysStr.split("|@@|");
            activeUploadCustomerName = customerName;
            document.getElementById('camera-input').click();
        }

        // 배달 완료 사진 업로드 처리 (여러 주문 일괄 처리)
        async function handleDeliveryPhotoUpload(event) {
            const file = event.target.files[0];
            if (!file || !activeUploadPhone) return;
            showLoader("사진 압축 및 업로드 중...");
            try {
                const compressedBase64 = await resizeAndCompressImage(file);
                const cleanPhone = normalizePhoneNumber(activeUploadPhone);

                const patchBody = {
                    status: "배달완료",
                    canceled: false,
                    isStocked: true,
                    delivered: true,
                    deliveryPhoto: null,
                    deliveryPhotoExists: true,
                    deliveryPhotoTime: Date.now()
                };

                const allKeysToPatch = new Set(activeUploadKeys || []);

                const promises = [];
                allKeysToPatch.forEach(orderKey => {
                    // [버그수정] 여러 전화번호 변형에 전부 PATCH하면 없는 경로마다 유령이 생김.
                    // 실제 저장 노드 키(firebasePhoneKey) 한 곳에만 PATCH (target 없으면 정규화 번호 폴백).
                    const target = rawOrders.find(it => it.orderKey === orderKey);
                    const pKey = (target && target.firebasePhoneKey) ? String(target.firebasePhoneKey).trim()
                               : (target && target.phone) ? normalizePhoneNumber(target.phone)
                               : cleanPhone;
                    const node = (target && target._manual) ? MANUAL_NODE : 'orders';   // 수기 배달 줄
                    const url = `${FIREBASE_DB_URL}${node}/${encodeURIComponent(pKey)}/${encodeURIComponent(orderKey)}.json`;
                    const p = fetch(url, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(patchBody)
                    }).then(async (res) => {
                        if (!res.ok) throw new Error("Firebase 전송 실패");

                        // 실제 이미지 데이터는 delivery_photos 노드에 별도 저장
                        // [수정] 사진 저장 응답도 확인한다. 예전에는 사진이 안 올라가도 완료로 처리됐다.
                        const pr = await fetch(`${FIREBASE_DB_URL}delivery_photos/${encodeURIComponent(pKey)}/${encodeURIComponent(orderKey)}.json`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ photo: compressedBase64 })
                        });
                        if (!pr.ok) throw new Error(`사진 저장 실패 (서버 응답 ${pr.status})`);
                    });
                    promises.push(p);
                });

                await Promise.all(promises);

                // [신규] 배달 기록에도 남긴다. 처음이면 기사·시각까지, 이미 있으면 사진 시각만 바꾼다.
                const recOk = await gWriteDeliveryRecords([...allKeysToPatch], cleanPhone, { photo: true });

                // 로컬 메모리 rawOrders 및 UI 즉시 회색 전환
                rawOrders.forEach(t => {
                    if (normalizePhoneNumber(t.phone) === cleanPhone && allKeysToPatch.has(t.orderKey)) {
                        Object.assign(t, patchBody);
                        t.status = "배달완료";
                        t.delivered = true;
                        t.deliveryPhotoExists = true;
                        t.deliveryPhoto = compressedBase64;
                    }
                });
                renderFilteredData();

                showToast(recOk ? "배달 사진이 업로드되었으며, 배달 완료 처리되었습니다."
                                : "사진을 올렸지만 ⚠️ 배달 기록은 남기지 못했습니다.");

                // 완료 메시지 발송 모달/연동 호출
                const customerName = activeUploadCustomerName || "고객";
                const messageText = `[모켓] ${customerName}님, 주문하신 상품의 배달이 완료되었습니다. 감사합니다.🙇🏻‍♂️`;
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                const separator = isIOS ? '&' : '?';
                const smsUrl = `sms:${cleanPhone}${separator}body=${encodeURIComponent(messageText)}`;

                activeUploadPhone = "";
                activeUploadKeys = [];
                activeUploadCustomerName = "";

                setTimeout(() => {
                    window.location.href = smsUrl;
                }, 800);

                // [수정] 여기서 전체 주문(약 450KB)을 다시 받고 있었다. 바로 위에서 rawOrders와 화면을
                //  이미 고쳐 놓았으므로 다시 받을 이유가 없다. 필요하면 '🔄 갱신'을 누른다.
            } catch (e) {
                console.error(e);
                showToast("⚠️ 사진 업로드에 실패했습니다. 배달완료 처리도 되지 않았습니다.");
            } finally {
                hideLoader();
                event.target.value = "";
            }
        }

        // 사진 팝업 모달
        async function viewDeliveryPhotoRemote(phone, orderKey) {
            orderKey = decAttr(orderKey);
            // [수정] 사진을 새로 올리면 올린 시각(deliveryPhotoTime)이 바뀐다. 그 시각까지 넣어 기억해야
            //  예전에 한 번 본 사진이 계속 뜨지 않는다.
            const _po = (rawOrders || []).find(o => o.orderKey === orderKey);
            const photoKey = phone + "_" + orderKey + "@" + ((_po && _po.deliveryPhotoTime) || "");
            let photoData = window.deliveryPhotos ? window.deliveryPhotos[photoKey] : null;
            if (!photoData) {
                showLoader("사진 가져오는 중...");
                try {
                    // [수정] 사진은 저장할 때 대표키(서랍 이름, firebasePhoneKey)로 넣는다.
                    //  찾을 때도 같은 값으로 찾아야 두 값이 다른 손님의 사진이 보인다.
                    const raw = String(phone || "").replace(/\D/g, "");
                    const hit = (rawOrders || []).find(o =>
                        String(o.firebasePhoneKey || "").replace(/\D/g, "") === raw
                        || String(o.phone || "").replace(/\D/g, "") === raw
                    );
                    const cleanPhone = (hit && String(hit.firebasePhoneKey || "").replace(/\D/g, "")) || raw;
                    const res = await fetch(`${FIREBASE_DB_URL}delivery_photos/${cleanPhone}/${orderKey}.json?t=${Date.now()}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.photo) {
                            photoData = data.photo;
                            if (!window.deliveryPhotos) window.deliveryPhotos = {};
                            window.deliveryPhotos[photoKey] = photoData;
                        }
                    }
                } catch (e) {
                    console.error("배달 사진 가져오기 실패:", e);
                } finally {
                    hideLoader();
                }
            }
            if (photoData) {
                viewDeliveryPhoto(photoKey, photoData);
            } else {
                showToast("사진 데이터를 찾을 수 없습니다.");
            }
        }

        window.deliveryPhotos = {};
        function viewDeliveryPhoto(key, photoData) {
            const modal = document.getElementById("photo-modal");
            const modalImg = document.getElementById("photo-modal-img");
            if (modal && modalImg) {
                modalImg.src = photoData;
                modal.style.display = "flex";
            }
        }

        // 사진 모달 닫기
        function closePhotoModal() {
            const modal = document.getElementById("photo-modal");
            if (modal) modal.style.display = "none";
        }

        // 검색어 입력 이벤트
        function handleSearchInput() {
            renderFilteredData();
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            if (input) {
                input.value = '';
                renderFilteredData();
            }
        }

        // 유틸 UI 효과
        function showLoader(text = "처리 중입니다...") {
            document.getElementById('loader-text').innerText = text;
            document.getElementById('loader').style.display = 'flex';
        }

        function hideLoader() {
            document.getElementById('loader').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2500);
        }

        window.onload = function () {
            // [수정] 앱을 열 때 한 번만 받는다.
            //  예전에는 화면이 켜지거나(visibilitychange) 다른 앱에서 돌아올 때(pageshow)마다
            //  전체 주문(약 450KB)을 다시 받아, 문자·사진·지도로 오갈 때마다 데이터가 크게 나갔다.
            //  이제 최신 주문이 필요하면 위의 '🔄 갱신' 버튼을 누른다.
            // [신규] 묶어 둔 구역 이름을 먼저 받아 둔다. 몇 KB라 부담이 없고,
            //  이게 없으면 빌라가 전부 '기타'로 떠서 어느 집인지 알 수 없다.
            Promise.all([
                loadApartmentCustom().catch(e => console.warn('구역 자료 실패:', e)),
                loadApartmentTable().catch(e => console.warn('아파트 표 실패:', e)),
                loadApartmentOrder().catch(e => console.warn('아파트 순서 실패:', e))
            ]).finally(() => loadData());
        };
    </script>

    <!-- [신규] 정산 화면 모양 — 앱 색(모켓 초록·주황·회색)을 그대로 쓴다.
         요약을 맨 위에, 기사는 한 목록 안의 줄로, 단가·기사·금액·지급은 칸을 맞춰 세운다. -->
    <style>
        .pay-sum { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--radius-sub); overflow:hidden; margin-bottom:12px; }
        .pay-sum > div { background:var(--bg-color); padding:9px 10px; display:flex; flex-direction:column; gap:2px; min-width:0; }
        .pay-sum span { font-size:11px; font-weight:800; color:var(--text-sub); }
        .pay-sum b { font-size:15px; font-weight:900; color:var(--text-main); font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .pay-sum b.due { color:var(--secondary); }

        .pay-list { border:1px solid var(--border); border-radius:var(--radius-sub); overflow:hidden; background:var(--card-color); }
        /* 칸 너비를 못박아 줄마다 세로로 딱 맞게. 단위(건·원)는 머리줄에만 둔다 */
        /* 이름은 짧게 고정, 남는 자리는 금액이 가져가 오른쪽에 선다. 지급 기록 표도 같은 칸을 써서 세로로 맞는다.
           맨 오른쪽 좁은 칸은 상세보기(펼치기) 단추 — 사용자 지정 */
        /* 칸 순서: 기사 · 단가 · 건수 · 금액 · 지급 · 상세 (2026-10-01 사용자 최종 지정) */
        /* 기사 · 단가 · 건수 · 금액 네 칸은 같은 너비로 나눈다 (사용자 지정) */
        .pay-head, .pay-row, .pay-hrow { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)) 50px 22px; gap:5px; align-items:center; padding:0 6px; }
        .pay-head { height:30px; border-bottom:1px solid var(--border); font-size:11px; font-weight:800; color:var(--text-sub); }
        /* [수정] 기사 · 단가 · 건수 · 금액은 모두 칸 가운데 — 머리글, 기사 줄, 지급 기록 표가 같은 자리에 선다 */
        .pay-head > span, .pay-row .amt, .pay-hrow > span { text-align:center; }
        .pay-cnt { display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.2; font-variant-numeric:tabular-nums; }
        .pay-cnt b { font-size:14px; font-weight:900; color:var(--text-main); white-space:nowrap; }
        .pay-cnt em { font-style:normal; font-size:10.5px; font-weight:900; color:var(--secondary); background:var(--secondary-light); border-radius:999px; padding:0 5px; white-space:nowrap; }
        .pay-row { min-height:56px; border-top:1px solid #e2e8f0; }
        .pay-head + .pay-item .pay-row { border-top:none; }
        .pay-who .nm small { transition:transform .15s; display:inline-block; }

        .pay-rate { position:relative; }
        .pay-rate input { width:100%; height:34px; box-sizing:border-box; padding:0 6px; border:1.5px solid var(--border); border-radius:8px; font:inherit; font-size:13.5px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums; color:var(--text-main); background:var(--card-color); }
        .pay-rate input:focus { outline:none; border-color:var(--blue); }
        .pay-rate input:disabled { background:var(--bg-color); color:var(--text-sub); }
        .pay-rate i { position:absolute; right:7px; top:50%; transform:translateY(-50%); font-style:normal; font-size:11.5px; font-weight:800; color:var(--text-sub); pointer-events:none; }

        .pay-who { min-width:0; cursor:default; display:flex; flex-direction:column; align-items:center; gap:1px; text-align:center; }
        .pay-who .nm { max-width:100%; font-size:14px; font-weight:900; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .pay-who .nm small { font-size:10px; color:#94a3b8; margin-left:2px; }
        .pay-who .ct { font-size:12px; font-weight:800; color:var(--text-sub); white-space:nowrap; font-variant-numeric:tabular-nums; }
        .pay-who .ct em { font-style:normal; color:var(--secondary); margin-left:3px; }
        .pay-row .amt { font-size:13px; font-weight:900; color:var(--text-main); white-space:nowrap; font-variant-numeric:tabular-nums; }
        .pay-row .amt.zero { color:#94a3b8; }

        .pay-act { width:50px; height:36px; border-radius:8px; font:inherit; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.15; }
        .pay-act.go { border:none; background:var(--primary); color:#fff; font-size:13px; font-weight:900; }
        .pay-act.go:active { background:var(--primary-hover); }
        .pay-act.done { border:1.5px solid #a7f3d0; background:var(--primary-light); color:var(--primary-hover); font-size:12.5px; font-weight:900; }
        .pay-act.done small { font-size:10px; font-weight:800; }
        .pay-act:focus-visible, .pay-who:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

        .pay-act.go small { font-size:10.5px; font-weight:800; opacity:0.9; }

        /* 펼친 부분은 한 바탕(옅은 회색) 한 판. 지급 기록 · 날짜별 건수에 이름표를 단다 */
        .pay-days { background:var(--bg-color); border-top:1px solid #e2e8f0; padding-bottom:6px; }
        .pay-sec { padding:10px 10px 4px; font-size:11px; font-weight:800; color:var(--text-sub); }
        .pay-day { display:flex; align-items:center; gap:8px; padding:7px 12px 7px 20px; font-size:13px; font-weight:800; color:var(--text-main); border-top:1px solid #e2e8f0; }
        .pay-day:first-child { border-top:none; }
        .pay-day .n { margin-left:auto; color:var(--text-sub); font-variant-numeric:tabular-nums; }

        /* 날짜별 건수 달력 */
        .pay-cal { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:4px; padding:2px 12px 8px; }
        .pay-cal-w { text-align:center; font-size:10.5px; font-weight:800; color:var(--text-sub); padding-bottom:2px; }
        .pay-cal-w.sun, .pay-cal-d.sun i { color:var(--red); }
        /* 날짜 칸은 모두 같은 크기·테두리. 배달한 날은 흰 칸, 없는 날(휴일 등)은 점선 빈 칸으로 한 단계 흐리게 */
        .pay-cal-d { height:36px; box-sizing:border-box; border-radius:6px; border:1px solid #e2e8f0; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.1; }
        .pay-cal-d i { font-style:normal; font-size:10px; font-weight:700; color:#94a3b8; }
        .pay-cal-d b { font-size:13px; font-weight:900; color:var(--text-main); font-variant-numeric:tabular-nums; }
        .pay-cal-d.on { background:var(--card-color); }
        .pay-cal-d.off { background:transparent; border-style:dashed; border-color:var(--border); }
        .pay-cal-d.off i { color:#b6c2d1; }
        .pay-cal-d.off b { color:#cbd5e1; font-weight:800; }
        /* [신규] 할증 */
        .pay-cal-d.sur { border-color:#fdba74; background:#fff7ed; }
        .pay-sur { margin:0 0 10px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--card-color); display:flex; flex-direction:column; gap:8px; }
        .pay-me .pay-sur { margin:0 12px 10px; }
        .pay-sur-line { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
        .pay-sur-t { font-size:12px; font-weight:900; color:#c2410c; margin-right:2px; }
        .pay-sur-none { font-size:12px; font-weight:700; color:#94a3b8; }
        .pay-sur-chip { height:26px; padding:0 9px; border:1px solid #fdba74; background:#fff7ed; color:#9a3412; border-radius:999px; font:inherit; font-size:12px; font-weight:700; display:inline-flex; align-items:center; gap:3px; cursor:pointer; font-variant-numeric:tabular-nums; }
        span.pay-sur-chip { cursor:default; }
        .pay-sur-chip b { font-weight:900; }
        .pay-sur-chip.on { background:#fb923c; border-color:#fb923c; color:#fff; }
        .pay-sur-add { width:26px; height:26px; border:1px dashed #fdba74; background:transparent; color:#c2410c; border-radius:999px; font:inherit; font-size:14px; font-weight:900; cursor:pointer; padding:0; }
        .pay-sur-edit { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
        .pay-sur-edit input[type=date] { height:34px; box-sizing:border-box; padding:0 6px; border:1.5px solid var(--border); border-radius:8px; font:inherit; font-size:13px; font-weight:700; color:var(--text-main); background:var(--card-color); }
        .pay-sur-edit .pay-rate { width:80px; }
        .pay-sur-edit button { height:34px; padding:0 10px; border:1px solid var(--border); background:var(--card-color); color:var(--text-sub); border-radius:8px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; }
        .pay-sur-edit button.go { border:none; background:#f97316; color:#fff; }
        .pay-sur-n { display:block; font-size:9.5px; font-weight:800; color:#c2410c; line-height:1.1; }

        /* 상세보기 단추 — 맨 오른쪽 */
        .pay-more { width:22px; height:36px; border:none; background:transparent; color:#94a3b8; font:inherit; font-size:12px; cursor:pointer; border-radius:6px; padding:0; }
        .pay-more.open { color:var(--blue); background:var(--blue-light); }
        .pay-more:focus-visible { outline:2px solid var(--blue); outline-offset:1px; }

        /* 지급 기록 표 — 칸은 위 기사 줄과 같다 */
        .pay-htable { margin:0 0 2px; }
        .pay-hrow { min-height:30px; font-size:12.5px; font-weight:800; color:var(--primary-hover); font-variant-numeric:tabular-nums; border-top:1px solid #e2e8f0; }
        .pay-hrow.head { min-height:24px; font-size:10.5px; color:var(--text-sub); border-top:none; }
        .pay-hrow .c { text-align:center; }
        .pay-hrow .r { font-weight:900; }
        .pay-hrow .d { white-space:nowrap; }
        .pay-hrow.due { color:var(--secondary); }
        .pay-hrow button { height:24px; padding:0 8px; border:1px solid var(--border); background:var(--card-color); color:var(--text-sub); border-radius:6px; font:inherit; font-size:11px; font-weight:800; cursor:pointer; }
        .pay-empty { padding:30px 0; text-align:center; font-size:13px; font-weight:800; color:#94a3b8; }

        .pay-me { border:1px solid var(--border); border-radius:var(--radius-sub); overflow:hidden; background:var(--card-color); }
        .pay-me-top { padding:14px; display:flex; flex-direction:column; gap:8px; }
        .pay-me-top .r1 { display:flex; align-items:center; gap:8px; }
        .pay-me-top .r1 b { flex:1; min-width:0; font-size:15px; font-weight:900; color:var(--text-main); }
        .pay-me-top .r2 { display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums; }
        .pay-me-top .r2 span { font-size:13px; font-weight:800; color:var(--text-sub); }
        .pay-me-top .r2 b { margin-left:auto; font-size:20px; font-weight:900; color:var(--text-main); }
        .pay-pill { font-size:11.5px; font-weight:900; padding:3px 8px; border-radius:999px; background:var(--primary-light); color:var(--primary-hover); border:1px solid #a7f3d0; white-space:nowrap; }
        .pay-pill.wait { background:var(--secondary-light); color:var(--secondary); border-color:#fed7aa; }
    </style>

    <!-- [신규] 배달 기록 창 — 날짜를 고르면 그날 누가 어느 집에 몇 시에 갔는지 (가게 계정만) -->
    <style>
        .dlog-bar { display:flex; align-items:center; gap:6px; padding:11px 15px; border-bottom:1px solid #e2e8f0; }
        .dlog-bar button { flex:0 0 40px; height:40px; border:1.5px solid var(--border); background:var(--card-color); color:var(--text-sub); border-radius:9px; font:inherit; font-size:16px; font-weight:900; cursor:pointer; }
        .dlog-bar input { flex:1; min-width:0; height:40px; box-sizing:border-box; border:1.5px solid var(--border); border-radius:9px; padding:0 10px; font:inherit; font-size:14px; font-weight:800; color:var(--text-main); background:var(--card-color); text-align:center; }
        .dlog-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
        .dlog-chip { height:30px; padding:0 11px; border:1.5px solid var(--border); background:var(--card-color); color:var(--text-sub); border-radius:999px; font:inherit; font-size:12.5px; font-weight:800; cursor:pointer; font-variant-numeric:tabular-nums; }
        .dlog-chip.on { background:var(--text-main); border-color:var(--text-main); color:#fff; }
        .dlog-list { border:1px solid var(--border); border-radius:var(--radius-sub); overflow:hidden; background:var(--card-color); }
        .dlog-row { display:grid; grid-template-columns:42px minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 12px; border-top:1px solid #e2e8f0; }

        .dlog-row .h b { font-size:13.5px; font-weight:900; color:var(--text-main); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .dlog-row .h span { font-size:11.5px; font-weight:700; color:var(--text-sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .dlog-row .r { font-size:12.5px; font-weight:900; color:var(--text-main); white-space:nowrap; text-align:right; }
        .dlog-row .r small { display:block; font-size:10.5px; font-weight:800; color:var(--primary-hover); }
        /* [신규] 건수만 추가 */
        .dlog-row .r .man-del { display:block; margin-left:auto; }
        .dlog-add { width:100%; height:40px; margin-top:10px; border:1.5px dashed var(--border); background:transparent; color:var(--text-sub); border-radius:10px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
        .dlog-addbox { margin-top:10px; padding:10px; border:1.5px solid #ddd6fe; background:#faf5ff; border-radius:10px; display:flex; flex-direction:column; gap:8px; }
        .dlog-addrow { display:flex; align-items:center; gap:6px; }
        .dlog-addbox select, .dlog-addbox input { height:38px; box-sizing:border-box; border:1.5px solid var(--border); border-radius:8px; padding:0 9px; font:inherit; font-size:13.5px; font-weight:700; color:var(--text-main); background:var(--card-color); min-width:0; }
        .dlog-addbox select { flex:1; }
        .dlog-addbox #dlog-add-n { width:56px; text-align:center; flex:0 0 auto; }
        .dlog-addbox .u { font-size:13px; font-weight:800; color:var(--text-sub); }
        .dlog-addbox button { flex:1; height:38px; border:1px solid var(--border); background:var(--card-color); color:var(--text-sub); border-radius:8px; font:inherit; font-size:13px; font-weight:800; cursor:pointer; }
        .dlog-addbox button.go { border:none; background:#7c3aed; color:#fff; }
    </style>
    <div id="dlog-modal" style="display:none; position:fixed; z-index:10052; left:0; top:0; width:100%; height:100%; background:rgba(15,23,42,0.55); align-items:center; justify-content:center; padding:14px; box-sizing:border-box;" onclick="if(event.target===this) closeDlog()">
        <div style="background:#fff; border-radius:16px; width:100%; max-width:440px; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.25);">

                <button type="button" onclick="closeDlog(); openSettings();" style="flex:0 0 auto; width:34px; height:34px; border:1.5px solid #e2e8f0; background:#fff; color:#475569; border-radius:9px; font-size:15px; font-weight:800; cursor:pointer;">‹</button>
                <div style="flex:1; font-size:15px; font-weight:900; color:#0f172a;">📋 배달 기록</div>
                <span onclick="closeDlog()" style="flex:0 0 auto; font-size:24px; font-weight:800; color:#94a3b8; cursor:pointer; line-height:1;">&times;</span>
            </div>
            <div class="dlog-bar">

                <button type="button" onclick="dlogShift(1)" aria-label="다음날">›</button>
            </div>
            <div id="dlog-body" style="overflow-y:auto; padding:12px 15px 16px;"></div>

    <!-- [신규 2026-10-04] 창이 떠 있는 동안 뒤 화면 멈추기 (사장님 요청 — 주문서·주문관리·배달기사 세 앱 공통)
         화면을 거의 다 덮는 창(위치 고정·보임·불투명)이 하나라도 떠 있으면 뒤 화면을 그 자리에 고정하고, 다 닫히면 보던 자리로 돌려놓는다.
         예전엔 body 에 overflow:hidden 만 걸어서 아이폰·카카오톡 안 브라우저에서는 그래도 뒤가 굴러갔다.
         창을 열고 닫을 때마다 부를 필요 없이 화면이 바뀌는 것을 지켜보다 알아서 맞춘다.
         빼고 싶은 큰 덮개가 있으면 그 칸에 data-no-scroll-lock 을 붙인다. -->
    <script>
    (function () {
        let lockY = null, raf = 0;
        function covers(el) {
            if (!el || el.nodeType !== 1 || el.hasAttribute('data-no-scroll-lock')) return false;
            const cs = getComputedStyle(el);
            if (cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden' || cs.pointerEvents === 'none') return false;
            if (parseFloat(cs.opacity) < 0.05) return false;
            const r = el.getBoundingClientRect();
            return r.width >= window.innerWidth * 0.9 && r.height >= window.innerHeight * 0.85;
        }
        function anyOpen() {
            for (const el of document.body.children) if (covers(el)) return true;
            return false;
        }
        function lock() {
            if (lockY !== null) return;
            lockY = window.scrollY || 0;
            const b = document.body.style;
            b.position = 'fixed'; b.top = (-lockY) + 'px'; b.left = '0'; b.right = '0'; b.width = '100%';
        }
        function unlock() {
            if (lockY === null) return;
            const y = lockY; lockY = null;
            const b = document.body.style;
            b.position = ''; b.top = ''; b.left = ''; b.right = ''; b.width = '';
            window.scrollTo(0, y);
        }
        function check() { raf = 0; if (anyOpen()) lock(); else unlock(); }
        function soon() { if (!raf) raf = requestAnimationFrame(check); }
        new MutationObserver(soon).observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style', 'class', 'hidden', 'open'] });
        document.addEventListener('transitionend', soon, true);
        window.addEventListener('resize', soon);
        window.gScrollLockCheck = soon;   // 필요하면 직접 불러도 된다
        soon();
    })();
    </script>
